<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>對外回覆編輯 — FPMC</title>
<style>
:root{
  --navy:#1c3a5e; --navy-2:#234a72; --navy-3:#2f6690;
  --paper:#f5f7f8; --card:#ffffff; --line:#dde4e8; --line-2:#c3ced5;
  --ink:#15262f; --ink-2:#52656f; --ink-3:#8195a0;
  --signal:#e8842c; --signal-d:#c96a14;
  --ok:#2e8b57; --bad:#c0392b;
  --sans:"Segoe UI","Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);font-family:var(--sans);color:var(--ink)}
.wrap{max-width:1200px;margin:0 auto;padding:0 0 70px}
header{background:var(--navy);color:#fff;padding:22px 18px}
header h1{margin:0;font-size:19px}
header p{margin:6px 0 0;font-size:13px;color:#b9c8d6;line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:14px;padding:16px}
.card h2{font-size:15px;margin:0 0 4px}
.hint{color:var(--ink-3);font-size:12px;line-height:1.7}
.hint.warn{color:var(--signal-d);background:#fff4e8;border:1px solid #f3d9b8;border-radius:8px;padding:10px 12px}
label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-2);font-weight:600}
label.full{grid-column:1/-1}
textarea{padding:11px 12px;border:1px solid var(--line-2);border-radius:8px;font-size:15px;font-family:var(--sans);color:var(--ink);background:#fff;width:100%;resize:vertical;min-height:64px;line-height:1.5}
textarea:focus{outline:2px solid var(--navy-3);outline-offset:1px}
input[type=text]{padding:9px 10px;border:1px solid var(--line-2);border-radius:8px;font-size:14px;font-family:var(--sans)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:#fff;color:var(--ink);padding:10px 15px;border-radius:8px;font-size:13.5px;cursor:pointer;font-family:var(--sans);font-weight:600}
.btn.primary{background:var(--signal);border-color:var(--signal);color:#fff}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.ghost{background:#fff}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.55;cursor:not-allowed}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;z-index:99;max-width:90vw;text-align:center}
#toast.err{background:var(--bad)}
#toast.ok2{background:var(--ok)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--navy);color:#dce9f1;text-align:left;padding:8px 9px;font-size:11.5px;white-space:nowrap}
.tbl td{padding:8px 9px;border-bottom:1px solid var(--line)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
.badge.s1{background:#fff4e8;color:#c96a14}
.badge.s2{background:#eef4ff;color:var(--navy-3)}
.badge.s3{background:#fdf2e9;color:#a35d1a}
.badge.imp{background:#eaf5ee;color:#1f6b4a}
.badge.nimp{background:#fdecea;color:#a33}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.defbox{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:#fafbfc}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>✏ 對外回覆編輯</h1>
    <p id="hdr-note">讀取中…</p>
  </header>

  <div id="listView" style="display:none">
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <h2 style="margin:0">📋 對外回覆案件清單</h2>
        <button class="btn sm" style="margin-left:auto" onclick="loadList()">🔄 重新整理</button>
      </div>
      <p class="hint" style="margin-top:6px">列出所有已建立過的對外回覆案件，可查看目前階段、確認次數、是否已被正式系統匯入採用。點船名可直接開啟該筆編輯。</p>
      <div id="listBody" style="margin-top:10px"></div>
    </div>
  </div>

  <div id="editView" style="display:none">
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px">
        <h2 style="margin:0" id="edit-title">對外回覆</h2>
        <a href="?" class="btn sm ghost" style="margin-left:auto">← 回清單</a>
      </div>
      <p class="hint" id="edit-meta"></p>
      <div class="hint warn" style="margin:10px 0">
        <b>三階段，可重複調整：</b> ①主管填中文 → ②承辦人員AI翻譯英文 → ③中英文並排，主管確認。
        按「已確認」不會鎖死——之後還能再調整、再按一次「已確認」，最新一次確認的內容就是最終版本，正式系統會採用最新確認版覆蓋匯入。
      </div>

      <div class="defbox">
        <p class="hint" style="background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px" id="defMetaBox">讀取中…</p>
      </div>

      <div id="stageBadgeWrap" style="margin-bottom:14px"></div>

      <div id="aiBar" style="display:none;background:#eef4ff;border:1px solid #cfe0f9;border-radius:8px;padding:10px 12px;margin-bottom:14px">
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button type="button" class="btn primary sm" onclick="copyPrompt()">📋 一鍵複製中文內容＋提示詞</button>
          <button type="button" class="btn dark sm" onclick="togglePaste()">📥 貼上英文翻譯並自動填入</button>
        </div>
        <div id="pasteBox" style="display:none;margin-top:10px">
          <textarea id="pasteText" placeholder="把 AI 回覆的完整內容貼在這裡…" style="min-height:110px"></textarea>
          <button type="button" class="btn primary sm" style="margin-top:6px" onclick="applyPaste()">套用貼上的翻譯</button>
        </div>
      </div>

      <div id="fieldsWrap" class="grid2"></div>

      <div style="margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <label style="flex:1;min-width:220px">確認人姓名（送出時記錄）
          <select id="confirmerSelect" onchange="onConfirmerSelectChange()"><option value="">讀取人員清單中…</option></select>
          <input type="text" id="confirmerName" placeholder="請輸入姓名" style="display:none;margin-top:4px">
        </label>
        <button class="btn primary" id="submitBtn" onclick="submitStage()" style="align-self:flex-end">送出</button>
      </div>
      <p class="hint" style="margin-top:8px" id="confirmHistoryNote"></p>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ════════ 雲端設定：跟主系統共用同一個 Supabase 專案 ════════ */
const CLOUD = {
  url: "https://iqmbircjokdzdssouwkr.supabase.co",
  key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlxbWJpcmNqb2tkemRzc291d2tyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNDAwODIsImV4cCI6MjA5NjgxNjA4Mn0.OZ2ez6ondz49kT90gwneYUXG7CbE8iiB6PnXE5fR6iY"
};
const TABLE = "air_reply_drafts";
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let toastTimer;
function notify(msg,tone){
  const el=document.getElementById("toast");
  el.textContent=msg; el.className=tone==="err"?"err":(tone==="ok2"?"ok2":"");
  el.style.display="block"; clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.style.display="none",4200);
}

const EN_PLACEHOLDER="(請在此填入英文翻譯)";
const REPLY_FIELDS=[
  {key:"opComment",labelZh:"Initial Operator Comment",labelEN:"INITIAL OPERATOR COMMENT"},
  {key:"immediateCause",labelZh:"Immediate Cause 直接原因",labelEN:"IMMEDIATE CAUSE"},
  {key:"rootCause",labelZh:"根本原因 Root Cause",labelEN:"ROOT CAUSE"},
  {key:"corrective",labelZh:"矯正措施 Corrective Action",labelEN:"CORRECTIVE ACTION"},
  {key:"preventive",labelZh:"預防措施 Preventive Measures",labelEN:"PREVENTIVE MEASURES"},
];
const params=new URLSearchParams(location.search);
const RID=params.get("rid");
const DIDX=params.get("didx")||"0";

let draftRow=null, replyData={}, stage=1, defectMeta=null;
REPLY_FIELDS.forEach(f=>replyData[f.key]={cn:"",en:""});

async function api(path,opts){
  const res=await fetch(`${CLOUD.url}/rest/v1/${path}`,Object.assign({headers:{
    "apikey":CLOUD.key,"Authorization":"Bearer "+CLOUD.key,"Content-Type":"application/json"
  }},opts||{}));
  if(!res.ok){ const t=await res.text().catch(()=>""); throw new Error("HTTP "+res.status+" "+t.slice(0,150)); }
  const ct=res.headers.get("content-type")||"";
  return ct.includes("json")?res.json():null;
}

/* ════════ 模式切換：有 rid → 編輯單筆；沒有 → 顯示歷史清單 ════════ */
/* ════════ 確認人姓名：預設抓海技組人員清單，找不到人名時可切換自行輸入 ════════ */
let ROSTER_NAMES=[];
async function loadConfirmerRoster(){
  const sel=document.getElementById("confirmerSelect");
  try{
    const rows=await api(`app_db?select=payload&k=eq.roster`);
    const list=(rows&&rows[0]&&Array.isArray(rows[0].payload))?rows[0].payload:[];
    ROSTER_NAMES=[...new Set(list.filter(p=>p.name&&p.dept&&String(p.dept).includes("海技")).map(p=>p.name))].sort();
  }catch(e){ ROSTER_NAMES=[]; }
  sel.innerHTML = (ROSTER_NAMES.length?`<option value="">請選擇</option>`+ROSTER_NAMES.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join(""):`<option value="">（讀取不到人員清單）</option>`)
    + `<option value="__other__">其他（自行輸入姓名）</option>`;
}
function onConfirmerSelectChange(){
  const sel=document.getElementById("confirmerSelect");
  const txt=document.getElementById("confirmerName");
  txt.style.display = sel.value==="__other__" ? "" : "none";
  if(sel.value==="__other__") txt.focus();
}
function getConfirmerValue(){
  const sel=document.getElementById("confirmerSelect");
  if(sel.value==="__other__") return (document.getElementById("confirmerName").value||"").trim();
  return sel.value||"";
}
function setConfirmerValue(name){
  const sel=document.getElementById("confirmerSelect");
  const txt=document.getElementById("confirmerName");
  if(!name){ sel.value=""; txt.style.display="none"; return; }
  if(ROSTER_NAMES.includes(name)){ sel.value=name; txt.style.display="none"; }
  else{ sel.value="__other__"; txt.style.display=""; txt.value=name; }
}
async function initPage(){
  await loadConfirmerRoster();
  if(RID){
    document.getElementById("editView").style.display="";
    document.getElementById("hdr-note").textContent="編輯單一缺失的對外回覆內容";
    loadDraft();
  }else{
    document.getElementById("listView").style.display="";
    document.getElementById("hdr-note").textContent="所有已建立的對外回覆案件";
    loadList();
  }
}
initPage();

/* ════════ 歷史清單 ════════ */
async function loadList(){
  const box=document.getElementById("listBody");
  box.innerHTML=`<p class="hint">讀取中…</p>`;
  try{
    const rows=await api(`${TABLE}?select=*&order=updated_at.desc&limit=300`);
    if(!rows||!rows.length){ box.innerHTML=`<p class="hint">目前沒有任何對外回覆案件。</p>`; return; }
    const stageLabel={1:["階段①中文填寫","s1"],2:["階段②英文擬稿","s2"],3:["階段③主管確認","s3"]};
    box.innerHTML=`<table class="tbl"><thead><tr>
      <th>船舶</th><th>CODE</th><th>階段</th><th>確認次數</th><th>最後確認人／時間</th><th>已匯入系統</th><th>最後更新</th><th></th><th></th>
    </tr></thead><tbody>${rows.map(r=>{
      const [lbl,cls]=stageLabel[r.stage]||["－","s1"];
      const impBadge=r.imported?`<span class="badge imp">✓ 已匯入</span>`:`<span class="badge nimp">未匯入</span>`;
      const url=`?rid=${r.air_record_id}&didx=${r.defect_idx}`;
      return `<tr>
        <td><a href="${url}"><b>${esc(r.ship||"")}</b></a></td>
        <td>${esc(r.code||"")}</td>
        <td><span class="badge ${cls}">${lbl}</span></td>
        <td>${r.confirm_count||0} 次</td>
        <td>${esc(r.confirmed_by||"")}${r.confirmed_at?`<br><span class="hint">${new Date(r.confirmed_at).toLocaleString("zh-TW",{hour12:false})}</span>`:""}</td>
        <td>${impBadge}</td>
        <td class="hint">${r.updated_at?new Date(r.updated_at).toLocaleString("zh-TW",{hour12:false}):""}</td>
        <td><a class="btn sm" href="${url}">✏ 編輯</a></td>
        <td><button type="button" class="btn sm" style="color:var(--bad);border-color:#e8c3bc" onclick="deleteCase(${r.id},'${esc(r.ship||"")}')">🗑 刪除</button></td>
      </tr>`;
    }).join("")}</tbody></table>`;
  }catch(e){
    box.innerHTML=`<p class="hint" style="color:var(--bad)">⚠ 讀取失敗：${esc(e.message)}</p>`;
  }
}

/* ════════ 單筆編輯 ════════ */
async function deleteCase(id,ship){
  if(!confirm(`確定要刪除「${ship||""}」這筆對外回覆案件嗎？此動作無法復原。`))return;
  try{
    await api(`${TABLE}?id=eq.${id}`,{method:"DELETE",headers:{"apikey":CLOUD.key,"Authorization":"Bearer "+CLOUD.key,"Prefer":"return=minimal"}});
    notify("✓ 已刪除","ok2");
    loadList();
  }catch(e){
    notify("刪除失敗："+e.message,"err");
  }
}

async function loadDraft(){
  document.getElementById("edit-meta").textContent=`對接記錄代碼 rid=${RID}／didx=${DIDX}，讀取中…`;
  try{
    const rows=await api(`${TABLE}?air_record_id=eq.${encodeURIComponent(RID)}&defect_idx=eq.${encodeURIComponent(DIDX)}&order=id.desc&limit=1`);
    if(rows&&rows.length){
      draftRow=rows[0];
      const it=(draftRow.items&&draftRow.items[0])||{};
      REPLY_FIELDS.forEach(f=>{ replyData[f.key].cn=it[f.key+"Cn"]||""; replyData[f.key].en=it[f.key+"En"]||""; });
      defectMeta=it._defectMeta||null;
      stage=+draftRow.stage||1;
      setConfirmerValue(draftRow.confirmed_by||"");
    }else{
      draftRow=null; stage=1; defectMeta=null;
    }
  }catch(e){
    document.getElementById("edit-meta").textContent=`⚠ 讀取失敗：${e.message}`;
    notify("讀取失敗，請重新整理再試","err");
    return;
  }
  renderDefMeta();
  renderStage();
}
function renderDefMeta(){
  const box=document.getElementById("defMetaBox");
  if(defectMeta){
    document.getElementById("edit-title").textContent=`對外回覆 － ${defectMeta.ship||""} CODE ${defectMeta.code||""}`;
    document.getElementById("edit-meta").textContent=`${defectMeta.ship||""}　${defectMeta.date||""}　${defectMeta.itype||""}`;
    box.innerHTML=`<b>缺失詳情：</b>${esc(defectMeta.detail||"（未填寫）")}<br><b>實際情況：</b>${esc(defectMeta.actual||"（未填寫）")}`;
  }else{
    box.textContent="尚未取得原始缺失內容，請確認連結是否正確（需由正式系統「產生對外回覆連結」建立）。";
  }
}
function renderStage(){
  const badgeWrap=document.getElementById("stageBadgeWrap");
  const aiBar=document.getElementById("aiBar");
  const wrap=document.getElementById("fieldsWrap");
  const submitBtn=document.getElementById("submitBtn");
  const histNote=document.getElementById("confirmHistoryNote");

  const labels={1:["階段① · 主管填寫中文回覆","#fff4e8","#c96a14"],2:["階段② · 承辦人員用 AI 翻譯英文","#eef4ff","var(--navy-3)"],3:["階段③ · 中英文並排，主管確認","#fdf2e9","#a35d1a"]};
  const [lbl,bg,fg]=labels[stage]||labels[1];
  badgeWrap.innerHTML=`<span class="badge" style="background:${bg};color:${fg}">${lbl}</span>
    ${draftRow?`　<span class="hint">已確認 ${draftRow.confirm_count||0} 次${draftRow.imported?"　·　✓ 目前版本已被系統匯入":"　·　尚未被系統匯入最新版本"}</span>`:""}`;

  aiBar.style.display = "";

  if(stage===1){
    wrap.innerHTML=REPLY_FIELDS.map(f=>`<label class="full">${f.labelZh}
      <textarea data-k="${f.key}" data-lang="cn">${esc(replyData[f.key].cn)}</textarea>
    </label>`).join("");
    submitBtn.textContent="✓ 送出中文回覆，交給承辦人員翻譯";
  }else if(stage===2){
    wrap.innerHTML=REPLY_FIELDS.map(f=>`<label class="full">${f.labelZh}（中文，唯讀）
        <textarea readonly style="background:#f3f4f6">${esc(replyData[f.key].cn)}</textarea>
      </label>
      <label class="full">${f.labelZh}（English）
        <textarea data-k="${f.key}" data-lang="en" placeholder="English translation…">${esc(replyData[f.key].en)}</textarea>
      </label>`).join("");
    submitBtn.textContent="✓ 送出英文擬稿，交回主管最終確認";
  }else{
    wrap.innerHTML=REPLY_FIELDS.map(f=>`<label class="full">${f.labelZh}（中文）
        <textarea data-k="${f.key}" data-lang="cn">${esc(replyData[f.key].cn)}</textarea>
      </label>
      <label class="full">${f.labelZh}（English）
        <textarea data-k="${f.key}" data-lang="en">${esc(replyData[f.key].en)}</textarea>
      </label>`).join("");
    submitBtn.textContent = (draftRow&&draftRow.confirm_count) ? "✓ 重新確認（覆蓋前一次確認內容）" : "✓ 確認送出";
  }
  wrap.querySelectorAll("textarea[data-k]").forEach(ta=>{
    ta.addEventListener("input",function(){ replyData[this.dataset.k][this.dataset.lang]=this.value; });
  });
  histNote.textContent = stage===3
    ? "「已確認」不會鎖死畫面——確認後仍可以繼續調整、再按一次確認，每次確認都會記錄下來，正式系統永遠採用最新一次確認的內容。"
    : "";
}

/* ════════ AI 翻譯小幫手（跟正式系統同一套提示詞格式，方便互通）════════ */
function buildPromptText(){
  const lines=["===DEFICIENCY 1==="];
  REPLY_FIELDS.forEach(f=>{
    lines.push(`[${f.labelEN} - 中文]`); lines.push(replyData[f.key].cn||"(尚未填寫)");
    lines.push(`[${f.labelEN} - EN]`); lines.push(replyData[f.key].en||EN_PLACEHOLDER); lines.push("");
  });
  const prompt="你是海技部門的資深航務管理分析師，具備豐富的航海實務與船舶管理專業知識。\n"+
    "以下是「缺失改善回覆」的中文內容，已用固定格式列出。請你逐項閱讀中文內容，並「只」在每個 [XXX - EN] 標籤的下一行，填入專業、精準、符合航運業界慣用語的英文翻譯。\n"+
    "請務必遵守以下規則：\n1. 不要更動、翻譯或刪除任何標籤文字、方括號「[ ]」、等號「===」或編號本身；\n"+
    "2. 不要使用 Markdown 符號（例如 *、#、-）或任何項目符號；\n3. 不要輸出開頭或結尾的任何說明文字、客套話；\n"+
    "4. 請將整段內容（包含原本的中文與您填入的英文）完整且原封不動地輸出回來，不要省略任何一個缺失或欄位。";
  return prompt+"\n\n"+lines.join("\n");
}
function copyPrompt(){
  const text=buildPromptText();
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>notify("✓ 已複製，請貼到您慣用的 AI 對話視窗","ok2")).catch(()=>fallbackCopy(text));
  }else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.left="-9999px";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand("copy"); notify("✓ 已複製","ok2"); }catch(e){ notify("⚠ 複製失敗，請手動選取","err"); }
  document.body.removeChild(ta);
}
function togglePaste(){
  const box=document.getElementById("pasteBox");
  box.style.display = box.style.display==="none" ? "" : "none";
}
function applyPaste(){
  const text=document.getElementById("pasteText").value||"";
  if(!text.trim()){ notify("⚠ 請先貼上翻譯後的內容","err"); return; }
  let block=text.split(/===\s*DEFICIENCY\s*\d+\s*===/i).map(s=>s.trim()).filter(Boolean)[0]||text;
  const grab=label=>{
    const re=new RegExp("\\["+label+"\\s*-\\s*EN\\]\\s*([\\s\\S]*?)(?=\\n?\\[[A-Z ]+\\s*-\\s*(?:中文|EN)\\]|$)","i");
    const m=block.match(re); if(!m)return "";
    const v=m[1].trim();
    if(!v||v===EN_PLACEHOLDER||(/^[\u4e00-\u9fff（）()，,。.\s]*$/.test(v)&&/[\u4e00-\u9fff]/.test(v)))return "";
    return v;
  };
  let filled=0;
  REPLY_FIELDS.forEach(f=>{ const v=grab(f.labelEN); if(v){ replyData[f.key].en=v; filled++; } });
  document.getElementById("pasteText").value="";
  togglePaste();
  renderStage();
  notify(filled?`✓ 已自動填入 ${filled}／${REPLY_FIELDS.length} 個英文欄位`:"⚠ 找不到符合格式的英文內容","ok2");
}

/* ════════ 送出：推進階段，或（階段③）記錄一次確認 ════════ */
async function submitStage(){
  const btn=document.getElementById("submitBtn");
  btn.disabled=true;
  const items=[{ _defectMeta: defectMeta }];
  REPLY_FIELDS.forEach(f=>{ items[0][f.key+"Cn"]=replyData[f.key].cn; items[0][f.key+"En"]=replyData[f.key].en; });
  const nextStage = stage<3 ? stage+1 : 3;
  const body={ ship:(defectMeta&&defectMeta.ship)||(draftRow&&draftRow.ship)||"", code:(defectMeta&&defectMeta.code)||"", stage:String(nextStage), items };

  if(stage===3){
    const name=getConfirmerValue();
    if(!name){ notify("⚠ 請先填寫確認人姓名","err"); btn.disabled=false; return; }
    const now=new Date().toISOString();
    const hist=(draftRow&&Array.isArray(draftRow.history))?draftRow.history.slice():[];
    hist.push({by:name,at:now,items:items[0]});
    body.confirmed_by=name; body.confirmed_at=now;
    body.confirm_count=((draftRow&&draftRow.confirm_count)||0)+1;
    body.history=hist;
    body.imported=false; // 有新的確認版本，系統端需要重新匯入
  }

  try{
    if(draftRow){
      await api(`${TABLE}?id=eq.${draftRow.id}`,{method:"PATCH",headers:{"apikey":CLOUD.key,"Authorization":"Bearer "+CLOUD.key,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify(body)});
    }else{
      body.air_record_id=+RID; body.defect_idx=+DIDX;
      await api(`${TABLE}`,{method:"POST",headers:{"apikey":CLOUD.key,"Authorization":"Bearer "+CLOUD.key,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify([body])});
    }
    notify("✓ 已送出","ok2");
    await loadDraft();
  }catch(e){
    notify("送出失敗："+e.message,"err");
  }
  btn.disabled=false;
}
</script>
