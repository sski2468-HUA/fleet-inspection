<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSC 檢查熱區分析 — FPMC</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --navy:#1c3a5e; --navy-2:#234a72; --paper:#f5f7f8; --card:#ffffff; --line:#dde4e8; --line-2:#c3ced5;
  --ink:#15262f; --ink-2:#52656f; --ink-3:#8195a0; --signal:#e8842c; --teal:#1e7f8c; --teal-l:#e4f1f2;
  --ok:#2e8b57; --bad:#c0392b; --mono:ui-monospace,Consolas,monospace;
  --sans:"Segoe UI","Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);font-family:var(--sans);color:var(--ink);font-size:15px}
.wrap{max-width:1440px;margin:0 auto;padding:0 0 60px}
header{background:var(--navy);color:#fff;padding:18px 20px;position:relative}
header h1{margin:0;font-size:22px;padding-right:260px}
header p{margin:5px 0 0;font-size:14px;color:#b9c8d6;line-height:1.6;padding-right:260px}
header .hr{position:absolute;top:16px;right:18px;display:flex;gap:8px;align-items:center}
header a.back{color:#fff;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);border-radius:8px;padding:7px 14px;font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap}
.lang{display:flex;border:1px solid rgba(255,255,255,.55);border-radius:8px;overflow:hidden}
.lang button{background:transparent;border:0;color:#cfdbe6;padding:7px 12px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--sans)}
.lang button.on{background:#fff;color:var(--navy)}
@media(max-width:760px){header h1,header p{padding-right:0}header .hr{position:static;margin-top:10px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:14px;padding:16px}
.card h3{margin:0 0 4px;font-size:16.5px;color:var(--navy)}
.card .sub{margin:0 0 12px;color:var(--ink-3);font-size:13px;line-height:1.6}
.hint{color:var(--ink-3);font-size:13px;line-height:1.6}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:#fff;color:var(--ink);padding:6px 12px;border-radius:7px;font-size:13.5px;cursor:pointer;font-family:var(--sans);font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--navy)}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=date],select{font-family:var(--sans);font-size:14px;border:1px solid var(--line-2);border-radius:6px;padding:5px 8px;background:#fff;color:var(--ink)}
.msel{position:relative;display:inline-block}
.msel>button{background:#fff;border:1px solid var(--line-2);border-radius:6px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--ink);font-family:inherit;white-space:nowrap}
.msel>button.on{border-color:var(--navy);background:#eef3f7;font-weight:700;color:var(--navy)}
.msel .mp{display:none;position:absolute;z-index:50;top:100%;left:0;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);min-width:240px;max-height:360px;overflow:auto;padding:6px}
.msel .mp.open{display:block}
.msel .mp label{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:5px;cursor:pointer;font-size:14px}
.msel .mp label:hover{background:#f1f5f8}
.msel .mp .mh{display:flex;gap:6px;padding:2px 4px 6px;border-bottom:1px solid var(--line);margin-bottom:4px;position:sticky;top:-6px;background:#fff}
.msel .mp .grp{font-size:12px;color:var(--ink-3);padding:6px 8px 2px;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:800;color:var(--navy);line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--ink-2);margin-top:2px}
.kpi.warn .v{color:var(--bad)}
.kpi.sig .v{color:var(--signal)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:#f1f5f8;color:var(--ink-2);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
th.s{cursor:pointer;user-select:none}
th.s:hover{color:var(--navy)}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
tr.click{cursor:pointer}
tr.click:hover td{background:#f7fafc}
.hbar{height:9px;border-radius:5px;background:var(--teal);min-width:2px}
.tabs{display:flex;gap:0;margin-bottom:10px}
.tabs button{border:1px solid var(--line-2);background:#fff;padding:6px 14px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:600;color:var(--ink-2)}
.tabs button:first-child{border-radius:7px 0 0 7px}.tabs button:last-child{border-radius:0 7px 7px 0}
.tabs button+button{margin-left:-1px}
.tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tops{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:14px}
.top{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.top h4{margin:0 0 6px;font-size:14px;color:var(--navy)}
.top ol{margin:0;padding-left:20px;font-size:13.5px;line-height:1.8}
.top ol li span{color:var(--ink-3);font-family:var(--mono);font-size:12.5px}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700}
.scroll{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:8px}
.heat td{text-align:center;font-family:var(--mono);font-size:13px;min-width:56px;border:1px solid #fff}
.heat td.lbl{text-align:left;font-family:var(--sans);white-space:nowrap;background:#fff;border-bottom:1px solid var(--line)}
#load{margin:14px}
svg text{font-family:var(--sans)}
#map{height:520px;border-radius:8px;border:1px solid var(--line);background:#e9eef1}
.mapwrap{display:grid;grid-template-columns:1fr 320px;gap:14px}
@media(max-width:1000px){.mapwrap{grid-template-columns:1fr}}
.risk-list{border:1px solid var(--line);border-radius:8px;max-height:520px;overflow:auto}
.risk-list .ri{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px;line-height:1.5}
.risk-list .ri:hover{background:#f7fafc}
.leaflet-popup-content{font-family:var(--sans);font-size:13px;line-height:1.6;margin:10px 12px}
.legend{background:#fff;padding:8px 10px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.18);font-size:12px;line-height:1.7;font-family:var(--sans)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.lg2{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin:4px 0 6px}
.lg2 span{display:inline-flex;align-items:center;gap:6px}
.lg2 i{display:inline-block;width:14px;height:3px;border-radius:2px}
.catchip{display:inline-block;background:#eef3f7;color:var(--navy);border-radius:6px;padding:1px 7px;margin:1px 4px 1px 0;font-size:12.5px;white-space:nowrap}
.catchip b{font-family:var(--mono);margin-left:4px}
.notice{background:#fff6e0;border:1px solid #efd9a0;color:#7a5a10;border-radius:8px;padding:8px 12px;font-size:13.5px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="hr">
    <div class="lang"><button id="lgZh" onclick="setLang('zh')">中文</button><button id="lgEn" onclick="setLang('en')">English</button></div>
    <a class="back" href="./" data-i="back"></a>
  </div>
  <h1 data-i="title"></h1>
  <p data-i="intro"></p>
</header>

<div id="load" class="notice"></div>

<div id="main" style="display:none">
  <div class="card">
    <div class="bar">
      <span class="msel" id="msType"></span>
      <span class="msel" id="msShip"></span>
      <span class="msel" id="msRegion"></span>
      <span class="msel" id="msCountry"></span>
      <span class="msel" id="msPort"></span>
      <span class="hint" data-i="date"></span><input type="date" id="dFrom" onchange="render()"><span class="hint">～</span><input type="date" id="dTo" onchange="render()">
      <button class="btn" onclick="quick('12m')" data-i="q12"></button><button class="btn" onclick="quick('ty')" data-i="qty"></button><button class="btn" onclick="quick('ly')" data-i="qly"></button><button class="btn" onclick="quick('all')" data-i="qall"></button>
    </div>
    <div class="bar" style="margin-top:10px">
      <label class="hint" style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="onlyDet" onchange="render()"> <span data-i="onlyDet"></span></label>
      <label class="hint" style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="inclGone" onchange="render()"> <span data-i="inclGone"></span><span class="hint" id="goneN"></span></label>
      <label class="hint" style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="inclNoLoc" checked onchange="render()"> <span data-i="inclNoLoc"></span></label>
      <span style="flex:1"></span>
      <button class="btn" onclick="clearAll()" data-i="clear"></button>
      <button class="btn" onclick="load()" data-i="reload"></button>
      <button class="btn dark" onclick="exportXlsx()" data-i="export"></button>
    </div>
  </div>

  <div class="card">
    <div class="kpis" id="kpis"></div>
    <div id="locNote" style="margin-top:10px"></div>
  </div>

  <div class="card">
    <h3 data-i="mapTitle"></h3>
    <p class="sub" data-i="mapSub"></p>
    <div class="tabs" id="mapTabs"><button data-k="hot" class="on" onclick="setMapMode('hot')" data-i="mapHot"></button><button data-k="risk" onclick="setMapMode('risk')" data-i="mapRisk"></button></div>
    <div class="mapwrap"><div id="map"></div><div><div class="hint" style="font-weight:700;margin-bottom:6px" id="riskHead"></div><div class="risk-list" id="riskList"></div></div></div>
    <p class="hint" style="margin:8px 0 0" data-i="mapNote"></p>
  </div>

  <div class="card">
    <h3 data-i="hzTitle"></h3>
    <p class="sub" data-i="hzSub"></p>
    <div class="tops" id="tops"></div>
    <div class="tabs" id="zoneTabs">
      <button data-k="country" class="on" onclick="setZone('country')" data-i="byCountry"></button><button data-k="port" onclick="setZone('port')" data-i="byPort"></button><button data-k="region" onclick="setZone('region')" data-i="byRegion"></button>
    </div>
    <div class="scroll"><table id="zoneTbl"></table></div>
    <p class="hint" style="margin:8px 0 0" data-i="regionNote"></p>
  </div>

  <div class="grid2">
    <div class="card">
      <h3 data-i="trTitle"></h3>
      <p class="sub" data-i="trSub"></p>
      <div class="tabs" id="trTabs"><button data-k="m" onclick="setTrendP('m')" data-i="pM"></button><button data-k="q" class="on" onclick="setTrendP('q')" data-i="pQ"></button><button data-k="y" onclick="setTrendP('y')" data-i="pY"></button></div>
      <div id="trend"></div>
      <div id="trendAvg" style="margin-top:6px"></div>
    </div>
    <div class="card">
      <h3 data-i="tyTitle"></h3>
      <p class="sub" data-i="tySub"></p>
      <div id="types"></div>
    </div>
  </div>

  <div class="card">
    <h3 data-i="dfTitle"></h3>
    <p class="sub" id="dfSub"></p>
    <div class="tabs" id="catTabs"><button data-k="chap" class="on" onclick="setCatMode('chap')" data-i="catChap"></button><button data-k="sys" onclick="setCatMode('sys')" data-i="catSys"></button></div>
    <div class="grid2" style="gap:16px">
      <div><div class="hint" style="font-weight:700;margin-bottom:6px" data-i="dfAll"></div><div id="catBars"></div></div>
      <div><div class="hint" style="font-weight:700;margin-bottom:6px" data-i="dfYear"></div><div style="overflow:auto"><table class="heat" id="catYear"></table></div></div>
    </div>
    <div class="hint" style="font-weight:700;margin:16px 0 6px" data-i="dfPort"></div>
    <div class="tabs" id="cpTabs"><button data-k="port" class="on" onclick="setCatPlace('port')" data-i="port"></button><button data-k="country" onclick="setCatPlace('country')" data-i="country"></button></div>
    <div class="scroll" style="max-height:440px"><table id="catPort"></table></div>
  </div>

  <div class="card">
    <h3 data-i="htTitle"></h3>
    <p class="sub" data-i="htSub"></p>
    <div class="tabs" id="heatTabs"><button data-k="country" class="on" onclick="setHeat('country')" data-i="country"></button><button data-k="port" onclick="setHeat('port')" data-i="port"></button></div>
    <div style="overflow:auto"><table class="heat" id="heat"></table></div>
  </div>

  <div class="card">
    <h3 data-i="shTitle"></h3>
    <p class="sub" data-i="shSub"></p>
    <div class="scroll"><table id="shipTbl"></table></div>
  </div>

  <div class="card">
    <h3 data-i="dtTitle"></h3>
    <p class="sub" id="detSub"></p>
    <div class="scroll"><table id="detTbl"></table></div>
  </div>
</div>
</div>

<script>
const CLOUD={url:"https://iqmbircjokdzdssouwkr.supabase.co",
  key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlxbWJpcmNqb2tkemRzc291d2tyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNDAwODIsImV4cCI6MjA5NjgxNjA4Mn0.OZ2ez6ondz49kT90gwneYUXG7CbE8iiB6PnXE5fR6iY"};
// Leaflet 的全域名稱也叫 L，這頁的中英文切換函式已經用了 L，所以把 Leaflet 另存成 L_
const L_=(window.L&&window.L.map)?window.L:undefined;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const H={apikey:CLOUD.key,Authorization:"Bearer "+CLOUD.key};
async function get(path){const r=await fetch(`${CLOUD.url}/rest/v1/${path}`,{headers:H});if(!r.ok)throw new Error(r.status+" "+(await r.text()).slice(0,120));return r.json();}

/* ══ 中英文切換：網址 ?lang=en 或右上角按鈕切換，選擇會記在這台電腦的瀏覽器 ══ */
let LANG=(()=>{const q=new URLSearchParams(location.search).get("lang");if(q==="en"||q==="zh")return q;try{return localStorage.getItem("psc_lang")||"zh";}catch(e){return "zh";}})();
const L=(zh,en)=>LANG==="en"?en:zh;
const TXT={
  back:["← 返回系統","← Back to System"],
  title:["⚓ PSC 檢查熱區分析","⚓ PSC Inspection Hotspot Analysis"],
  intro:["從系統「檢查紀錄」中抓出檢查來源為 PSC 的紀錄，依檢查地點（港口／國家／PSC 區域）統計檢查次數、缺失數與平均缺失數。資料只讀取，不會修改系統內容。","PSC inspections taken from the fleet inspection records, analysed by location (port / country / PSC region): number of inspections, deficiencies and average deficiencies per inspection. Read-only — no data is changed."],
  date:["檢查日期","Inspection date"],q12:["近 12 個月","Last 12 months"],qty:["今年","This year"],qly:["去年","Last year"],qall:["全部期間","All time"],
  onlyDet:["只看扣船","Detentions only"],inclGone:["包含已離開船隊的船（已售／不在船舶資料）","Include ships no longer in the fleet (sold / not in ship list)"],inclNoLoc:["總數與趨勢包含「地點未填」的紀錄","Include records without location in totals & trend"],
  clear:["清除篩選","Clear filters"],reload:["🔄 重新讀取","🔄 Reload"],export:["⬇ 匯出 Excel","⬇ Export Excel"],
  hzTitle:["檢查熱區","Inspection Hotspots"],
  hzSub:["「檢查最頻繁」看哪裡最常被查；「平均缺失最高」只列檢查 3 次以上的地點，避免一兩次的偶發結果排在前面。點表格任一列，可直接篩選該地點。","\"Most inspected\" shows where our ships are inspected most often. \"Highest average\" and \"Zero-deficiency\" only list locations with 3 or more inspections, so one-off results do not dominate. Click any row to filter by that location."],
  byCountry:["依國家","By country"],byPort:["依港口","By port"],byRegion:["依 PSC 區域","By PSC region"],
  regionNote:["PSC 區域是依國家推估（例如澳洲、中國、越南屬 Tokyo MOU；美國為 USCG），僅供分組參考。","PSC regions are assigned by country (e.g. Australia, China, Vietnam → Tokyo MOU; USA → USCG) for grouping reference only."],
  trTitle:["檢查次數與平均缺失趨勢","Inspections & Average Deficiencies Trend"],trSub:["上圖＝每期 PSC 檢查次數（油輪／散裝分色）；下圖＝每期平均每次缺失數，分全部、油輪、散裝三條線。","Top: PSC inspections per period (tanker / bulk); bottom: average deficiencies per inspection — all ships, tankers and bulk carriers."],
  tyTitle:["各船型比較","By Ship Type"],tySub:["各船型的檢查次數、平均缺失與零缺失比例。","Inspections, average deficiencies and zero-deficiency rate by ship type."],
  mapTitle:["檢查熱區地圖","Inspection Hotspot Map"],
  mapSub:["圓圈越大＝檢查次數越多。「熱區」看哪裡最常被查；「高風險區」依平均缺失上色，紅色外框代表曾被扣船。點圓圈看該港口的統計與主要缺失類型。","Larger circle = more inspections. \"Hotspots\" shows where ships are inspected most; \"High-risk\" colours each port by average deficiencies, with a red outline where a detention occurred. Click a circle for port statistics and main deficiency types."],
  mapHot:["🔥 檢查熱區","🔥 Hotspots"],mapRisk:["⚠ 高風險區","⚠ High-risk"],
  mapNote:["港口位置為約略座標；找不到港口座標的，標在該國家中心。高風險＝檢查 2 次以上且平均缺失 ≥ 2，或曾被扣船。","Port positions are approximate; ports without known coordinates are placed at the country centre. High-risk = 2+ inspections with average ≥ 2 deficiencies, or any detention."],
  pM:["月","Month"],pQ:["季","Quarter"],pY:["年","Year"],
  dfTitle:["缺失類型分析","Deficiency Type Analysis"],
  catChap:["PSC 章節（Tokyo MOU）","PSC chapter (Tokyo MOU)"],catSys:["設備／作業類別","Equipment / operation category"],
  dfAll:["缺失類型分布","Deficiency types"],dfYear:["缺失類型 × 年度","Deficiency types × year"],dfPort:["各地點主要缺失類型","Main deficiency types by location"],
  htTitle:["熱區 × 年度","Hotspots × Year"],htSub:["每格數字＝該年在該地點的檢查次數，下方小字為平均缺失；顏色越深檢查越多。列出檢查次數前 15 名。","Each cell shows the number of inspections at that location in that year, with the average deficiencies below; darker = more inspections. Top 15 locations shown."],
  country:["國家","Country"],port:["港口","Port"],
  shTitle:["各船 PSC 紀錄","PSC Record by Ship"],shSub:["依目前篩選，每艘船的 PSC 檢查次數、缺失數與最近一次檢查。點列可只看該船。","PSC inspections, deficiencies and latest inspection for each ship under the current filters. Click a row to show that ship only."],
  dtTitle:["檢查明細","Inspection Details"]
};
function applyLang(){
  document.documentElement.lang=LANG==="en"?"en":"zh-Hant";
  document.title=L("PSC 檢查熱區分析 — FPMC","PSC Inspection Hotspot Analysis — FPMC");
  document.querySelectorAll("[data-i]").forEach(el=>{const t=TXT[el.dataset.i];if(t)el.textContent=t[LANG==="en"?1:0];});
  $("#lgZh").classList.toggle("on",LANG==="zh");$("#lgEn").classList.toggle("on",LANG==="en");
}
function setLang(l){LANG=l;try{localStorage.setItem("psc_lang",l);}catch(e){}applyLang();if(ROWS.length)render();else if($("#load").style.display!=="none"&&!$("#load").dataset.err)$("#load").textContent=L("資料讀取中…","Loading data…");}

/* 國家名稱統一（系統裡有少數拼法不同），以及依國家推估 PSC 區域 */
const COUNTRY_ALIAS={"Philippine":"Philippines","S. Korea":"Korea","South Korea":"Korea","PRC":"China","U.S.A.":"USA","United States":"USA","United Kingdom":"UK","U.A.E.":"UAE","Viet Nam":"Vietnam"};

const regionOf=c=>!c?"":(REGION_OF[c]||"OTHER");

let SHIPS=[],ROWS=[],zone="country",heatK="country",zoneSort={k:"n",d:-1},shipSort={k:"n",d:-1},detSort={k:"date",d:-1};
const sel={type:new Set(),ship:new Set(),region:new Set(),country:new Set(),port:new Set()};
const parseDate=s=>{const m=String(s||"").match(/(\d{4})[\/\-\.](\d{1,2})(?:[\/\-\.](\d{1,2}))?/);return m?`${m[1]}-${m[2].padStart(2,"0")}-${(m[3]||"1").padStart(2,"0")}`:"";};
const shipOf=c=>SHIPS.find(s=>s.code===c);
const shipLabel=c=>{const s=shipOf(c);if(!s)return c+L("（已離開船隊）"," (left fleet)");return LANG==="en"?(s.name||c):[s.zh,s.name].filter(Boolean).join(" ");};
const portLabel=k=>{const r=ROWS.find(x=>x.port===k);return r?`${r.portName}（${cShort(r.country)}）`.replace("（",LANG==="en"?" (":"（").replace("）",LANG==="en"?")":"）"):k;};

async function load(){
  const ld=$("#load");ld.style.display="";delete ld.dataset.err;ld.textContent=L("資料讀取中…","Loading data…");
  try{
    const sp=await get("app_db?k=eq.ships&select=payload");SHIPS=(sp[0]&&sp[0].payload)||[];
    // 雲端一次最多回 1000 筆，分頁讀完
    let all=[],off=0,b;do{b=await get(`sync_insp?select=payload&order=id&offset=${off}&limit=1000`);all=all.concat(b);off+=1000;}while(b.length===1000);
    ROWS=all.map(x=>x.payload).filter(p=>p&&String(p.itype||"").toUpperCase()==="PSC").map(p=>{
      const loc=String(p.loc||"").trim(),parts=loc.split(",").map(s=>s.trim()).filter(Boolean);
      let country=canonCountry(parts.length>1?parts[parts.length-1]:(parts[0]||""));
      let port=parts.length>1?titleCase(parts.slice(0,-1).join(", ")):"";
      if(!port&&parts.length===1&&canonCountry(parts[0])!==parts[0]&&!COUNTRY_ZH[parts[0]])port=titleCase(parts[0]);
      const s=shipOf(p.ship)||{};const nd=parseInt(p.ndef,10);
      return {id:p.id,ship:p.ship,date:parseDate(p.date),loc,port:port?`${port}, ${country}`:"",portName:port,country,region:regionOf(country),
        type:s.type1||(p.vtype==="bulk"?"BULK":p.vtype==="tanker"?"Tanker":"未分類"),vtype:s.vtype||p.vtype||"",
        gone:!shipOf(p.ship),ndef:isNaN(nd)?0:nd,ndefBlank:isNaN(nd),detain:String(p.detain||"").toUpperCase().startsWith("Y"),inspector:p.inspector||"",unit:p.unit||""};
    }).filter(r=>r.date);
    await loadDefs();
    ld.style.display="none";$("#main").style.display="";
    render();
  }catch(e){ld.dataset.err="1";ld.textContent=L("⚠ 資料讀取失敗：","⚠ Failed to load data: ")+e.message+L("（請確認網路後按重新整理）"," (check the network and reload)");}
}

/* ── 多選 ── */
function msBuild(host,key,label,opts){
  const set=sel[key],el=$("#"+host);
  const open=!!el.querySelector(".mp.open"),sc=open?el.querySelector(".mp").scrollTop:0;
  const n=set.size;
  let body="",lastG=null;
  opts.forEach(o=>{if(o.g!==undefined&&o.g!==lastG){body+=`<div class="grp">${esc(o.g)}</div>`;lastG=o.g;}
    body+=`<label><input type="checkbox" ${set.has(o.v)?"checked":""} data-v="${esc(o.v)}" onchange="pick('${key}',this.dataset.v,this.checked)"><span>${esc(o.t)}</span>${o.c!=null?`<span class="hint" style="margin-left:auto">${o.c}</span>`:""}</label>`;});
  el.innerHTML=`<button type="button" class="${n?"on":""}" onclick="tog('${host}')">${label}${n?L(`（${n}）`,` (${n})`):L("：全部",": All")} ▾</button>
    <div class="mp ${open?"open":""}"><div class="mh"><button type="button" class="btn" onclick="setAll('${key}',${JSON.stringify(opts.map(o=>o.v)).replace(/"/g,"&quot;")})">${L("全選","Select all")}</button><button type="button" class="btn" onclick="setAll('${key}',[])">${L("清除","Clear")}</button></div>${body||`<div class="hint" style="padding:8px">${L("沒有選項","No options")}</div>`}</div>`;
  if(open)el.querySelector(".mp").scrollTop=sc;
}
function tog(h){document.querySelectorAll(".msel .mp.open").forEach(p=>{if(p.parentNode.id!==h)p.classList.remove("open");});$("#"+h).querySelector(".mp").classList.toggle("open");}
function pick(k,v,on){on?sel[k].add(v):sel[k].delete(v);render();}
function setAll(k,arr){sel[k].clear();arr.forEach(v=>sel[k].add(v));render();}
document.addEventListener("click",e=>{if(!e.target.closest(".msel"))document.querySelectorAll(".msel .mp.open").forEach(p=>p.classList.remove("open"));});

function quick(k){
  const t=new Date(),iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`,y=t.getFullYear();
  if(k==="all"){$("#dFrom").value="";$("#dTo").value="";}
  else if(k==="ty"){$("#dFrom").value=`${y}-01-01`;$("#dTo").value=`${y}-12-31`;}
  else if(k==="ly"){$("#dFrom").value=`${y-1}-01-01`;$("#dTo").value=`${y-1}-12-31`;}
  else{const f=new Date(t);f.setFullYear(y-1);f.setDate(f.getDate()+1);$("#dFrom").value=iso(f);$("#dTo").value=iso(t);}
  render();
}
function clearAll(){Object.values(sel).forEach(s=>s.clear());$("#inclGone").checked=false;$("#dFrom").value="";$("#dTo").value="";$("#onlyDet").checked=false;render();}

/* 篩選：skip 指定哪個維度不套用（用來算該下拉選單的選項筆數，選項才不會因為自己被篩掉而消失） */
function filt(skip,src){
  const f=$("#dFrom").value,t=$("#dTo").value,det=$("#onlyDet").checked;
  const gone=$("#inclGone").checked;
  return (src||ROWS).filter(r=>{
    if(!gone&&r.gone)return false;
    if(f&&r.date<f)return false;if(t&&r.date>t)return false;
    if(det&&!r.detain)return false;
    if(skip!=="type"&&sel.type.size&&!sel.type.has(r.type))return false;
    if(skip!=="ship"&&sel.ship.size&&!sel.ship.has(r.ship))return false;
    if(skip!=="region"&&sel.region.size&&!sel.region.has(r.region))return false;
    if(skip!=="country"&&sel.country.size&&!sel.country.has(r.country))return false;
    if(skip!=="port"&&sel.port.size&&!sel.port.has(r.port))return false;
    return true;
  });
}
const cnt=(rows,f)=>{const m={};rows.forEach(r=>{const k=f(r);if(k)m[k]=(m[k]||0)+1;});return m;};
function buildFilters(){
  const ct=cnt(filt("type"),r=>r.type),types=[...new Set(ROWS.map(r=>r.type))].sort();
  msBuild("msType","type",L("船型","Ship type"),types.map(t=>({v:t,t:typeLabel(t),c:ct[t]||0,g:ROWS.find(r=>r.type===t).vtype==="bulk"?L("散裝船","Bulk carrier"):L("油輪","Tanker")})).sort((a,b)=>a.g.localeCompare(b.g)));
  const cs=cnt(filt("ship"),r=>r.ship),ships=[...new Set(ROWS.filter(r=>$("#inclGone").checked||!r.gone).map(r=>r.ship))].sort((a,b)=>shipLabel(a).localeCompare(shipLabel(b),"zh-Hant"));
  msBuild("msShip","ship",L("船舶","Ship"),ships.map(c=>({v:c,t:shipLabel(c),c:cs[c]||0})));
  const cr=cnt(filt("region"),r=>r.region),regs=[...new Set(ROWS.map(r=>r.region).filter(Boolean))].sort((a,b)=>rLabel(a).localeCompare(rLabel(b)));
  msBuild("msRegion","region",L("PSC 區域","PSC region"),regs.map(v=>({v,t:rLabel(v),c:cr[v]||0})));
  const cc=cnt(filt("country"),r=>r.country),ctrs=[...new Set(ROWS.map(r=>r.country).filter(Boolean))].sort((a,b)=>(cc[b]||0)-(cc[a]||0)||a.localeCompare(b));
  msBuild("msCountry","country",L("國家","Country"),ctrs.map(v=>({v,t:cLabel(v),c:cc[v]||0})));
  // 港口選項跟著已選的國家／區域縮小，依國家分組
  const pr=filt("port"),cp=cnt(pr,r=>r.port);
  const ports=[...new Set(pr.map(r=>r.port).filter(Boolean).concat([...sel.port]))].map(p=>{const r=ROWS.find(x=>x.port===p);return {v:p,t:r?r.portName:p,c:cp[p]||0,g:r?cLabel(r.country):""};}).sort((a,b)=>a.g.localeCompare(b.g)||b.c-a.c);
  msBuild("msPort","port",L("港口","Port"),ports);
}

function agg(rows,keyFn){
  const m=new Map();
  rows.forEach(r=>{const k=keyFn(r);if(!k)return;let a=m.get(k);if(!a){a={k,n:0,d:0,zero:0,det:0,last:"",ships:new Set(),max:0};m.set(k,a);}
    a.n++;a.d+=r.ndef;if(!r.ndef)a.zero++;if(r.detain)a.det++;if(r.date>a.last)a.last=r.date;a.ships.add(r.ship);if(r.ndef>a.max)a.max=r.ndef;});
  return [...m.values()].map(a=>Object.assign(a,{avg:a.n?a.d/a.n:0,zr:a.n?a.zero/a.n:0,ns:a.ships.size}));
}
const f2=v=>v.toFixed(2),pct=v=>(v*100).toFixed(0)+"%",sd=d=>d.replace(/-/g,"/");
// 平均缺失的熱度顏色（0 綠 → 高 紅）
const avgColor=v=>v<=0.5?"#2e8b57":v<=1.5?"#7a8a1a":v<=3?"#b5610f":"#c0392b";
const avgBg=v=>v<=0.5?"#e2f3e8":v<=1.5?"#f1f3d9":v<=3?"#fdeed9":"#fde3e0";

function render(){
  const gs=[...new Set(ROWS.filter(r=>r.gone).map(r=>r.ship))];
  $("#goneN").textContent=gs.length?L(`（${gs.join("、")}，共 ${ROWS.filter(r=>r.gone).length} 筆）`,` (${gs.join(", ")}; ${ROWS.filter(r=>r.gone).length} records)`):"";
  buildFilters();
  const all=filt(),withLoc=all.filter(r=>r.country),base=$("#inclNoLoc").checked?all:withLoc;
  const nD=base.reduce((s,r)=>s+r.ndef,0),zero=base.filter(r=>!r.ndef).length,det=base.filter(r=>r.detain).length;
  $("#kpis").innerHTML=[
    [base.length,L("PSC 檢查次數","PSC inspections"),""],[nD,L("缺失總數","Total deficiencies"),"sig"],[base.length?f2(nD/base.length):"0",L("平均缺失／次","Avg. deficiencies / insp."),""],
    [zero,L("零缺失次數","Zero-deficiency inspections"),""],[base.length?pct(zero/base.length):"—",L("零缺失比例","Zero-deficiency rate"),""],[det,L("扣船次數","Detentions"),det?"warn":""],
    [new Set(withLoc.map(r=>r.country)).size+" / "+new Set(withLoc.map(r=>r.port)).size,L("涵蓋國家 / 港口","Countries / ports"),""],
    [new Set(base.map(r=>r.ship)).size,L("受檢船數","Ships inspected"),""]
  ].map(([v,l,c])=>`<div class="kpi ${c}"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");
  const noLoc=all.length-withLoc.length,blank=base.filter(r=>r.ndefBlank).length,inc=$("#inclNoLoc").checked;
  $("#locNote").innerHTML=(noLoc?`<div class="notice">${L(`⚠ 目前條件下有 <b>${noLoc}</b> 筆 PSC 紀錄沒有填檢查地點，無法列入熱區統計${inc?"（已算進上方總數與趨勢）":"（目前上方總數也不含這些）"}。補填地點請到主系統「檢查紀錄」編輯。`,
      `⚠ <b>${noLoc}</b> PSC record(s) under the current filters have no inspection location and cannot be included in the hotspot analysis${inc?" (they are included in the totals and trend above)":" (they are also excluded from the totals above)"}. Locations can be filled in via Inspection Records in the main system.`)}</div>`:"")+
    (blank?`<div class="hint" style="margin-top:6px">${L(`另有 ${blank} 筆缺失數空白，以 0 計算。`,`${blank} record(s) have a blank deficiency count and are counted as 0.`)}</div>`:"");
  renderZone(withLoc);renderTrend(base);renderTypes(base);renderHeat(withLoc);renderShips(base);renderDetail(all);
  const defs=filt(null,DEFS);renderMap(withLoc,defs);renderCats(defs);
}

function setZone(k){zone=k;document.querySelectorAll("#zoneTabs button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));zoneSort={k:"n",d:-1};render();}
function sortZone(k){zoneSort=zoneSort.k===k?{k,d:-zoneSort.d}:{k,d:k==="k"?1:-1};render();}
function zoneKey(r){return zone==="country"?r.country:zone==="port"?r.port:r.region;}
function zoneLabel(k){return zone==="country"?cLabel(k):zone==="port"?portLabel(k):rLabel(k);}
function zoneClick(k){const key=zone;if(sel[key].size===1&&sel[key].has(k))sel[key].clear();else{sel[key].clear();sel[key].add(k);}render();window.scrollTo({top:0,behavior:"smooth"});}
function renderZone(rows){

    const r0=rows.find(r=>zoneKey(r)===x.k);
    return `<tr class="click" onclick="zoneClick(${JSON.stringify(x.k).replace(/"/g,"&quot;")})" title="${tip}"><td><b>${esc(zoneLabel(x.k))}</b></td>${zone!=="region"?`<td class="hint">${esc(r0?rLabel(r0.region):"")}</td>`:""}<td class="n"><b>${x.n}</b></td><td><div class="hbar" style="width:${x.n/maxN*100}%"></div></td><td class="n">${x.d}</td><td class="n"><span class="pill" style="background:${avgBg(x.avg)};color:${avgColor(x.avg)}">${f2(x.avg)}</span></td><td class="n">${x.max}</td><td class="n">${x.zero}</td><td class="n">${pct(x.zr)}</td><td class="n" style="${x.det?"color:var(--bad);font-weight:700":""}">${x.det||"—"}</td><td class="n">${x.ns}</td><td style="white-space:nowrap">${sd(x.last)}</td></tr>`;}).join("")||`<tr><td colspan="12" class="hint" style="text-align:center;padding:20px">${L("沒有符合條件、且有填地點的 PSC 紀錄","No PSC records with a location match the current filters")}</td></tr>`}</tbody>`;
  const top=(arr,lbl,fmt)=>`<div class="top"><h4>${lbl}</h4>${arr.length?`<ol>${arr.slice(0,5).map(x=>`<li>${esc(zoneLabel(x.k))} <span>${fmt(x)}</span></li>`).join("")}</ol>`:`<div class="hint">${L("資料不足","Not enough data")}</div>`}</div>`;
  const byN=[...a].sort((x,y)=>y.n-x.n||y.avg-x.avg),byAvg=a.filter(x=>x.n>=3).sort((x,y)=>y.avg-x.avg||y.n-x.n),byZero=a.filter(x=>x.n>=3).sort((x,y)=>y.zr-x.zr||y.n-x.n);
  const ztl=zt.toLowerCase();
  $("#tops").innerHTML=
    top(byN,L(`🔥 檢查最頻繁的${zt}`,`🔥 Most inspected (${ztl})`),x=>L(`${x.n} 次・平均 ${f2(x.avg)}`,`${x.n} insp. · avg ${f2(x.avg)}`))+
    top(byAvg,L(`⚠ 平均缺失最高的${zt}（≥3 次）`,`⚠ Highest avg. deficiencies (≥3 insp.)`),x=>L(`平均 ${f2(x.avg)}・${x.n} 次`,`avg ${f2(x.avg)} · ${x.n} insp.`))+

/* ══ 國家／港口名稱正規化（系統裡有「Lianyungang,CHINA」「JAKARTA,  INDONESIA」這類大小寫不一的寫法）══ */
const _CANON=(()=>{const m={};Object.keys(COUNTRY_ZH).forEach(k=>m[k.toLowerCase()]=k);Object.keys(COUNTRY_ALIAS).forEach(k=>m[k.toLowerCase()]=COUNTRY_ALIAS[k]);return m;})();
const canonCountry=c=>{c=String(c||"").trim();return _CANON[c.toLowerCase()]||c;};
const titleCase=s=>{s=String(s||"").trim().replace(/\s+/g," ");return s===s.toUpperCase()?s.toLowerCase().replace(/(^|[\s\-.(])([a-z])/g,(m,a,b)=>a+b.toUpperCase()):s;};

/* ══ 缺失明細（缺失紀錄總表的 PSC 缺失）：用「船＋檢查日期」對回檢查紀錄，取得港口／國家／扣船；
   對不到的才用缺失本身填的地點 ══ */
let DEFS=[];
const PSC_CH={1:"證書及文件 Certificates & Documentation",2:"結構狀況 Structural Condition",3:"水密/風雨密設備 Water/Weathertight Condition",4:"應急系統 Emergency Systems",5:"無線電通信 Radio Communication",6:"貨物操作包括設備 Cargo Operations Including Equipment",7:"消防安全 Fire Safety",8:"警報 Alarms",9:"工作及生活條件 Working and Living Conditions",10:"航行安全 Safety of Navigation",11:"救生設備 Life-Saving Appliances",12:"危險品 Dangerous Goods",13:"推進及輔助機械 Propulsion and Auxiliary Machinery",14:"污染防止 Pollution Prevention",15:"安全管理系統 ISM",16:"船舶保安 ISPS",18:"勞動條件 Labour Conditions",19:"產業人員 Industrial Personnel",99:"其他 Other"};
const chapKey=code=>{const m=String(code||"").trim().match(/^(\d+)/);if(!m)return "??";const two=+m[1].slice(0,2);return PSC_CH[two]?String(two).padStart(2,"0"):"??";};
const CAT_EN={"救生、消防、应急及安全设备":"LSA / fire-fighting / emergency & safety equipment","机舱设备":"Engine room equipment","船体/结构":"Hull / structure","生活区/MLC设备":"Accommodation / MLC equipment","驾驶台设备":"Bridge equipment","货物操作设备":"Cargo handling equipment","防污染设备":"Pollution prevention equipment","甲板设备":"Deck equipment","通信设备":"Communication equipment","04.MLC和船员福利作业":"04. MLC & crew welfare operations","18.船舶管理":"18. Ship management","13.机舱作业":"13. Engine room operations","05.航行和通信作业":"05. Navigation & communication operations","21.张贴和标志":"21. Postings & signs","00.通用船舶设备作业":"00. General ship equipment operations"};
const catKeySys=nc=>{const t=String(nc||"").split("‖")[0].trim();return t||"??";};
let catMode="chap",catPlace="port",trendP="q",mapMode="hot";
const catKey=d=>catMode==="chap"?d.chap:d.cat;
function catLabel(k){
  if(k==="??")return L("未分類（代碼空白或無法判讀）","Unclassified (blank / unreadable code)");
  if(catMode==="chap"){const n=PSC_CH[+k]||"";const i=n.search(/[A-Za-z]/);const zh=i>0?n.slice(0,i).trim():n,en=i>0?n.slice(i).trim():n;return `${k} ${LANG==="en"?en:zh}`;}
  return LANG==="en"?(CAT_EN[k]||k):k;
}
async function loadDefs(){
  try{
    let all=[],off=0,b;
    do{b=await get(`sync_defs?select=payload->>ship,payload->>date,payload->>code,payload->>ncMain,payload->>place,payload->>itype&payload->>itype=ilike.psc&order=id&offset=${off}&limit=1000`);all=all.concat(b);off+=1000;}while(b.length===1000);
    const idx={};ROWS.forEach(r=>{idx[r.ship+"|"+r.date]=r;});
    DEFS=all.map(x=>{
      const date=parseDate(x.date),r=idx[x.ship+"|"+date];
      const base={ship:x.ship,date,chap:chapKey(x.code),cat:catKeySys(x.ncMain),joined:!!r};
      if(r)return Object.assign(base,{country:r.country,port:r.port,portName:r.portName,region:r.region,type:r.type,vtype:r.vtype,gone:r.gone,detain:r.detain});
      const parts=String(x.place||"").split(",").map(s=>s.trim()).filter(Boolean),country=canonCountry(parts.length>1?parts[parts.length-1]:(parts[0]||"")),pn=parts.length>1?titleCase(parts.slice(0,-1).join(", ")):"";
      const s=shipOf(x.ship)||{};
      return Object.assign(base,{country,port:pn?`${pn}, ${country}`:"",portName:pn,region:regionOf(country),type:s.type1||"未分類",vtype:s.vtype||"",gone:!shipOf(x.ship),detain:false});
    }).filter(d=>d.date);
  }catch(e){DEFS=[];console.warn("defs load failed",e);}

/* ══ 趨勢：上圖檢查次數（油輪／散裝堆疊），下圖平均缺失（全部／油輪／散裝三條線）══ */
function setTrendP(p){trendP=p;document.querySelectorAll("#trTabs button").forEach(b=>b.classList.toggle("on",b.dataset.k===p));render();}
const SER=[{k:"all",c:"#1c3a5e",zh:"全部",en:"All ships"},{k:"tanker",c:"#1e7f8c",zh:"油輪",en:"Tanker"},{k:"bulk",c:"#b0702a",zh:"散裝",en:"Bulk"}];
function periodKeys(rows){
  const pk=r=>{const y=r.date.slice(0,4),m=+r.date.slice(5,7);return trendP==="y"?y:trendP==="q"?`${y} Q${Math.ceil(m/3)}`:`${y}-${String(m).padStart(2,"0")}`;};
  const ks=rows.map(pk).sort();if(!ks.length)return {pk,keys:[]};
  const keys=[],first=ks[0],last=ks[ks.length-1];
  if(trendP==="y"){for(let y=+first;y<=+last;y++)keys.push(String(y));}
  else if(trendP==="q"){let [y,q]=first.split(" Q").map(Number);const [y1,q1]=last.split(" Q").map(Number);while(y<y1||(y===y1&&q<=q1)){keys.push(`${y} Q${q}`);q++;if(q>4){q=1;y++;}}}
  else{let [y,m]=first.split("-").map(Number);const [y1,m1]=last.split("-").map(Number);while(y<y1||(y===y1&&m<=m1)){keys.push(`${y}-${String(m).padStart(2,"0")}`);m++;if(m>12){m=1;y++;}}}
  return {pk,keys};
}
function renderTrend(rows){
  const {pk,keys}=periodKeys(rows);
  if(!keys.length){$("#trend").innerHTML=`<div class="hint">${L("沒有資料","No data")}</div>`;$("#trendAvg").innerHTML="";return;}
  const g={};keys.forEach(k=>g[k]={n:0,d:0,tanker:{n:0,d:0},bulk:{n:0,d:0}});
  rows.forEach(r=>{const o=g[pk(r)];if(!o)return;o.n++;o.d+=r.ndef;const v=r.vtype==="bulk"?"bulk":"tanker";o[v].n++;o[v].d+=r.ndef;});
  const W=640,Lm=36,R=14,T=12,iw=W-Lm-R,bw=iw/keys.length,step=Math.ceil(keys.length/(trendP==="m"?10:12));
  const xl=(k,i,y)=>i%step===0?`<text x="${Lm+i*bw+bw/2}" y="${y}" font-size="10" text-anchor="middle" fill="#52656f">${k.replace(" "," ")}</text>`:"";
  // 上圖：堆疊長條
  {const H=200,B=26,ih=H-T-B,maxN=Math.max(1,...keys.map(k=>g[k].n)),nice=Math.max(5,Math.ceil(maxN/5)*5);
   let svg=`<div class="lg2"><span><i style="background:#1e7f8c;height:10px;width:10px"></i>${L("油輪","Tanker")}</span><span><i style="background:#b0702a;height:10px;width:10px"></i>${L("散裝","Bulk")}</span><span class="hint">${L("檢查次數","Inspections")}</span></div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="${L("每期 PSC 檢查次數","PSC inspections per period")}">`;
   for(let i=0;i<=5;i++){const y=T+ih-ih*i/5;svg+=`<line x1="${Lm}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#e8edf0"/><text x="${Lm-6}" y="${y+4}" font-size="10" text-anchor="end" fill="#8195a0">${Math.round(nice*i/5)}</text>`;}
   keys.forEach((k,i)=>{const o=g[k],x=Lm+i*bw+bw*0.16,w=Math.max(1,bw*0.68);let y=T+ih;
     [["tanker","#1e7f8c"],["bulk","#b0702a"]].forEach(([v,c],j)=>{const h=ih*o[v].n/nice;if(!h)return;y-=h;svg+=`<rect x="${x}" y="${y+(j?0:0)}" width="${w}" height="${Math.max(0,h-(j?1.5:0))}" rx="2" fill="${c}"><title>${k}：${L(v==="tanker"?"油輪":"散裝",v==="tanker"?"Tanker":"Bulk")} ${o[v].n}</title></rect>`;});
     svg+=`<rect x="${Lm+i*bw}" y="${T}" width="${bw}" height="${ih}" fill="transparent"><title>${L(`${k}：檢查 ${o.n} 次（油輪 ${o.tanker.n}／散裝 ${o.bulk.n}）`,`${k}: ${o.n} inspections (tanker ${o.tanker.n} / bulk ${o.bulk.n})`)}</title></rect>`;
     svg+=xl(k,i,H-B+16);});
   $("#trend").innerHTML=svg+"</svg>";}
  // 下圖：平均缺失折線
  {const H=210,B=26,ih=H-T-B;const val=(o)=>o.n?o.d/o.n:null;
   const mx=Math.max(1,...keys.flatMap(k=>[val(g[k]),val(g[k].tanker),val(g[k].bulk)]).filter(v=>v!=null)),nice=Math.ceil(mx);
   let svg=`<div class="lg2">${SER.map(s=>`<span><i style="background:${s.c}"></i>${L(s.zh,s.en)}</span>`).join("")}<span class="hint">${L("平均缺失／次","Avg. deficiencies / insp.")}</span></div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="${L("每期平均缺失","Average deficiencies per period")}">`;
   for(let i=0;i<=4;i++){const y=T+ih-ih*i/4;svg+=`<line x1="${Lm}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#e8edf0"/><text x="${Lm-6}" y="${y+4}" font-size="10" text-anchor="end" fill="#8195a0">${(nice*i/4).toFixed(1)}</text>`;}
   SER.forEach(s=>{const pts=keys.map((k,i)=>{const o=s.k==="all"?g[k]:g[k][s.k],v=val(o);return v==null?null:[Lm+i*bw+bw/2,T+ih-ih*v/nice,k,v,o.n];});
     // 沒有檢查的期間斷線，不硬連
     let seg=[];const segs=[];pts.forEach(p=>{if(p)seg.push(p);else{if(seg.length)segs.push(seg);seg=[];}});if(seg.length)segs.push(seg);
     segs.forEach(sg=>{if(sg.length>1)svg+=`<polyline points="${sg.map(p=>p[0]+","+p[1]).join(" ")}" fill="none" stroke="${s.c}" stroke-width="${s.k==="all"?2.5:1.8}" ${s.k==="all"?"":'stroke-dasharray="0"'} opacity="${s.k==="all"?1:.85}"/>`;});
     pts.forEach(p=>{if(p)svg+=`<circle cx="${p[0]}" cy="${p[1]}" r="${s.k==="all"?4:3}" fill="${s.c}" stroke="#fff" stroke-width="1.5"><title>${p[2]} ${L(s.zh,s.en)}：${L("平均","avg")} ${f2(p[3])}（${p[4]} ${L("次","insp.")}）</title></circle>`;});});
   keys.forEach((k,i)=>svg+=xl(k,i,H-B+16));
   $("#trendAvg").innerHTML=svg+"</svg>";}
}

/* ══ 缺失類型 ══ */
function setCatMode(m){catMode=m;document.querySelectorAll("#catTabs button").forEach(b=>b.classList.toggle("on",b.dataset.k===m));render();}

function catCount(defs){const m={};defs.forEach(d=>{const k=catKey(d);m[k]=(m[k]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
function topCatsHtml(defs,n){return catCount(defs).slice(0,n).map(([k,v])=>`<span class="catchip">${esc(catLabel(k))}<b>${v}</b></span>`).join("");}
function renderCats(defs){
  const joined=defs.filter(d=>d.joined).length;
  $("#dfSub").textContent=L(`資料來源：缺失紀錄總表中檢查來源為 PSC 的缺失明細，共 ${defs.length} 筆（其中 ${joined} 筆對得到檢查紀錄）。缺失紀錄總表的筆數可能少於檢查紀錄上填的缺失數，早期紀錄沒有逐筆登錄明細。`,
    `Source: PSC deficiency details in the deficiency register — ${defs.length} item(s) (${joined} matched to an inspection record). The register may hold fewer items than the deficiency counts on inspection records, as older inspections were not itemised.`);

  $("#catBars").innerHTML=cc.length?`<table><tbody>${cc.slice(0,14).map(([k,v])=>`<tr><td style="width:46%">${esc(catLabel(k))}</td><td><div class="hbar" style="width:${v/mx*100}%;background:#1e7f8c"></div></td><td class="n" style="width:52px"><b>${v}</b></td><td class="n hint" style="width:52px">${(v/tot*100).toFixed(0)}%</td></tr>`).join("")}</tbody></table>`:`<div class="hint">${L("沒有資料","No data")}</div>`;
  // 類型 × 年度
  const years=[...new Set(defs.map(d=>d.date.slice(0,4)))].sort(),top=cc.slice(0,10).map(x=>x[0]);
  const cy={};defs.forEach(d=>{const k=catKey(d)+"|"+d.date.slice(0,4);cy[k]=(cy[k]||0)+1;});const cmx=Math.max(1,...Object.values(cy));

  // 各地點主要缺失類型
  const pf=d=>catPlace==="port"?d.port:d.country;
  const groups={};defs.forEach(d=>{const k=pf(d);if(!k)return;(groups[k]=groups[k]||[]).push(d);});
  const rows=Object.entries(groups).sort((a,b)=>b[1].length-a[1].length);
  const insp=filt().filter(r=>pf(r));const ic={};insp.forEach(r=>{const k=pf(r);ic[k]=(ic[k]||0)+1;});
  const lbl=k=>catPlace==="port"?portLabel(k):cLabel(k);
  $("#catPort").innerHTML=`<thead><tr><th>${catPlace==="port"?L("港口","Port"):L("國家","Country")}</th><th class="n">${L("檢查次數","Inspections")}</th><th class="n">${L("缺失明細","Deficiency items")}</th><th>${L("主要缺失類型（前 3 名）","Top 3 deficiency types")}</th></tr></thead><tbody>${rows.map(([k,ds])=>`<tr class="click" onclick="sel['${catPlace}'].clear();sel['${catPlace}'].add(${JSON.stringify(k).replace(/"/g,"&quot;")});render();window.scrollTo({top:0,behavior:'smooth'})"><td><b>${esc(lbl(k))}</b></td><td class="n">${ic[k]||"—"}</td><td class="n"><b>${ds.length}</b></td><td>${topCatsHtml(ds,3)}</td></tr>`).join("")||`<tr><td colspan="4" class="hint" style="text-align:center;padding:20px">${L("沒有對得到地點的缺失明細","No deficiency items with a location")}</td></tr>`}</tbody>`;
}

let MAP=null,MAPL=null;
function setMapMode(m){mapMode=m;document.querySelectorAll("#mapTabs button").forEach(b=>b.classList.toggle("on",b.dataset.k===m));render();}
function llOf(r){const p=PORT_LL[String(r.portName||"").toLowerCase()];if(p)return {ll:p,exact:true};const c=COUNTRY_LL[r.country];return c?{ll:c,exact:false}:null;}
function focusPt(lat,lng){if(MAP){MAP.setView([lat,lng],6);document.getElementById("map").scrollIntoView({behavior:"smooth",block:"center"});}}
function renderMap(rows,defs){
  // 依「港口（找不到座標的併到國家中心）」彙總
  const pts={};
  rows.forEach(r=>{const g=llOf(r);if(!g)return;const key=g.exact?r.port:"@"+r.country;
    const p=pts[key]=pts[key]||{key,ll:g.ll,exact:g.exact,name:g.exact?portLabel(r.port):cLabel(r.country)+L("（港口未定位）"," (port not located)"),country:r.country,rows:[],ports:new Set()};
    p.rows.push(r);if(r.portName)p.ports.add(r.portName);});
  const list=Object.values(pts).map(p=>{const a=agg(p.rows,()=>"x")[0];const ds=defs.filter(d=>p.exact?d.port===p.key:(d.country===p.country&&!PORT_LL[String(d.portName||"").toLowerCase()]));
    return Object.assign(p,{zero:a.zero,n:a.n,d:a.d,avg:a.avg,det:a.det,last:a.last,ds,risk:(a.n>=2&&a.avg>=2)||a.det>0});});
  // 高風險／熱區清單
  const rk=mapMode==="risk"?list.filter(p=>p.risk).sort((a,b)=>b.det-a.det||b.avg-a.avg||b.n-a.n):[...list].sort((a,b)=>b.n-a.n).slice(0,15);
  $("#riskHead").textContent=mapMode==="risk"?L(`⚠ 高風險地點（${rk.length}）`,`⚠ High-risk locations (${rk.length})`):L("🔥 檢查最頻繁的地點（前 15）","🔥 Most inspected locations (top 15)");
  $("#riskList").innerHTML=rk.map(p=>`<div class="ri" onclick="focusPt(${p.ll[0]},${p.ll[1]})"><b>${esc(p.name)}</b>${p.det?` <span class="pill" style="background:#fde3e0;color:#c0392b">⚑ ${L("扣船","Detained")} ${p.det}</span>`:""}<br><span class="hint">${L(`檢查 ${p.n} 次・缺失 ${p.d}・平均`,`${p.n} insp. · ${p.d} def. · avg`)} </span><span class="pill" style="background:${avgBg(p.avg)};color:${avgColor(p.avg)}">${f2(p.avg)}</span>${p.ds.length?`<div style="margin-top:3px">${topCatsHtml(p.ds,2)}</div>`:""}</div>`).join("")||`<div class="hint" style="padding:12px">${mapMode==="risk"?L("目前條件下沒有高風險地點 🎉","No high-risk locations under the current filters 🎉"):L("沒有資料","No data")}</div>`;
  if(typeof L_==="undefined"){$("#map").innerHTML=`<div class="hint" style="padding:20px">${L("地圖元件載入失敗（可能是網路阻擋），其他圖表不受影響。","The map library failed to load (possibly blocked by the network). Other charts are unaffected.")}</div>`;return;}
  if(!MAP){MAP=L_.map("map",{worldCopyJump:true,scrollWheelZoom:false}).setView([15,110],2);
    L_.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",{maxZoom:16,attribution:"Tiles &copy; Esri"}).addTo(MAP);
    L_.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}",{maxZoom:16}).addTo(MAP);
    MAP.on("focus",()=>MAP.scrollWheelZoom.enable());MAP.on("blur",()=>MAP.scrollWheelZoom.disable());
    const lg=L_.control({position:"bottomleft"});lg.onAdd=()=>{const d=L_.DomUtil.create("div","legend");d.id="mapLegend";return d;};lg.addTo(MAP);}
  if(MAPL)MAPL.remove();MAPL=L_.layerGroup().addTo(MAP);
  const mxN=Math.max(1,...list.map(p=>p.n));
  list.sort((a,b)=>b.n-a.n).forEach(p=>{
    const r=6+Math.sqrt(p.n/mxN)*22;
    const col=mapMode==="risk"?avgColor(p.avg):"#1e7f8c",fill=mapMode==="risk"?avgColor(p.avg):"#1e7f8c";
    const op=mapMode==="risk"?0.55:0.25+0.5*p.n/mxN;
    const c=L_.circleMarker(p.ll,{radius:r,color:p.det&&mapMode==="risk"?"#c0392b":col,weight:p.det&&mapMode==="risk"?3:1.5,fillColor:fill,fillOpacity:op,dashArray:p.exact?null:"4 3"});
    c.bindPopup(`<b style="font-size:14px">${esc(p.name)}</b><br>${L("PSC 區域","PSC region")}：${esc(rLabel(regionOf(p.country)))}<br>${L("檢查","Inspections")}：<b>${p.n}</b>　${L("零缺失","Zero-def.")}：<b>${p.zero}</b>　${L("缺失","Deficiencies")}：<b>${p.d}</b>　${L("平均","Avg.")}：<b style="color:${avgColor(p.avg)}">${f2(p.avg)}</b>${p.det?`<br><b style="color:#c0392b">⚑ ${L("扣船","Detentions")} ${p.det}</b>`:""}<br>${L("最近檢查","Latest")}：${sd(p.last)}${!p.exact&&p.ports.size?`<br><span style="color:#8195a0">${L("包含","Includes")}：${esc([...p.ports].join(", "))}</span>`:""}${p.ds.length?`<div style="margin-top:6px"><b>${L("主要缺失類型","Main deficiency types")}</b><br>${topCatsHtml(p.ds,3)}</div>`:""}`);
    c.bindTooltip(`${esc(p.name)}：${p.n} ${L("次","insp.")}`);
    c.addTo(MAPL);});
  const lgd=document.getElementById("mapLegend");
  if(lgd)lgd.innerHTML=mapMode==="risk"?`<b>${L("平均缺失／次","Avg. def. / insp.")}</b><br><i style="background:#2e8b57"></i>≤ 0.5<br><i style="background:#7a8a1a"></i>0.5–1.5<br><i style="background:#b5610f"></i>1.5–3<br><i style="background:#c0392b"></i>&gt; 3<br><i style="background:#fff;border:3px solid #c0392b;width:8px;height:8px"></i>${L("曾被扣船","Detention")}<br><span style="color:#8195a0">${L("虛線＝港口未定位","Dashed = port not located")}</span>`
    :`<b>${L("圓圈大小＝檢查次數","Circle size = inspections")}</b><br><span style="color:#8195a0">${L("顏色越深＝越常被查","Darker = inspected more often")}<br>${L("虛線＝港口未定位","Dashed = port not located")}</span>`;
  // 篩選結果改變時自動縮放到所有圓圈；只是切換熱區／高風險時維持使用者目前的視野
  const sig=list.map(p=>p.key).sort().join("|");
  setTimeout(()=>{MAP.invalidateSize();if(sig!==MAP._sig&&list.length){MAP._sig=sig;MAP.fitBounds(L_.latLngBounds(list.map(p=>p.ll)).pad(0.15),{maxZoom:6});}},60);
}

}

function setHeat(k){heatK=k;document.querySelectorAll("#heatTabs button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));render();}
function renderHeat(rows){
  const kf=r=>heatK==="country"?r.country:r.port;
  const years=[...new Set(rows.map(r=>r.date.slice(0,4)))].sort();
  const top=agg(rows,kf).sort((a,b)=>b.n-a.n).slice(0,15);
  if(!top.length){$("#heat").innerHTML=`<tr><td class="hint">${L("沒有資料","No data")}</td></tr>`;return;}
  const cell={};rows.forEach(r=>{const k=kf(r)+"|"+r.date.slice(0,4);(cell[k]=cell[k]||{n:0,d:0});cell[k].n++;cell[k].d+=r.ndef;});
  const mx=Math.max(1,...Object.values(cell).map(c=>c.n));
  const lbl=k=>heatK==="country"?cLabel(k):portLabel(k),av=L("均","avg");
  $("#heat").innerHTML=`<thead><tr><th>${heatK==="country"?L("國家","Country"):L("港口","Port")}</th>${years.map(y=>`<th style="text-align:center">${y}</th>`).join("")}<th style="text-align:center">${L("合計","Total")}</th></tr></thead><tbody>${top.map(t=>`<tr><td class="lbl">${esc(lbl(t.k))}</td>${years.map(y=>{const c=cell[t.k+"|"+y];if(!c)return `<td style="background:#f6f8f9;color:#c3ced5">·</td>`;const a=c.n/mx,dark=a>0.55;
      return `<td style="background:rgba(30,127,140,${0.12+a*0.8});color:${dark?"#fff":"#15262f"}" title="${esc(lbl(t.k))} ${y}：${L(`檢查 ${c.n} 次，缺失 ${c.d} 筆`,`${c.n} inspections, ${c.d} deficiencies`)}"><b>${c.n}</b><div style="font-size:10.5px;opacity:.85">${av} ${f2(c.d/c.n)}</div></td>`;}).join("")}<td><b>${t.n}</b><div style="font-size:10.5px;color:var(--ink-3)">${av} ${f2(t.avg)}</div></td></tr>`).join("")}</tbody>`;
}

function sortShip(k){shipSort=shipSort.k===k?{k,d:-shipSort.d}:{k,d:k==="k"?1:-1};render();}

function renderDetail(rows){
