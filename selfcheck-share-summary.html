<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分享自查彙整清單 — FPMC</title>
<style>
:root{
  --navy:#1c3a5e; --navy-2:#234a72; --navy-3:#2f6690;
  --paper:#f5f7f8; --card:#ffffff; --line:#dde4e8; --line-2:#c3ced5;
  --ink:#15262f; --ink-2:#52656f; --ink-3:#8195a0;
  --signal:#e8842c; --teal:#1e7f8c;
  --ok:#2e8b57; --bad:#c0392b; --warn:#c99a1f;
  --sans:"Segoe UI","Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);font-family:var(--sans);color:var(--ink)}
.wrap{max-width:1100px;margin:0 auto;padding:0 0 60px}
header{background:var(--navy);color:#fff;padding:20px 18px}
header h1{margin:0;font-size:18px}
header p{margin:6px 0 0;font-size:12.5px;color:#b9c8d6;line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:14px;padding:16px}
.hint{color:var(--ink-3);font-size:12px;line-height:1.7}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:#fff;color:var(--ink);padding:9px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:var(--sans);font-weight:600;text-decoration:none}
.btn.primary{background:var(--signal);border-color:var(--signal);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
input[type=text],input[type=password],select{padding:9px 10px;border:1px solid var(--line-2);border-radius:8px;font-size:14px;font-family:var(--sans);width:100%}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;z-index:99;max-width:90vw;text-align:center}
#toast.err{background:var(--bad)}
#toast.ok2{background:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:#f0f3f5;font-size:11.5px;color:var(--ink-2);position:sticky;top:0}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{background:#e4e9ec}
th.sortable.sorted{color:var(--navy);background:#e4e9ec}
tr.track td{background:#fff4e8}
tr.done td{background:#eaf5ee}
.pill{display:inline-block;border-radius:20px;padding:1px 9px;font-size:11px;font-weight:700}
.pill.ok{background:#eaf5ee;color:var(--ok)}
.pill.warn{background:#fff4e8;color:#a05a10}
.pill.bad{background:#fbe9e5;color:var(--bad)}
.pill.na{background:#eef0f4;color:var(--ink-2)}
.detailrow{display:none}
.detailrow.show{display:table-row}
.itemline{border-bottom:1px dashed var(--line);padding:6px 0}
.itemline:last-child{border-bottom:none}
.stbadge{font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 7px;margin-left:6px}
.stbadge.ok{background:#eaf5ee;color:var(--ok)}
.stbadge.similar{background:#fff4e8;color:#a05a10}
.stbadge.self{background:#e9edf7;color:var(--navy-3)}
.stbadge.na{background:#eef0f4;color:var(--ink-2)}
.stbadge.pending{background:#f0f3f5;color:var(--ink-3)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#f7f9fb;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi .v{font-size:20px;font-weight:700;color:var(--navy)}
.kpi .l{font-size:11px;color:var(--ink-3)}
.modal-bg{position:fixed;inset:0;background:rgba(15,30,45,.45);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal-bg.show{display:flex}
.modal-box{background:#fff;border-radius:10px;max-width:560px;width:100%;padding:18px;max-height:86vh;display:flex;flex-direction:column}
.modal-box textarea{flex:1;min-height:260px;font-family:var(--sans);font-size:13px;padding:10px;border:1px solid var(--line-2);border-radius:8px;resize:vertical;line-height:1.6}
#printArea{display:none}
@media print{
  #mainWrap,#toast{display:none!important}
  #printArea{display:block!important;font-size:11px;color:#000}
  #printArea h1{font-size:18px;margin:0 0 4px}
  #printArea h2{font-size:14px;margin:16px 0 6px}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea th,#printArea td{border:1px solid #888;padding:4px 6px;font-size:10.5px;position:static;background:none}
  #printArea th{background:#e8edf1;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea tr{page-break-inside:avoid}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div class="wrap" id="mainWrap">
  <header>
    <a class="btn sm" href="./" style="float:right;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff">← 返回系統</a>
    <h1>📊 分享自查彙整清單</h1>
    <p>查看船隊「分享缺失做自查」各活動的填答進度與內容；點船名列可展開查看每一項的作答細節。</p>
  </header>

  <!-- 活動列表：多個活動會持續累積，這裡是進入後的預設畫面，列出全部活動＋各自統計，
       點「查看進度」才切進單一活動的詳細畫面（下面的 detailView）。 -->
  <div id="listView">
    <div class="card">
      <div class="toolbar">
        <span style="font-weight:700;color:var(--ink-3);font-size:12px">共 <span id="campaignCount">0</span> 個活動</span>
        <button class="btn sm" onclick="loadCampaignList()">🔄 重新整理</button>
        <button class="btn sm" onclick="exportAllCampaigns()" title="彙整所有活動、所有船舶的檢查結果與明細成一份 Excel，供督導長期追蹤">⬇ 匯出全部活動明細</button>
      </div>
      <div style="overflow-x:auto" id="campaignList"></div>
    </div>
  </div>

  <!-- 單一活動詳情：各船進度、篩選、明細展開、刪除。 -->
  <div id="detailView" style="display:none">
    <div class="card">
      <div class="toolbar">
        <button class="btn sm" onclick="showListView()">← 返回活動列表</button>
        <span style="font-weight:700;font-size:14px" id="detailTitle"></span>
        <span style="flex:1"></span>
        <button class="btn sm" onclick="exportExcel()" title="船隊完成狀況＋需處理項目（實際情況／處理情況／結案狀態）">⬇ 下載 Excel</button>
        <button class="btn sm" onclick="exportPdf()" title="開啟列印，選「另存為 PDF」">⬇ 下載 PDF</button>
        <button class="btn sm" onclick="copyMailText()" title="複製「自查項目＋連結」（上下兩行），貼入郵件發給船隊">✉ MAIL船</button>
        <button class="btn sm" onclick="copyFillLink()">📋 複製連結</button>
        <button class="btn sm" onclick="loadCampaign(curCampaign&&curCampaign.id)">🔄 重新整理</button>
      </div>
      <div id="campaignDesc" class="hint"></div>
    </div>

    <div class="card" id="statsCard" style="display:none">
      <div class="kpis" id="kpis"></div>
      <div class="toolbar">
        <span class="hint" style="font-weight:700;color:var(--ink-3)">篩選</span>
        <select id="filterSel" onchange="renderTable()">
          <option value="all">全部船舶</option>
          <option value="track">⚠ 有需追蹤項目（未結案）</option>
          <option value="unsubmitted">未送出</option>
          <option value="submitted">已送出</option>
        </select>
        <input type="text" id="shipSearch" placeholder="輸入船名快速查找…" style="max-width:200px" oninput="renderTable()">
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th style="width:90px">船舶</th><th style="width:100px">填寫人</th><th style="width:110px">進度</th><th style="width:130px">需追蹤</th><th style="width:70px">送出次數</th><th>最後送出</th><th style="width:160px">操作</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 提醒追蹤：內容可自行編輯，編輯完按「複製內容」貼到 Email／通訊軟體發給船上 -->
<div class="modal-bg" id="trackModal">
  <div class="modal-box">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <b style="font-size:15px;color:var(--navy)">🔔 提醒追蹤（<span id="trackModalShip"></span>）</b>
      <span style="flex:1"></span>
      <button class="btn sm" onclick="closeTrackReminder()">✕</button>
    </div>
    <p class="hint" style="margin:0 0 8px">內容可自行編輯，編輯後按「複製內容」貼到 Email／通訊軟體發給船上。</p>
    <textarea id="trackModalText"></textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">
      <button class="btn" onclick="closeTrackReminder()">取消</button>
      <button class="btn primary" onclick="copyTrackReminder()">📋 複製內容</button>
    </div>
  </div>
</div>

<div id="printArea"></div>
<div id="toast"></div>

<script>
const CLOUD = {
  url: "https://iqmbircjokdzdssouwkr.supabase.co",
  key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlxbWJpcmNqb2tkemRzc291d2tyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNDAwODIsImV4cCI6MjA5NjgxNjA4Mn0.OZ2ez6ondz49kT90gwneYUXG7CbE8iiB6PnXE5fR6iY"
};
const CAMPAIGN_TABLE = "selfcheck_share_campaigns";
const RESPONSE_TABLE = "selfcheck_share_responses";

const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function safeCopyText(text,okMsg){
  okMsg=okMsg||"✓ 已複製";
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>notify(okMsg,"ok2")).catch(()=>fallbackCopyText(text,okMsg));
  }else fallbackCopyText(text,okMsg);
}
function fallbackCopyText(text,okMsg){
  try{
    const ta=document.createElement("textarea");
    ta.value=text;ta.style.position="fixed";ta.style.left="-9999px";ta.style.top="0";
    document.body.appendChild(ta);ta.focus();ta.select();
    const ok=document.execCommand("copy");
    document.body.removeChild(ta);
    notify(ok?okMsg:"⚠ 自動複製失敗，請手動選取文字複製","ok2");
  }catch(e){notify("⚠ 自動複製失敗，請手動選取文字複製","err");}
}
/* 建立活動當下如果沒按到「複製連結」就關掉視窗，連結本身沒有另外存檔，
   之前只能回去問海技人員或重新建一個活動——這裡讓填答連結可以隨時從這個
   彙整清單頁面依「目前選的活動」重新算出來、重新複製，活動 id 就是連結參數本身，
   只要活動還在（沒被刪除），永遠可以在這裡找回同一條連結。 */
function copyFillLink(id){
  const cid=id!=null?id:(curCampaign&&curCampaign.id);
  if(cid==null){notify("⚠ 請先選擇活動","err");return;}
  const url=`${location.href.replace(/[^/]*$/,"")}submit-selfcheck-share.html?cid=${cid}`;
  safeCopyText(url,"✓ 已複製填答連結");
}
/* MAIL船：複製「活動名稱＋連結」，可直接貼進郵件發給船隊 */
function copyMailText(id){
  const cid=id!=null?id:(curCampaign&&curCampaign.id);
  if(cid==null){notify("⚠ 請先選擇活動","err");return;}
  const c=campaigns.find(x=>String(x.id)===String(cid));
  const url=`${location.href.replace(/[^/]*$/,"")}submit-selfcheck-share.html?cid=${cid}`;
  const text=`${c&&c.title?c.title+"\n":""}${url}`; // 上面自查項目、下面連結
  safeCopyText(text,"✓ 已複製");
  alert("已複製下列內容，可貼入郵件發給船隊：\n\n"+text);
}

/* 受檢船・檢查來源・日期（來源字串格式「船名 檢查來源 日期」），跟船上填單頁的顯示一致 */
function fmtSrc(s){const p=String(s||"").trim().split(/\s+/);return p.length>=3?`${shipLabel(p[0])}・${p.slice(1,-1).join(" ")}・${p[p.length-1]}`:String(s||"");}
const srcTag=it=>it.src?`<span style="margin-left:8px;font-size:12px;font-weight:700;color:#1e7f8c;background:#e4f1f2;border-radius:10px;padding:1px 10px;white-space:nowrap">${esc(fmtSrc(it.src))}</span>`:"";
let toastTimer;
function notify(msg,tone){
  const el=document.getElementById("toast");
  el.textContent=msg; el.className=tone==="err"?"err":(tone==="ok2"?"ok2":"");
  el.style.display="block"; clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.style.display="none",4200);
}
// ⚠ opts.headers（若有帶）會整個取代預設 headers，不是逐欄位合併——呼叫端只要自己帶了
// headers，就一定要自己把 apikey／Authorization 也一起帶齊，否則會漏掉驗證資訊被拒絕。
// authHeaders() 統一提供這組基本 header，呼叫端只需要在後面疊加自己這次需要的 Prefer 等欄位。
function authHeaders(extra){ return Object.assign({"apikey":CLOUD.key,"Authorization":"Bearer "+CLOUD.key,"Content-Type":"application/json"},extra||{}); }
async function api(path,opts){
  const res=await fetch(`${CLOUD.url}/rest/v1/${path}`,Object.assign({headers:authHeaders()},opts||{}));
  if(!res.ok){ const t=await res.text().catch(()=>""); throw new Error("HTTP "+res.status+" "+t.slice(0,150)); }
  const ct=res.headers.get("content-type")||"";
  return ct.includes("json")?res.json():null;
}
/* ══════════ 活動清單／篩選狀態 ══════════
   allResponses：全部活動、全部船舶的填答一次抓回來，列表頁靠這份現算每個活動的統計，
   不用「列出N個活動就查N次」，活動數量變多也不會變慢。 */
const EXCLUDED_SHIPS=["F25","F26","PH","PI"]; // 不參與分享自查的船舶（預設排除）
let campaigns=[], curCampaign=null, responses=[], shipOpts=[], allResponses=[];
async function loadShipOpts(){
  try{
    const rows=await api("app_db?select=payload&k=eq.ships");
    const list=rows&&rows[0]&&Array.isArray(rows[0].payload)?rows[0].payload:[];
    shipOpts=list.filter(s=>!EXCLUDED_SHIPS.includes(s.code)).map(s=>({code:s.code,name:s.zh||s.name||s.code,label:[s.zh,s.name].filter(Boolean).join(" ")||s.code}));
  }catch(e){}
}
async function loadCampaignList(){
  await loadShipOpts();
  try{
    campaigns=await api(`${CAMPAIGN_TABLE}?order=created_at.desc&limit=200`);
    allResponses=await api(`${RESPONSE_TABLE}?select=id,campaign_id,ship,items,submitted_at&limit=5000`);
  }catch(e){
    notify("⚠ 活動清單讀取失敗："+e.message,"err");
    return;
  }
  showListView();
}
function campaignStats(c){
  const resp=allResponses.filter(r=>String(r.campaign_id)===String(c.id));
  const total=(c.ship_scope&&c.ship_scope.length)?c.ship_scope.length:(shipOpts.length||resp.length);
  const submitted=resp.filter(r=>r.submitted_at).length;
  let track=0;
  resp.forEach(r=>{ track+=(r.items||[]).filter(it=>it.status==="similar"&&!it.closed).length; });
  return {started:resp.length,total,submitted,track};
}
function showListView(){
  document.getElementById("listView").style.display="";
  document.getElementById("detailView").style.display="none";
  renderListView();
}
/* 活動列表排序：點表頭切排序欄位，同一欄再點一次反轉方向。排序只影響顯示順序，
   不影響資料本身；每次重新整理（loadCampaignList）沿用上次選的排序條件。 */
let listSort={key:"created_at",dir:-1};
const LIST_SORT_COLS={
  title:{label:"活動",get:(c,st)=>c.title||("活動 #"+c.id)},
  created_at:{label:"建立",get:(c,st)=>c.created_at||0},
  active:{label:"狀態",get:(c,st)=>c.active===false?0:1},
  started:{label:"已開始/應填",get:(c,st)=>st.total?st.started/st.total:st.started},
  submitted:{label:"已送出",get:(c,st)=>st.submitted},
  track:{label:"需追蹤",get:(c,st)=>st.track}
};
function sortListBy(key){
  if(listSort.key===key)listSort.dir=-listSort.dir;
  else listSort={key,dir:key==="title"?1:-1}; // 文字欄位預設 A→Z，數字／日期欄位預設由大到小
  renderListView();
}
function renderListView(){
  document.getElementById("campaignCount").textContent=campaigns.length;
  const box=document.getElementById("campaignList");
  if(!campaigns.length){ box.innerHTML=`<p class="hint" style="text-align:center;padding:20px">目前沒有任何分享自查活動，請在填單審核頁按「📤 建立分享自查連結」建立一個。</p>`; return; }
  const withStats=campaigns.map(c=>({c,st:campaignStats(c)}));
  const col=LIST_SORT_COLS[listSort.key]||LIST_SORT_COLS.created_at;
  withStats.sort((a,b)=>{
    const va=col.get(a.c,a.st),vb=col.get(b.c,b.st);
    const cmp=typeof va==="string"?va.localeCompare(vb,"zh-Hant"):va-vb;
    return cmp*listSort.dir;
  });
  const th=(key,label,style)=>{const on=listSort.key===key;return `<th${style?` style="${style}"`:""} class="sortable${on?" sorted":""}" onclick="sortListBy('${key}')">${label}${on?(listSort.dir>0?" ▲":" ▼"):""}</th>`;};
  box.innerHTML=`<table><thead><tr>${th("title","活動")}${th("created_at","建立","width:150px")}${th("active","狀態","width:74px")}${th("started","已開始/應填","width:100px")}${th("submitted","已送出","width:64px")}${th("track","需追蹤","width:110px")}<th style="width:380px">操作</th></tr></thead><tbody>
    ${withStats.map(({c,st})=>{
      const ended=c.active===false;
      return `<tr class="${st.track?'track':''}">
        <td><b>${esc(c.title||("活動 #"+c.id))}</b><div class="hint">共 ${(c.items||[]).length} 項查核項目</div></td>
        <td class="hint">${c.created_at?esc(new Date(c.created_at).toLocaleString("zh-TW",{hour12:false})):""}${c.created_by?"<br>"+esc(c.created_by):""}</td>
        <td>${ended?'<span class="pill na">已結束</span>':'<span class="pill ok">進行中</span>'}</td>
        <td>${st.started} / ${st.total}</td>
        <td>${st.submitted}</td>
        <td>${st.track?`<span class="pill bad">⚠ ${st.track} 項</span>`:'<span class="pill na">—</span>'}</td>
        <td style="white-space:nowrap">
          <button class="btn sm" onclick="openDetail(${c.id})">📊 進度</button>
          <button class="btn sm" onclick="copyMailText(${c.id})" title="複製「自查項目＋連結」（上下兩行），貼入郵件發給船隊">✉ MAIL船</button>
          <button class="btn sm" onclick="copyFillLink(${c.id})">📋 連結</button>
          <button class="btn sm" onclick="toggleActive(${c.id})">${ended?"▶ 重啟":"⏸ 結束"}</button>
          <button class="btn sm" style="color:var(--bad);border-color:var(--bad)" onclick="deleteCampaign(${c.id})">🗑 刪除</button>
        </td>
      </tr>`;
    }).join("")}
  </tbody></table>`;
}
async function toggleActive(id){
  const c=campaigns.find(x=>String(x.id)===String(id));if(!c)return;
  const next=c.active===false;
  try{
    await api(`${CAMPAIGN_TABLE}?id=eq.${id}`,{method:"PATCH",headers:authHeaders({"Prefer":"return=minimal"}),body:JSON.stringify({active:next})});
    c.active=next;
    notify(next?"✓ 已重新啟用，船上又可以打開連結繼續填答":"✓ 已結束活動（資料仍保留，船上打開連結會看到已結束提示，不能再填答）","ok2");
    renderListView();
    if(curCampaign&&String(curCampaign.id)===String(id))curCampaign.active=next;
  }catch(e){notify("⚠ 更新失敗："+e.message,"err");}
}
async function deleteCampaign(id){
  const c=campaigns.find(x=>String(x.id)===String(id));if(!c)return;
  const st=campaignStats(c);
  const v=prompt(`確定要刪除活動「${c.title}」？\n\n這會一併永久刪除已收到的 ${st.started} 艘船填答內容，動作無法復原。\n\n請輸入「確定刪除」以繼續：`);
  if(v!=="確定刪除"){if(v!==null)notify("⚠ 輸入不符，已取消","err");return;}
  try{
    await api(`${RESPONSE_TABLE}?campaign_id=eq.${id}`,{method:"DELETE",headers:authHeaders()});
    await api(`${CAMPAIGN_TABLE}?id=eq.${id}`,{method:"DELETE",headers:authHeaders()});

}

/* 這個活動的「應填船舶清單」：有限定就用限定清單，沒限定就用全船舶清單
   （沒填答的船仍要列出來，才看得出「還有誰沒填」，不能只顯示已經有回應的船）。 */
function shipLabel(code){const s=shipOpts.find(x=>x.code===code);return s?s.label:(code||"");}
function targetShips(){
  const scope=(curCampaign.ship_scope&&curCampaign.ship_scope.length)?curCampaign.ship_scope:null;
  if(scope)return scope.map(code=>{const hit=shipOpts.find(s=>s.code===code);return {code,name:hit?hit.name:code,label:hit?hit.label:code};});
  return shipOpts.length?shipOpts:responses.map(r=>({code:r.ship,name:r.ship,label:r.ship}));
}

function rowStat(resp){
  if(!resp)return {done:0,total:(curCampaign.items||[]).length,openTrack:0,closedTrack:0};
  const items=resp.items||[];
  const done=items.filter(it=>it.status&&it.status!=="pending").length;
  const openTrack=items.filter(it=>it.status==="similar"&&!it.closed).length;
  const closedTrack=items.filter(it=>it.status==="similar"&&it.closed).length;
  return {done,total:items.length,openTrack,closedTrack};
}

function renderTable(){
  const tbody=document.getElementById("tbody");
  const filter=document.getElementById("filterSel").value;
  const kw=(document.getElementById("shipSearch").value||"").trim().toLowerCase();
  const byShip=new Map(responses.map(r=>[r.ship,r]));
  let ships=targetShips();
  if(kw)ships=ships.filter(s=>s.code.toLowerCase().includes(kw)||(s.name||"").toLowerCase().includes(kw)||(s.label||"").toLowerCase().includes(kw));
  const rowsHtml=[];
  let nSubmitted=0,nTrackOpen=0,nDone=0;
  ships.forEach(s=>{
    const resp=byShip.get(s.code);
    const st=rowStat(resp);
    const submitted=!!(resp&&resp.submitted_at);
    if(submitted)nSubmitted++;
    if(st.openTrack)nTrackOpen++;
    if(resp&&st.total&&st.done===st.total)nDone++;
    if(filter==="track"&&!st.openTrack)return;
    if(filter==="unsubmitted"&&submitted)return;
    if(filter==="submitted"&&!submitted)return;
    const pct=st.total?Math.round(st.done/st.total*100):0;
    const trackPill=st.openTrack?`<span class="pill bad">⚠ ${st.openTrack} 項未結案</span>`:(st.closedTrack?`<span class="pill ok">✓ ${st.closedTrack} 項已結案</span>`:`<span class="pill na">—</span>`);
    const editUrl=`submit-selfcheck-share.html?cid=${curCampaign.id}&ship=${encodeURIComponent(s.code)}`;
    rowsHtml.push(`
      <tr class="${st.openTrack?'track':(submitted&&st.total&&st.done===st.total?'done':'')}" data-ship="${esc(s.code)}" style="cursor:pointer" onclick="rowClick(event,'${esc(s.code)}')" title="點這一列查看這艘船的作答內容">
        <td>${esc(s.label||s.name||"")}</td>
        <td>${resp?esc(resp.checker_name||"—")+(resp.checker_title?`<div class="hint">${esc(resp.checker_title)}</div>`:""):"<span class='hint'>尚未開始</span>"}</td>
        <td>${resp?`${st.done} / ${st.total}（${pct}%）`:"<span class='hint'>0 / "+(curCampaign.items||[]).length+"</span>"}</td>
        <td>${trackPill}</td>
        <td>${resp?(resp.submit_count||0):0}</td>
        <td>${resp&&resp.submitted_at?esc(new Date(resp.submitted_at).toLocaleString("zh-TW",{hour12:false})):"<span class='hint'>未送出</span>"}</td>
        <td style="white-space:nowrap">
          <button class="btn sm" onclick="toggleDetail('${esc(s.code)}')">📄 查看</button>
          ${st.openTrack?`<button class="btn sm" style="border-color:var(--warn);color:#a05a10" onclick="openTrackReminder('${esc(s.code)}')" title="編輯內容後複製，發給船上追蹤這幾項是否已改善">🔔 提醒追蹤</button>`:""}
          ${resp?`<button class="btn sm" style="color:var(--bad);border-color:var(--bad)" onclick="deleteResponse('${esc(s.code)}')" title="刪除這艘船在本活動的填答內容">🗑</button>`:""}
        </td>
      </tr>
      <tr class="detailrow" id="detail-${esc(s.code)}"><td colspan="7"></td></tr>
    `);
  });
  tbody.innerHTML=rowsHtml.join("")||`<tr><td colspan="7" class="hint" style="text-align:center;padding:20px">找不到符合條件的船舶</td></tr>`;
  document.getElementById("kpis").innerHTML=`
    <div class="kpi"><div class="v">${responses.length} / ${targetShips().length}</div><div class="l">已開始填答／應填船數</div></div>
    <div class="kpi"><div class="v">${nSubmitted}</div><div class="l">已送出</div></div>
    <div class="kpi"><div class="v">${nDone}</div><div class="l">全部題目已作答</div></div>
    <div class="kpi" style="${nTrackOpen?'border-color:var(--bad)':''}"><div class="v" style="${nTrackOpen?'color:var(--bad)':''}">${nTrackOpen}</div><div class="l">艘船有未結案追蹤項目</div></div>
  `;
}

async function deleteResponse(ship){
  const resp=responses.find(r=>r.ship===ship);if(!resp)return;
  if(!confirm(`確定要刪除「${shipLabel(ship)}」這艘船在本活動的填答內容？此動作無法復原，該船之後重新打開連結會視為第一次填答。`))return;
  try{
    await api(`${RESPONSE_TABLE}?id=eq.${resp.id}`,{method:"DELETE",headers:authHeaders()});
    responses=responses.filter(r=>r.id!==resp.id);
    allResponses=allResponses.filter(r=>r.id!==resp.id);
    notify("✓ 已刪除該船填答","ok2");
    renderTable();
  }catch(e){notify("⚠ 刪除失敗："+e.message,"err");}
}

/* ── 匯出：船隊完成狀況＋需處理項目（有類似情形者：本船實際狀況、處理情況、結案／未結案） ── */
function collectReport(){
  const byShip=new Map(responses.map(r=>[r.ship,r]));
  const fmt=t=>t?new Date(t).toLocaleString("zh-TW",{hour12:false}):"";
  const status=[],issues=[];
  targetShips().forEach(s=>{
    const resp=byShip.get(s.code),st=rowStat(resp);
    const similar=resp?(resp.items||[]).filter(it=>it.status==="similar"):[];
    status.push({code:s.code,name:s.label||s.name||"",checker:resp?(resp.checker_name||""):"",title:resp?(resp.checker_title||""):"",
      progress:resp?`${st.done} / ${st.total}`:`0 / ${(curCampaign.items||[]).length}`,
      state:!resp?"尚未開始":(resp.submitted_at?"已送出":"填答中"),
      submitCount:resp?(resp.submit_count||0):0,submittedAt:resp?fmt(resp.submitted_at):"",
      needN:similar.length,openN:similar.filter(it=>!it.closed).length});
    similar.forEach(it=>issues.push({code:s.code,name:s.label||s.name||"",checker:resp.checker_name||"",title:resp.checker_title||"",
      itemCode:it.code||"",src:it.src||"",detail:it.detail||"",actual2:it.actual2||"",note:it.note||"",handle:it.actual||"",
      closed:it.closed?"已結案":"未結案",closeNote:it.closeNote||"",closedAt:it.closedAt||"",trackDue:it.trackDue||""}));
  });
  return {status,issues};
}
/* 目標船舶清單（可指定活動，用於跨活動彙整；不傳則用目前活動） */
function targetShipsFor(c,resp){
  const scope=(c.ship_scope&&c.ship_scope.length)?c.ship_scope:null;
  if(scope)return scope.map(code=>{const hit=shipOpts.find(s=>s.code===code);return {code,name:hit?hit.name:code};});
  return shipOpts.length?shipOpts:resp.map(r=>({code:r.ship,name:r.ship}));
}
function rowStatFor(resp,totalItems){
  if(!resp)return {done:0,total:totalItems,openTrack:0,closedTrack:0};
  const items=resp.items||[];
  const done=items.filter(it=>it.status&&it.status!=="pending").length;
  const openTrack=items.filter(it=>it.status==="similar"&&!it.closed).length;
  const closedTrack=items.filter(it=>it.status==="similar"&&it.closed).length;
  return {done,total:items.length,openTrack,closedTrack};
}
/* 單一活動的彙整（跨活動匯出用），邏輯跟 collectReport() 一致，但不依賴 curCampaign/responses 全域變數 */
function collectReportFor(c){
  const resp=allResponses.filter(r=>String(r.campaign_id)===String(c.id));
  const byShip=new Map(resp.map(r=>[r.ship,r]));
  const totalItems=(c.items||[]).length;
  const fmt=t=>t?new Date(t).toLocaleString("zh-TW",{hour12:false}):"";
  const status=[],issues=[];
  const label=c.title||("活動 #"+c.id);
  targetShipsFor(c,resp).forEach(s=>{
    const r=byShip.get(s.code),st=rowStatFor(r,totalItems);
    const similar=r?(r.items||[]).filter(it=>it.status==="similar"):[];
    status.push({campaign:label,code:s.code,name:s.label||s.name||"",checker:r?(r.checker_name||""):"",title:r?(r.checker_title||""):"",
      progress:r?`${st.done} / ${st.total}`:`0 / ${totalItems}`,
      state:!r?"尚未開始":(r.submitted_at?"已送出":"填答中"),
      submitCount:r?(r.submit_count||0):0,submittedAt:r?fmt(r.submitted_at):"",
      needN:similar.length,openN:similar.filter(it=>!it.closed).length});
    similar.forEach(it=>issues.push({campaign:label,code:s.code,name:s.label||s.name||"",checker:r.checker_name||"",title:r.checker_title||"",
      itemCode:it.code||"",src:it.src||"",detail:it.detail||"",actual2:it.actual2||"",note:it.note||"",handle:it.actual||"",
      closed:it.closed?"已結案":"未結案",closeNote:it.closeNote||"",closedAt:it.closedAt||"",trackDue:it.trackDue||""}));
  });
  return {status,issues};
}
/* 匯出全部活動明細：一次把所有活動、所有船舶的檢查結果與需處理明細彙整成一份 Excel，
   供督導不用一個個活動點進去看，直接在這份總表上長期追蹤。 */
function exportAllCampaigns(){
  if(typeof XLSX==="undefined"){notify("⚠ Excel 元件載入失敗，請確認網路後重新整理頁面","err");return;}

    allStatus.push(...status);

  const wb=XLSX.utils.book_new();

  ws2["!cols"]=[22,8,14,12,12,10,20,40,36,36,36,9,36,12,12].map(w=>({wch:w}));

  notify(`✓ 已下載 Excel（共 ${campaigns.length} 個活動、${allIssues.length} 項需處理）`,"ok2");
}

          ${it.actual?`<div><b>打算怎麼處理：</b>${esc(it.actual)}</div>`:""}
          ${it.closeNote?`<div style="margin-top:2px"><b>改善情形說明：</b>${esc(it.closeNote)}</div>`:""}
          ${it.closed&&it.closedAt?`<div class="hint">結案日期：${esc(it.closedAt)}</div>`:""}
          ${it.status==="similar"?`<div style="margin-top:6px;display:flex;align-items:center;gap:6px">
            <label class="hint" style="margin:0">🗓 追蹤期限：</label>
            <input type="date" value="${esc(it.trackDue||"")}" onchange="setTrackDue('${esc(ship)}',${i},this.value)" style="width:150px;padding:4px 6px;font-size:12px;border:1px solid var(--line-2);border-radius:6px">
          </div>`:""}
          ${it.checkedBy?`<div class="hint">最後回答：${esc(it.checkedBy)}　${esc(it.checkedAt||"")}</div>`:""}
        </div>
      `).join("")}
    </div>
  `;
  row.classList.add("show");
}
/* 追蹤期限：督導／海技在這裡直接設定或修改，寫回這艘船的填答（items 是整包 jsonb，改單一題就整包存回）。
   船上那邊看得到但不能改，只是提醒用，真正的期限由這裡掌握。 */
async function setTrackDue(ship,i,val){
  const resp=responses.find(r=>r.ship===ship);if(!resp)return;
  const items=resp.items||[];if(!items[i])return;
  items[i].trackDue=val;
  try{
    await api(`${RESPONSE_TABLE}?id=eq.${resp.id}`,{method:"PATCH",headers:authHeaders({"Prefer":"return=minimal"}),body:JSON.stringify({items,updated_at:Date.now()})});
    notify(val?"✓ 已設定追蹤期限":"✓ 已清除追蹤期限","ok2");
    const ar=allResponses.find(r=>r.id===resp.id);if(ar)ar.items=items;
  }catch(e){notify("⚠ 更新失敗："+e.message,"err");}
}
/* 提醒追蹤：把這艘船目前「有，需處理」且未結案的項目整理成一段訊息（含填答連結），
   內容可在跳出的視窗裡自行編輯，編輯後按「複製內容」貼到 Email／通訊軟體發給船上。 */
function buildReminderText(ship){
  const resp=responses.find(r=>r.ship===ship);
  const open=((resp&&resp.items)||[]).map((it,i)=>({it,i})).filter(x=>x.it.status==="similar"&&!x.it.closed);
  const url=`${location.href.replace(/[^/]*$/,"")}submit-selfcheck-share.html?cid=${curCampaign.id}&ship=${encodeURIComponent(ship)}`;
  const lines=open.map(({it,i})=>`#${i+1}　${it.code?"CODE "+it.code+"　":""}${it.detail||""}${it.trackDue?`（追蹤期限：${it.trackDue}）`:""}`);
  return `【自查案件追蹤】${curCampaign.title||""}\n\n${shipLabel(ship)} 您好，請查此自查項目類似情形是否已改善：\n\n${lines.join("\n\n")}\n\n若已改善，請點選下方連結進入，勾選「已完成改善（結案）」並說明改善情形、填上結案日期後送出；尚未改善的也請先填寫目前處理進度。\n\n連結：${url}`;
}
function openTrackReminder(ship){
  document.getElementById("trackModalShip").textContent=shipLabel(ship);
  document.getElementById("trackModalText").value=buildReminderText(ship);
  document.getElementById("trackModal").classList.add("show");
}
function closeTrackReminder(){document.getElementById("trackModal").classList.remove("show");}
function copyTrackReminder(){
  safeCopyText(document.getElementById("trackModalText").value,"✓ 已複製，請貼到 Email／通訊軟體發送");
}

loadCampaignList();
/* 打開頁面時已自動整理一次；之後只在「離開又回到這個分頁」且距上次整理超過 60 秒時才自動再整理，
   停在原頁面沒動作的情況才需要自己按「🔄 重新整理」。整理時停留在原本畫面，不會被跳回活動列表。 */
let lastAutoAt=Date.now();
document.addEventListener("visibilitychange",async()=>{
  if(document.hidden||Date.now()-lastAutoAt<60000)return;
  lastAutoAt=Date.now();
  try{
    campaigns=await api(`${CAMPAIGN_TABLE}?order=created_at.desc&limit=200`);
    allResponses=await api(`${RESPONSE_TABLE}?select=id,campaign_id,ship,items,submitted_at&limit=5000`);
    if(document.getElementById("detailView").style.display!=="none"&&curCampaign)await loadCampaign(curCampaign.id);
    else renderListView();
  }catch(e){}
});
</script>
