<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分享自查彙整清單 — FPMC</title>
<style>
:root{
  --navy:#1c3a5e; --navy-2:#234a72; --navy-3:#2f6690;
  --paper:#f5f7f8; --card:#ffffff; --line:#dde4e8; --line-2:#c3ced5;
  --ink:#15262f; --ink-2:#52656f; --ink-3:#8195a0;
  --signal:#e8842c; --teal:#1e7f8c;
  --ok:#2e8b57; --bad:#c0392b; --warn:#c99a1f;
  --sans:"Segoe UI","Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);font-family:var(--sans);color:var(--ink)}
.wrap{max-width:1100px;margin:0 auto;padding:0 0 60px}
header{background:var(--navy);color:#fff;padding:20px 18px}
header h1{margin:0;font-size:18px}
header p{margin:6px 0 0;font-size:12.5px;color:#b9c8d6;line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:14px;padding:16px}
.hint{color:var(--ink-3);font-size:12px;line-height:1.7}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:#fff;color:var(--ink);padding:9px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:var(--sans);font-weight:600;text-decoration:none}
.btn.primary{background:var(--signal);border-color:var(--signal);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
input[type=text],input[type=password],select{padding:9px 10px;border:1px solid var(--line-2);border-radius:8px;font-size:14px;font-family:var(--sans);width:100%}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;z-index:99;max-width:90vw;text-align:center}
#toast.err{background:var(--bad)}
#toast.ok2{background:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:#f0f3f5;font-size:11.5px;color:var(--ink-2);position:sticky;top:0}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{background:#e4e9ec}
th.sortable.sorted{color:var(--navy);background:#e4e9ec}
tr.track td{background:#fff4e8}
tr.done td{background:#eaf5ee}
.pill{display:inline-block;border-radius:20px;padding:1px 9px;font-size:11px;font-weight:700}
.pill.ok{background:#eaf5ee;color:var(--ok)}
.pill.warn{background:#fff4e8;color:#a05a10}
.pill.bad{background:#fbe9e5;color:var(--bad)}
.pill.na{background:#eef0f4;color:var(--ink-2)}
.detailrow{display:none}
.detailrow.show{display:table-row}
.itemline{border-bottom:1px dashed var(--line);padding:6px 0}
.itemline:last-child{border-bottom:none}
.stbadge{font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 7px;margin-left:6px}
.stbadge.ok{background:#eaf5ee;color:var(--ok)}
.stbadge.similar{background:#fff4e8;color:#a05a10}
.stbadge.self{background:#e9edf7;color:var(--navy-3)}
.stbadge.na{background:#eef0f4;color:var(--ink-2)}
.stbadge.pending{background:#f0f3f5;color:var(--ink-3)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#f7f9fb;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi .v{font-size:20px;font-weight:700;color:var(--navy)}
.kpi .l{font-size:11px;color:var(--ink-3)}
.modal-bg{position:fixed;inset:0;background:rgba(15,30,45,.45);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal-bg.show{display:flex}
.modal-box{background:#fff;border-radius:10px;max-width:560px;width:100%;padding:18px;max-height:86vh;display:flex;flex-direction:column}
.modal-box textarea{flex:1;min-height:260px;font-family:var(--sans);font-size:13px;padding:10px;border:1px solid var(--line-2);border-radius:8px;resize:vertical;line-height:1.6}
.dfilters{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.dfg{display:flex;align-items:center;gap:6px}
.dfl{font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.5px}
.dfg select{width:auto;padding:6px 8px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1.5px solid var(--line-2);background:#fff;border-radius:16px;padding:3px 11px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--sans);color:var(--ink-2)}
.chip small{font-weight:400;margin-left:3px;opacity:.75}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.pendhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;margin-bottom:8px}
.pship{display:grid;grid-template-columns:200px 1fr auto;gap:12px;align-items:start;padding:9px 6px;border-bottom:1px solid var(--line)}
.pship:last-child{border-bottom:none}
.pship .nm b{font-size:13.5px}
.pship .cnt{display:inline-block;margin-top:3px;background:#fbe9e5;color:var(--bad);border-radius:12px;padding:0 9px;font-size:12px;font-weight:700}
.pcamp{display:inline-flex;align-items:center;gap:6px;background:#f5f7f8;border:1px solid var(--line);border-radius:6px;padding:3px 8px;margin:0 6px 5px 0;font-size:12px}
.pcamp .st{font-weight:700;font-size:11px;border-radius:10px;padding:0 6px}
.pcamp .st.no{background:#fbe9e5;color:var(--bad)}
.pcamp .st.ing{background:#fff4e8;color:#a05a10}
.pcamp .st.trk{background:#eaf1f9;color:#1d4e80}
@media(max-width:700px){.pship{grid-template-columns:1fr}}
#printArea{display:none}
@media print{
  #mainWrap,#toast{display:none!important}
  #printArea{display:block!important;font-size:11px;color:#000}
  #printArea h1{font-size:18px;margin:0 0 4px}
  #printArea h2{font-size:14px;margin:16px 0 6px}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea th,#printArea td{border:1px solid #888;padding:4px 6px;font-size:10.5px;position:static;background:none}
  #printArea th{background:#e8edf1;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea tr{page-break-inside:avoid}
}
.subtabs{display:flex;gap:6px;margin:4px 0 10px;border-bottom:2px solid var(--line,#dfe6eb);padding:0 4px}
.subtabs button{border:0;background:none;padding:10px 16px;font-size:14.5px;font-weight:700;color:var(--ink-3,#7b8a94);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;font-family:inherit}
.subtabs button.on{color:var(--navy,#1c3a5e);border-bottom-color:var(--signal,#e8862a)}
.subtabs button .hint{font-weight:400}
/* 自訂自查（SC） */
#caseCard label.f{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}
#caseCard textarea{width:100%;font-family:var(--sans);font-size:13px;padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;resize:vertical;line-height:1.6}
.scq{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:#fbfcfd}
.scq .sl{display:block;font-size:11.5px;color:var(--ink-3);margin:6px 0 2px}
.scships{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:3px 12px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:6px}
.scships label{display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer}
.scfile{display:inline-flex;gap:4px;align-items:center;background:#eef3f8;border-radius:12px;padding:2px 9px;font-size:12px;margin:0 6px 6px 0}
.scrow{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line)}
.scrow:last-child{border-bottom:0}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div class="wrap" id="mainWrap">
  <header style="display:flex;flex-direction:row-reverse;flex-wrap:wrap;align-items:flex-start;gap:10px 16px">
    <span style="display:flex;flex-direction:column;gap:6px;align-items:stretch;flex:none">
      <a class="btn sm" href="./" style="background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff">← 回船舶檢查暨缺失管理系統</a>
      <a class="btn sm" href="intaudit.html" style="background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff" title="督導／稽核員：回到內部檢查缺失登錄">← 回內部檢查缺失登錄</a>
      <button type="button" class="btn sm" id="slogBtn" onclick="SLog.open()" style="display:none;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#ffd9a8" title="只有 Owner 看得到">📜 操作紀錄</button>
      <a class="btn sm" href="selfcheck-share-guide.html" target="_blank" rel="noopener" style="background:#fff;border-color:#fff;color:var(--navy)" title="怎麼進來、怎麼新建自訂自查、怎麼看各船自查情形">📖 操作手冊</a>
    </span>
    <div style="flex:1;min-width:240px">
      <h1>📊 分享自查彙整清單</h1>
      <p>查看船隊「分享缺失做自查」各活動的填答進度與內容；點船名列可展開查看每一項的作答細節。</p>
    </div>
  </header>

  <!-- 活動列表：多個活動會持續累積，這裡是進入後的預設畫面，列出全部活動＋各自統計，
       點「查看進度」才切進單一活動的詳細畫面（下面的 detailView）。 -->
  <div id="listView">
    <!-- 總覽 Dashboard：篩選活動（檢查來源／建立者／狀態／建立天數），下方統計與「未送出船舶」都依篩選結果計算 -->
    <div class="card" id="dashCard">
      <div class="dfilters">
        <div class="dfg"><span class="dfl">檢查來源</span><div id="fSrcChips" class="chips"></div></div>
        <div class="dfg"><span class="dfl">建立者</span><select id="fBy" onchange="renderDash()"></select></div>
        <div class="dfg"><span class="dfl">狀態</span><select id="fState" onchange="renderDash()"><option value="active">進行中</option><option value="ended">已結束</option><option value="">全部</option></select></div>
        <div class="dfg"><span class="dfl">建立超過</span><select id="fAge" onchange="renderDash()"><option value="0">不限</option><option value="7">7 天</option><option value="14">14 天</option><option value="30">30 天</option><option value="60">60 天</option></select></div>
        <div class="dfg"><span class="dfl">關鍵字</span><input type="text" id="fKw" placeholder="活動名稱…" oninput="renderDash()" style="width:150px;padding:6px 8px;font-size:13px"></div>
        <button class="btn sm" onclick="clearDashFilters()">✕ 清除篩選</button>
      </div>
      <div class="kpis" id="dashKpis" style="margin-top:12px"></div>
    </div>
    <!-- 子標籤：需提醒的船舶／活動清單（兩者共用上方篩選） -->
    <div class="subtabs" id="subTabs">
      <button type="button" data-t="list" class="on" onclick="setSubTab('list')">📋 活動清單 <span class="hint" id="campaignCountTab"></span></button>
      <button type="button" data-t="pend" onclick="setSubTab('pend')">🔔 未完成／需追蹤的船舶</button>
      <button type="button" data-t="case" onclick="setSubTab('case')">📝 新建自訂自查 <span class="hint" id="scDraftCountTab"></span></button>
    </div>
    <!-- 2026-11-04 自訂自查：自己出題發給船隊（原本在主系統，改到這裡做）。草稿存雲端 app_db（sharecase_draft_<id>），
         跟主系統同一份；發佈＝新增一筆分享自查活動。 -->
    <div class="card" id="caseCard" style="display:none">
      <div class="subtabs" style="margin-top:-4px">
        <button type="button" data-ct="new" class="on" onclick="SC.ctab('new')">✏ 新建</button>
        <button type="button" data-ct="drafts" onclick="SC.ctab('drafts')">💾 草稿 <span class="hint" id="scDraftCount"></span></button>
      </div>
      <div id="scPageNew">
        <div class="toolbar" style="margin-bottom:6px"><b id="scFormHead" style="color:var(--navy)">📝 新增自訂自查</b><span style="flex:1"></span><button class="btn sm" onclick="if(confirm('清空表單、開始一則新的？（已存的草稿不受影響）'))SC.mount(null)">＋ 開新的一則</button></div>
        <p class="hint" style="margin:0 0 10px">依某個案例自己出題（例：其他公司事故、訪船發現的共通問題），一條連結發給船隊自查；可附照片、程序書。還沒寫完可先「儲存草稿」。</p>
        <div id="scForm"></div>
      </div>
      <div id="scPageDrafts" style="display:none"><div id="scDrafts" class="hint">讀取中…</div></div>
    </div>
    <div class="card" id="pendCard">
      <div class="pendhead">
        <b style="color:var(--navy);font-size:14px">🔔 未完成／需追蹤的船舶</b>
        <select id="fPendMode" onchange="renderDash()" style="width:auto;padding:5px 8px;font-size:13px">
          <option value="both">未送出＋有需追蹤（全部）</option>
          <option value="unsub">只看未送出（未開始＋填答中）</option>
          <option value="track">只看已送出但有未結案項目</option>
        </select>
        <span class="hint" id="pendCount"></span>
        <span style="flex:1"></span>
        <button class="btn sm" onclick="exportPending()">⬇ 匯出提醒清單 Excel</button>
      </div>
      <div id="pendList"></div>
    </div>
    <div class="card" id="listCard" style="display:none">
      <div class="toolbar">
        <span style="font-weight:700;color:var(--ink-3);font-size:12px">共 <span id="campaignCount">0</span> 個活動</span>
        <button class="btn sm" onclick="loadCampaignList()">🔄 重新整理</button>
        <button class="btn sm" onclick="exportAllCampaigns()" title="彙整所有活動、所有船舶的檢查結果與明細成一份 Excel，供督導長期追蹤">⬇ 匯出全部活動明細</button>
        <span style="flex:1"></span>
        <button class="btn sm" onclick="setSubTab('case');SC.ctab('new')" style="background:#e8842c;border-color:#e8842c;color:#fff;font-weight:700">📝 新建自訂自查清單</button>
      </div>
      <div style="overflow-x:auto" id="campaignList"></div>
    </div>
  </div>

  <!-- 單一活動詳情：各船進度、篩選、明細展開、刪除。 -->
  <div id="detailView" style="display:none">
    <div class="card">
      <div class="toolbar">
        <button class="btn sm" onclick="showListView()">← 返回活動列表</button>
        <span style="font-weight:700;font-size:14px" id="detailTitle"></span>
        <span style="flex:1"></span>
        <button class="btn sm" onclick="exportExcel()" title="船隊完成狀況＋需處理項目（實際情況／處理情況／結案狀態）">⬇ 下載 Excel</button>
        <button class="btn sm" onclick="exportPdf()" title="開啟列印，選「另存為 PDF」">⬇ 下載 PDF</button>
        <button class="btn sm" onclick="copyMailText()" title="複製「自查項目＋連結」（上下兩行），貼入郵件發給船隊">✉ MAIL船</button>
        <button class="btn sm" onclick="previewFill()" title="開新分頁，看船上填答畫面長怎樣（不會存檔、不會送出）">👁 預覽船上畫面</button>
        <button class="btn sm" onclick="copyFillLink()">📋 複製連結</button>
        <button class="btn sm" onclick="loadCampaign(curCampaign&&curCampaign.id)">🔄 重新整理</button>
      </div>
      <div id="campaignDesc" class="hint"></div>
    </div>

    <div class="card" id="statsCard" style="display:none">
      <div class="kpis" id="kpis"></div>
      <div class="toolbar">
        <span class="hint" style="font-weight:700;color:var(--ink-3)">篩選</span>
        <select id="filterSel" onchange="renderTable()">
          <option value="all">全部船舶</option>
          <option value="track">⚠ 有需追蹤項目（未結案）</option>
          <option value="unsubmitted">未送出</option>
          <option value="submitted">已送出</option>
        </select>
        <input type="text" id="shipSearch" placeholder="輸入船名快速查找…" style="max-width:200px" oninput="renderTable()">
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th style="width:90px">船舶</th><th style="width:100px">填寫人</th><th style="width:110px">進度</th><th style="width:130px">需追蹤</th><th style="width:70px">送出次數</th><th>最後送出</th><th style="width:160px">操作</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 提醒追蹤：內容可自行編輯，編輯完按「複製內容」貼到 Email／通訊軟體發給船上 -->
<div class="modal-bg" id="trackModal">
  <div class="modal-box">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <b style="font-size:15px;color:var(--navy)">🔔 提醒追蹤（<span id="trackModalShip"></span>）</b>
      <span style="flex:1"></span>
      <button class="btn sm" onclick="closeTrackReminder()">✕</button>
    </div>
    <p class="hint" style="margin:0 0 8px">內容可自行編輯，編輯後按「複製內容」貼到 Email／通訊軟體發給船上。</p>
    <textarea id="trackModalText"></textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">
      <button class="btn" onclick="closeTrackReminder()">取消</button>
      <button class="btn primary" onclick="copyTrackReminder()">📋 複製內容</button>
    </div>
  </div>
</div>

<div id="printArea"></div>
<div id="toast"></div>

<script>
/* 船上填答頁面放在獨立的船上網站（不跟主系統同一個網址） */
const SHIP_SITE="https://sski2468-hua.github.io/vessel-portal/";

const CLOUD = {
  url: "https://iqmbircjokdzdssouwkr.supabase.co",
  key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlxbWJpcmNqb2tkemRzc291d2tyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNDAwODIsImV4cCI6MjA5NjgxNjA4Mn0.OZ2ez6ondz49kT90gwneYUXG7CbE8iiB6PnXE5fR6iY"
};
const CAMPAIGN_TABLE = "selfcheck_share_campaigns";
const RESPONSE_TABLE = "selfcheck_share_responses";

const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function safeCopyText(text,okMsg){
  okMsg=okMsg||"✓ 已複製";
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>notify(okMsg,"ok2")).catch(()=>fallbackCopyText(text,okMsg));
  }else fallbackCopyText(text,okMsg);
}
function fallbackCopyText(text,okMsg){
  try{
    const ta=document.createElement("textarea");
    ta.value=text;ta.style.position="fixed";ta.style.left="-9999px";ta.style.top="0";
    document.body.appendChild(ta);ta.focus();ta.select();
    const ok=document.execCommand("copy");
    document.body.removeChild(ta);
    notify(ok?okMsg:"⚠ 自動複製失敗，請手動選取文字複製","ok2");
  }catch(e){notify("⚠ 自動複製失敗，請手動選取文字複製","err");}
}
/* 建立活動當下如果沒按到「複製連結」就關掉視窗，連結本身沒有另外存檔，
   之前只能回去問海技人員或重新建一個活動——這裡讓填答連結可以隨時從這個
   彙整清單頁面依「目前選的活動」重新算出來、重新複製，活動 id 就是連結參數本身，
   只要活動還在（沒被刪除），永遠可以在這裡找回同一條連結。 */

/* 受檢船・檢查來源・日期（來源字串格式「船名 檢查來源 日期」），跟船上填單頁的顯示一致 */
function fmtSrc(s){
  s=String(s||"").trim();const p=s.split(/\s+/);
  if(p.length<3)return s;
  if(shipOpts.some(o=>o.code===p[0]))return `${shipLabel(p[0])}・${p.slice(1,-1).join(" ")}・${p[p.length-1]}`;
  const m=matchShipByName(s);
  if(m){const rest=s.replace(m.n,"").trim().split(/\s+/);return `${shipLabel(m.code)}・${rest.slice(0,-1).join(" ")}・${rest[rest.length-1]}`;}
  return `${shipLabel(p[0])}・${p.slice(1,-1).join(" ")}・${p[p.length-1]}`;
}
const srcTag=it=>it.src?`<span style="margin-left:8px;font-size:12px;font-weight:700;color:#1e7f8c;background:#e4f1f2;border-radius:10px;padding:1px 10px;white-space:nowrap">${esc(fmtSrc(it.src))}</span>`:"";
let toastTimer;
function notify(msg,tone){
  const el=document.getElementById("toast");
  el.textContent=msg; el.className=tone==="err"?"err":(tone==="ok2"?"ok2":"");
  el.style.display="block"; clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.style.display="none",4200);
}
// ⚠ opts.headers（若有帶）會整個取代預設 headers，不是逐欄位合併——呼叫端只要自己帶了
// headers，就一定要自己把 apikey／Authorization 也一起帶齊，否則會漏掉驗證資訊被拒絕。
// authHeaders() 統一提供這組基本 header，呼叫端只需要在後面疊加自己這次需要的 Prefer 等欄位。
function authHeaders(extra){ return Object.assign({"apikey":CLOUD.key,"Authorization":"Bearer "+CLOUD.key,"Content-Type":"application/json"},extra||{}); }
async function api(path,opts){
  const res=await fetch(`${CLOUD.url}/rest/v1/${path}`,Object.assign({headers:authHeaders()},opts||{}));
  if(!res.ok){ const t=await res.text().catch(()=>""); throw new Error("HTTP "+res.status+" "+t.slice(0,150)); }
  const ct=res.headers.get("content-type")||"";
  return ct.includes("json")?res.json():null;
}
/* ══════════ 活動清單／篩選狀態 ══════════
   allResponses：全部活動、全部船舶的填答一次抓回來，列表頁靠這份現算每個活動的統計，
   不用「列出N個活動就查N次」，活動數量變多也不會變慢。 */
const EXCLUDED_SHIPS=["F25","F26","PH","PI"]; // 不參與分享自查的船舶（預設排除）
let campaigns=[], curCampaign=null, responses=[], shipOpts=[], allResponses=[];
async function loadShipOpts(){
  try{
    const rows=await api("app_db?select=payload&k=eq.ships");
    const list=rows&&rows[0]&&Array.isArray(rows[0].payload)?rows[0].payload:[];
    shipOpts=list.filter(s=>!EXCLUDED_SHIPS.includes(s.code)).map(s=>({code:s.code,zh:s.zh||"",en:s.name||"",name:s.zh||s.name||s.code,label:[s.zh,s.name].filter(Boolean).join(" ")||s.code}));
  }catch(e){}
}
async function loadCampaignList(){
  await loadShipOpts();
  try{
    campaigns=await api(`${CAMPAIGN_TABLE}?order=created_at.desc&limit=200`);
    allResponses=await api(`${RESPONSE_TABLE}?select=id,campaign_id,ship,items,submitted_at&limit=5000`);
  }catch(e){
    notify("⚠ 活動清單讀取失敗："+e.message,"err");
    return;
  }
  // 瀏覽器重新整理（F5）後停在原本的畫面：網址帶 #c=活動編號 就直接回到那個活動的明細，不跳回活動列表
  const m=/[#&]c=(\d+)/.exec(location.hash||"");
  if(m&&campaigns.find(c=>String(c.id)===m[1])){
    document.getElementById("listView").style.display="none";
    document.getElementById("detailView").style.display="";
    loadCampaign(m[1]);
    return;
  }
  showListView();
}
function setHash(h){try{history.replaceState(null,"",location.pathname+location.search+(h||""));}catch(e){}}
/* 當事船（缺失來源船）不須自查：活動的題目全部來自同一艘船時，那艘船不計入「應填船」。 */
/* 缺失來源船判斷：新活動的 src 是「船代碼 檢查來源 日期」，但舊活動寫的是「中文船名 英文船名 檢查來源 日期」，
   所以先看第一段是不是船代碼，不是就用船名（中文／英文／全名）比對船清單，兩種寫法都能認出是哪艘船。 */
function matchShipByName(s){
  let best=null,bl=0;
  srcShipList().forEach(o=>{[o.label,o.zh,o.en].filter(Boolean).forEach(n=>{
    if((s===n||s.startsWith(n+" ")||s.includes(" "+n+" ")||s.endsWith(" "+n))&&n.length>bl){best={code:o.code,n};bl=n.length;}
  });});
  return best;
}
function resolveSrcShip(it){
  const s=String(it&&it.src||"").trim();if(!s)return "";
  const first=s.split(/\s+/)[0];
  if(srcShipList().some(o=>o.code===first))return first;
  const m=matchShipByName(s);
  return m?m.code:first;
}const srcShipOf=it=>resolveSrcShip(it);
const srcShipList=()=>shipOpts;
const selfOnlyShip=(c,code)=>{const its=(c&&c.items)||[];return its.length>0&&its.every(it=>srcShipOf(it)===code);};
function campaignStats(c){
  const resp=allResponses.filter(r=>String(r.campaign_id)===String(c.id));
  const total=targetShipsFor(c,resp).length;
  const submitted=resp.filter(r=>r.submitted_at).length;
  let track=0;
  resp.forEach(r=>{ track+=(r.items||[]).filter(it=>it.status==="similar"&&!it.closed).length; });
  return {started:resp.length,total,submitted,track};
}
function showListView(){
  setHash("");
  document.getElementById("listView").style.display="";
  document.getElementById("detailView").style.display="none";
  renderListView();
}
/* 活動列表排序：點表頭切排序欄位，同一欄再點一次反轉方向。排序只影響顯示順序，
   不影響資料本身；每次重新整理（loadCampaignList）沿用上次選的排序條件。 */
let listSort={key:"created_at",dir:-1};
const LIST_SORT_COLS={
  title:{label:"活動",get:(c,st)=>c.title||("活動 #"+c.id)},
  created_at:{label:"建立",get:(c,st)=>c.created_at||0},
  active:{label:"狀態",get:(c,st)=>c.active===false?0:1},
  started:{label:"已開始/應填",get:(c,st)=>st.total?st.started/st.total:st.started},
  submitted:{label:"已送出",get:(c,st)=>st.submitted},
  track:{label:"需追蹤",get:(c,st)=>st.track}
};
function sortListBy(key){
  if(listSort.key===key)listSort.dir=-listSort.dir;
  else listSort={key,dir:key==="title"?1:-1}; // 文字欄位預設 A→Z，數字／日期欄位預設由大到小
  renderListView();
}
/* ══════════ 總覽 Dashboard ══════════
   活動來源＝活動名稱「缺失自查：PSC-BJ(…)，SIRE-CI(…)」裡每段「-」前面的檢查來源；
   舊活動名稱沒有這個格式時，改從題目的來源欄（「船 檢查來源 日期」）抓。 */
let fSrc=new Set();
function campaignSources(c){
  if((c.items||[]).some(it=>it&&it.src==="自訂案例"))return ["自訂"]; // 2026-11-04 自訂自查（自己出題）歸類為「自訂」
  if(/^重點自查/.test(String(c.title||""))||(c.items||[]).some(it=>it.topic))return ["船隊分析"]; // 船隊缺失分析發佈的主題題活動
  const out=new Set();
  const t=String(c.title||"");const body=t.includes("：")?t.slice(t.indexOf("：")+1):"";
  body.split(/[，,]/).forEach(seg=>{const m=seg.trim().match(/^([^-()（）]+?)-/);if(m)out.add(m[1].trim());});
  if(!out.size)(c.items||[]).forEach(it=>{const p=String(it.src||"").trim().split(/\s+/);if(p.length>=3)out.add(p.slice(1,-1).join(" "));});
  if(!out.size)out.add("其他");
  return [...out];
}
function creatorOf(c){return String(c.created_by||"").replace(/[（(].*[)）]\s*$/,"").trim()||"（未記錄）";}
function daysSince(t){return t?Math.floor((Date.now()-t)/86400000):0;}
function dashFiltered(){
  const by=document.getElementById("fBy").value,state=document.getElementById("fState").value;
  const age=+document.getElementById("fAge").value||0,kw=(document.getElementById("fKw").value||"").trim().toLowerCase();
  return campaigns.filter(c=>{
    if(fSrc.size&&!campaignSources(c).some(s=>fSrc.has(s)))return false;
    if(by&&creatorOf(c)!==by)return false;
    if(state==="active"&&c.active===false)return false;
    if(state==="ended"&&c.active!==false)return false;
    if(age&&daysSince(c.created_at)<age)return false;
    if(kw&&!String(c.title||"").toLowerCase().includes(kw))return false;
    return true;
  });
}
function toggleSrc(s){fSrc.has(s)?fSrc.delete(s):fSrc.add(s);renderDash();}
function clearDashFilters(){fSrc.clear();document.getElementById("fBy").value="";document.getElementById("fState").value="active";document.getElementById("fAge").value="0";document.getElementById("fKw").value="";renderDash();}
function fillDashFilters(){
  const srcCnt={};campaigns.forEach(c=>campaignSources(c).forEach(s=>srcCnt[s]=(srcCnt[s]||0)+1));
  document.getElementById("fSrcChips").innerHTML=Object.keys(srcCnt).sort().map(s=>`<button class="chip${fSrc.has(s)?" on":""}" onclick="toggleSrc('${esc(s).replace(/'/g,"\\'")}')">${esc(s)}<small>${srcCnt[s]}</small></button>`).join("")||'<span class="hint">—</span>';
  const sel=document.getElementById("fBy"),cur=sel.value;
  const bys=[...new Set(campaigns.map(creatorOf))].sort();
  sel.innerHTML=`<option value="">全部</option>`+bys.map(b=>`<option ${b===cur?"selected":""}>${esc(b)}</option>`).join("");
}
/* 每艘船在篩選後的活動裡，哪些還沒送出（未開始／填答中）、哪些已送出但仍有未結案 */
function pendingByShip(list,mode){
  const map=new Map();
  list.forEach(c=>{
    const resp=allResponses.filter(r=>String(r.campaign_id)===String(c.id)),byShip=new Map(resp.map(r=>[r.ship,r]));
    targetShipsFor(c,resp).forEach(s=>{
      const r=byShip.get(s.code);let kind=null,info="";
      if(!r||!r.submitted_at){
        if(mode==="track")return;
        const items=r?(r.items||[]):[];const done=items.filter(it=>it.status&&it.status!=="pending").length;
        kind=r?"ing":"no";info=r?`填答中 ${done}/${items.length||(c.items||[]).length}`:"未開始";
      }else{
        if(mode==="unsub")return;
        const open=(r.items||[]).filter(it=>it.status==="similar"&&!it.closed).length;if(!open)return;
        kind="trk";info=`未結案 ${open} 項`;
      }
      if(!map.has(s.code))map.set(s.code,[]);
      map.get(s.code).push({c,kind,info,r});
    });
  });
  return [...map.entries()].map(([code,arr])=>({code,arr})).sort((a,b)=>b.arr.length-a.arr.length||a.code.localeCompare(b.code));
}
function renderDash(){
  if(!document.getElementById("dashCard"))return;
  fillDashFilters();
  const list=dashFiltered();
  let tot=0,sub=0,track=0;
  list.forEach(c=>{const st=campaignStats(c);tot+=st.total;sub+=st.submitted;track+=st.track;});
  const unsubShips=pendingByShip(list,"unsub");
  const unsubN=unsubShips.reduce((n,x)=>n+x.arr.length,0);
  const k=(v,l,style)=>`<div class="kpi"><div class="v" style="${style||""}">${v}</div><div class="l">${l}</div></div>`;
  document.getElementById("dashKpis").innerHTML=
    k(list.length,`篩選後活動數（全部 ${campaigns.length}）`)+
    k(tot?Math.round(sub/tot*100)+"%":"—",`送出率（${sub} / ${tot} 船次）`,"color:var(--ok)")+
    k(unsubN,"未送出船次",unsubN?"color:var(--bad)":"")+
    k(unsubShips.length,"有未送出活動的船舶",unsubShips.length?"color:var(--bad)":"")+
    k(track,"未結案需追蹤項目",track?"color:#a05a10":"");
  const mode=document.getElementById("fPendMode").value;
  const rows=pendingByShip(list,mode);
  window._pendRows=rows;
  document.getElementById("pendCount").textContent=rows.length?`共 ${rows.length} 艘船、${rows.reduce((n,x)=>n+x.arr.length,0)} 個活動`:"";
  document.getElementById("pendList").innerHTML=rows.length?rows.map(x=>`<div class="pship">
      <div class="nm"><b>${esc(shipLabel(x.code))}</b><br><span class="cnt">${x.arr.length} 個活動</span></div>
      <div>${x.arr.map(p=>`<span class="pcamp" title="建立於 ${p.c.created_at?new Date(p.c.created_at).toLocaleDateString("zh-TW"):""}"><span class="st ${p.kind}">${esc(p.info)}</span>${esc(p.c.title||("活動 #"+p.c.id))}<span class="hint">（${daysSince(p.c.created_at)} 天）</span></span>`).join("")}</div>
      <div><button class="btn sm" onclick="openShipReminder('${esc(x.code)}')">🔔 提醒文字</button></div>
    </div>`).join(""):`<p class="hint" style="text-align:center;padding:12px">🎉 篩選條件下沒有需要提醒的船舶</p>`;
  renderListView(true);
}
/* 一艘船跨多個活動的提醒文字：每個活動一段（名稱＋專屬連結），已送出但未結案的再列出未結案項目 */
function buildShipReminder(code){
  const x=(window._pendRows||[]).find(r=>r.code===code);if(!x)return "";
  const base=SHIP_SITE;
  const un=x.arr.filter(p=>p.kind!=="trk"),tk=x.arr.filter(p=>p.kind==="trk");
  let s=`【分享自查提醒】\n\n${shipLabel(code)} 您好：\n`;
  if(un.length){
    s+=`\n以下 ${un.length} 項分享自查尚未送出，請撥空完成並送出：\n`;
    un.forEach((p,i)=>{s+=`\n${i+1}. ${p.c.title||("活動 #"+p.c.id)}（${p.info}）\n   連結：${base}submit-selfcheck-share.html?cid=${p.c.id}&ship=${encodeURIComponent(code)}\n`;});
  }
  if(tk.length){
    s+=`\n以下活動已送出，但仍有「有，需處理」項目尚未結案，若已改善請回到連結勾選「已完成改善（結案）」再送出：\n`;
    tk.forEach((p,i)=>{
      const open=((p.r&&p.r.items)||[]).map((it,j)=>({it,j})).filter(o=>o.it.status==="similar"&&!o.it.closed);
      s+=`\n${i+1}. ${p.c.title||("活動 #"+p.c.id)}\n${open.map(o=>`   #${o.j+1} ${o.it.code?"CODE "+o.it.code+"　":""}${String(o.it.detail||"").slice(0,80)}${(o.it.track||[]).length?"（已在追蹤："+o.it.track.join("、")+"）":""}`).join("\n")}\n   連結：${base}submit-selfcheck-share.html?cid=${p.c.id}&ship=${encodeURIComponent(code)}\n`;
    });
  }
  return s+`\n謝謝配合！`;
}
function openShipReminder(code){
  document.getElementById("trackModalShip").textContent=shipLabel(code);
  document.getElementById("trackModalText").value=buildShipReminder(code);
  document.getElementById("trackModal").classList.add("show");
}

/* 子標籤切換：需提醒的船舶／活動清單（記住上次停留的分頁） */

function renderListView(fromDash){

  if(!shown.length){ box.innerHTML=`<p class="hint" style="text-align:center;padding:20px">篩選條件下沒有活動。</p>`; return; }
  const withStats=shown.map(c=>({c,st:campaignStats(c)}));

  withStats.sort((a,b)=>{
    const va=col.get(a.c,a.st),vb=col.get(b.c,b.st);

        <td>${ended?'<span class="pill na">已結束</span>':'<span class="pill ok">進行中</span>'}</td>
        <td>${st.started} / ${st.total}</td>
        <td>${st.submitted}</td>
        <td>${st.track?`<span class="pill bad">⚠ ${st.track} 項</span>`:'<span class="pill na">—</span>'}</td>
        <td style="white-space:nowrap">
          <button class="btn sm" onclick="openDetail(${c.id})">📊 進度</button>
          <button class="btn sm" onclick="previewFill(${c.id})" title="開新分頁，看船上填答畫面長怎樣（不會存檔、不會送出）">👁 預覽</button>
          <button class="btn sm" onclick="copyMailText(${c.id})" title="複製「自查項目＋連結」（上下兩行），貼入郵件發給船隊">✉ MAIL船</button>

        </td>
      </tr>`;
    }).join("")}
  </tbody></table>`;
}
async function toggleActive(id){
  const c=campaigns.find(x=>String(x.id)===String(id));if(!c)return;
  const next=c.active===false;
  try{
    await api(`${CAMPAIGN_TABLE}?id=eq.${id}`,{method:"PATCH",headers:authHeaders({"Prefer":"return=minimal"}),body:JSON.stringify({active:next})});
    c.active=next;
    SLog.log(next?"重新啟用":"結束","活動",`「${c.title||id}」`);
    notify(next?"✓ 已重新啟用，船上又可以打開連結繼續填答":"✓ 已結束活動（資料仍保留，船上打開連結會看到已結束提示，不能再填答）","ok2");
    renderListView();
    if(curCampaign&&String(curCampaign.id)===String(id))curCampaign.active=next;
  }catch(e){notify("⚠ 更新失敗："+e.message,"err");}
}
async function deleteCampaign(id){
  const c=campaigns.find(x=>String(x.id)===String(id));if(!c)return;
  const st=campaignStats(c);
  const v=prompt(`確定要刪除活動「${c.title}」？\n\n這會一併永久刪除已收到的 ${st.started} 艘船填答內容，動作無法復原。\n\n請輸入「確定刪除」以繼續：`);
  if(v!=="確定刪除"){if(v!==null)notify("⚠ 輸入不符，已取消","err");return;}
  try{
    await api(`${RESPONSE_TABLE}?campaign_id=eq.${id}`,{method:"DELETE",headers:authHeaders()});
    await api(`${CAMPAIGN_TABLE}?id=eq.${id}`,{method:"DELETE",headers:authHeaders()});
    SLog.log("刪除","活動",`「${c.title||id}」（含 ${st.started} 艘船的填答）`);
    notify("✓ 已刪除活動","ok2");
    await loadCampaignList();
  }catch(e){notify("⚠ 刪除失敗："+e.message,"err");}
}

/* 這個活動的「應填船舶清單」：有限定就用限定清單，沒限定就用全船舶清單
   （沒填答的船仍要列出來，才看得出「還有誰沒填」，不能只顯示已經有回應的船）。 */
function shipLabel(code){const s=shipOpts.find(x=>x.code===code);return s?s.label:(code||"");}
function targetShips(){
  const scope=(curCampaign.ship_scope&&curCampaign.ship_scope.length)?curCampaign.ship_scope:null;
  let base;
  if(scope)base=scope.map(code=>{const hit=shipOpts.find(s=>s.code===code);return {code,name:hit?hit.name:code,label:hit?hit.label:code};});
  else base=shipOpts.length?shipOpts:responses.map(r=>({code:r.ship,name:r.ship,label:r.ship}));
  return base.filter(s=>!selfOnlyShip(curCampaign,s.code));
}

function rowStat(resp){
  if(!resp)return {done:0,total:(curCampaign.items||[]).length,openTrack:0,closedTrack:0};
  const items=resp.items||[];
  const done=items.filter(it=>it.status&&it.status!=="pending").length;
  const openTrack=items.filter(it=>it.status==="similar"&&!it.closed).length;
  const closedTrack=items.filter(it=>it.status==="similar"&&it.closed).length;
  return {done,total:items.length,openTrack,closedTrack};
}

function renderTable(){
  const tbody=document.getElementById("tbody");
  const filter=document.getElementById("filterSel").value;
  const kw=(document.getElementById("shipSearch").value||"").trim().toLowerCase();
  const byShip=new Map(responses.map(r=>[r.ship,r]));
  let ships=targetShips();
  if(kw)ships=ships.filter(s=>s.code.toLowerCase().includes(kw)||(s.name||"").toLowerCase().includes(kw)||(s.label||"").toLowerCase().includes(kw));
  const rowsHtml=[];
  let nSubmitted=0,nTrackOpen=0,nDone=0;
  ships.forEach(s=>{
    const resp=byShip.get(s.code);
    const st=rowStat(resp);
    const submitted=!!(resp&&resp.submitted_at);
    if(submitted)nSubmitted++;
    if(st.openTrack)nTrackOpen++;
    if(resp&&st.total&&st.done===st.total)nDone++;
    if(filter==="track"&&!st.openTrack)return;
    if(filter==="unsubmitted"&&submitted)return;
    if(filter==="submitted"&&!submitted)return;
    const pct=st.total?Math.round(st.done/st.total*100):0;
    const trackPill=st.openTrack?`<span class="pill bad">⚠ ${st.openTrack} 項未結案</span>`:(st.closedTrack?`<span class="pill ok">✓ ${st.closedTrack} 項已結案</span>`:`<span class="pill na">—</span>`);
    const editUrl=`${SHIP_SITE}submit-selfcheck-share.html?cid=${curCampaign.id}&ship=${encodeURIComponent(s.code)}`;
    rowsHtml.push(`
      <tr class="${st.openTrack?'track':(submitted&&st.total&&st.done===st.total?'done':'')}" data-ship="${esc(s.code)}" style="cursor:pointer" onclick="rowClick(event,'${esc(s.code)}')" title="點這一列查看這艘船的作答內容">
        <td>${esc(s.label||s.name||"")}</td>
        <td>${resp?esc(resp.checker_name||"—")+(resp.checker_title?`<div class="hint">${esc(resp.checker_title)}</div>`:""):"<span class='hint'>尚未開始</span>"}</td>
        <td>${resp?`${st.done} / ${st.total}（${pct}%）`:"<span class='hint'>0 / "+(curCampaign.items||[]).length+"</span>"}</td>
        <td>${trackPill}</td>
        <td>${resp?(resp.submit_count||0):0}</td>
        <td>${resp&&resp.submitted_at?esc(new Date(resp.submitted_at).toLocaleString("zh-TW",{hour12:false})):"<span class='hint'>未送出</span>"}</td>
        <td style="white-space:nowrap">
          <button class="btn sm" onclick="toggleDetail('${esc(s.code)}')">📄 查看</button>
          ${st.openTrack?`<button class="btn sm" style="border-color:var(--warn);color:#a05a10" onclick="openTrackReminder('${esc(s.code)}')" title="編輯內容後複製，發給船上追蹤這幾項是否已改善">🔔 提醒追蹤</button>`:""}
          ${resp?`<button class="btn sm" style="color:var(--bad);border-color:var(--bad)" onclick="deleteResponse('${esc(s.code)}')" title="刪除這艘船在本活動的填答內容">🗑</button>`:""}
        </td>
      </tr>
      <tr class="detailrow" id="detail-${esc(s.code)}"><td colspan="7"></td></tr>
    `);
  });
  tbody.innerHTML=rowsHtml.join("")||`<tr><td colspan="7" class="hint" style="text-align:center;padding:20px">找不到符合條件的船舶</td></tr>`;
  document.getElementById("kpis").innerHTML=`
    <div class="kpi"><div class="v">${responses.filter(r=>targetShips().some(s=>s.code===r.ship)).length} / ${targetShips().length}</div><div class="l">已開始填答／應填船數</div></div>
    <div class="kpi"><div class="v">${nSubmitted}</div><div class="l">已送出</div></div>
    <div class="kpi"><div class="v">${nDone}</div><div class="l">全部題目已作答</div></div>
    <div class="kpi" style="${nTrackOpen?'border-color:var(--bad)':''}"><div class="v" style="${nTrackOpen?'color:var(--bad)':''}">${nTrackOpen}</div><div class="l">艘船有未結案追蹤項目</div></div>
  `;
}

async function deleteResponse(ship){
  const resp=responses.find(r=>r.ship===ship);if(!resp)return;
  if(!confirm(`確定要刪除「${shipLabel(ship)}」這艘船在本活動的填答內容？此動作無法復原，該船之後重新打開連結會視為第一次填答。`))return;
  try{
    await api(`${RESPONSE_TABLE}?id=eq.${resp.id}`,{method:"DELETE",headers:authHeaders()});
    responses=responses.filter(r=>r.id!==resp.id);
    allResponses=allResponses.filter(r=>r.id!==resp.id);
    SLog.log("刪除","船舶填答",`${shipLabel(ship)}／「${(curCampaign&&curCampaign.title)||""}」`);
    notify("✓ 已刪除該船填答","ok2");
    renderTable();
  }catch(e){notify("⚠ 刪除失敗："+e.message,"err");}
}

/* ── 匯出：船隊完成狀況＋需處理項目（有類似情形者：本船實際狀況、處理情況、結案／未結案） ── */
function collectReport(){
  const byShip=new Map(responses.map(r=>[r.ship,r]));
  const fmt=t=>t?new Date(t).toLocaleString("zh-TW",{hour12:false}):"";
  const status=[],issues=[];
  targetShips().forEach(s=>{
    const resp=byShip.get(s.code),st=rowStat(resp);
    const similar=resp?(resp.items||[]).filter(it=>it.status==="similar"):[];
    status.push({code:s.code,name:s.label||s.name||"",checker:resp?(resp.checker_name||""):"",title:resp?(resp.checker_title||""):"",
      progress:resp?`${st.done} / ${st.total}`:`0 / ${(curCampaign.items||[]).length}`,
      state:!resp?"尚未開始":(resp.submitted_at?"已送出":"填答中"),
      submitCount:resp?(resp.submit_count||0):0,submittedAt:resp?fmt(resp.submitted_at):"",
      needN:similar.length,openN:similar.filter(it=>!it.closed).length});
    similar.forEach(it=>issues.push({code:s.code,name:s.label||s.name||"",checker:resp.checker_name||"",title:resp.checker_title||"",
      itemCode:it.code||"",src:it.src||"",detail:it.detail||"",actual2:it.actual2||"",note:it.note||"",handle:it.actual||"",phB:(it.photosBefore||[]).map(x=>x.url).join("\n"),phA:(it.photosAfter||[]).map(x=>x.url).join("\n"),
      closed:it.closed?"已結案":"未結案",tracking:it.closed?"":(it.track||[]).join("、"),closeNote:it.closeNote||"",closedAt:it.closedAt||"",trackDue:it.trackDue||""}));
  });
  return {status,issues};
}
/* 目標船舶清單（可指定活動，用於跨活動彙整；不傳則用目前活動） */
function targetShipsFor(c,resp){
  const scope=(c.ship_scope&&c.ship_scope.length)?c.ship_scope:null;
  let base;
  if(scope)base=scope.map(code=>{const hit=shipOpts.find(s=>s.code===code);return {code,name:hit?hit.name:code};});
  else base=shipOpts.length?shipOpts:resp.map(r=>({code:r.ship,name:r.ship}));
  return base.filter(s=>!selfOnlyShip(c,s.code));
}
function rowStatFor(resp,totalItems){
  if(!resp)return {done:0,total:totalItems,openTrack:0,closedTrack:0};
  const items=resp.items||[];
  const done=items.filter(it=>it.status&&it.status!=="pending").length;
  const openTrack=items.filter(it=>it.status==="similar"&&!it.closed).length;
  const closedTrack=items.filter(it=>it.status==="similar"&&it.closed).length;
  return {done,total:items.length,openTrack,closedTrack};
}
/* 單一活動的彙整（跨活動匯出用），邏輯跟 collectReport() 一致，但不依賴 curCampaign/responses 全域變數 */
function collectReportFor(c){
  const resp=allResponses.filter(r=>String(r.campaign_id)===String(c.id));
  const byShip=new Map(resp.map(r=>[r.ship,r]));
  const totalItems=(c.items||[]).length;
  const fmt=t=>t?new Date(t).toLocaleString("zh-TW",{hour12:false}):"";

  const label=c.title||("活動 #"+c.id);

    const r=byShip.get(s.code),st=rowStatFor(r,totalItems);

    status.push({campaign:label,code:s.code,name:s.label||s.name||"",checker:r?(r.checker_name||""):"",title:r?(r.checker_title||""):"",
      progress:r?`${st.done} / ${st.total}`:`0 / ${totalItems}`,
      state:!r?"尚未開始":(r.submitted_at?"已送出":"填答中"),
      submitCount:r?(r.submit_count||0):0,submittedAt:r?fmt(r.submitted_at):"",
      needN:similar.length,openN:similar.filter(it=>!it.closed).length});
    similar.forEach(it=>issues.push({campaign:label,code:s.code,name:s.label||s.name||"",checker:r.checker_name||"",title:r.checker_title||"",
      itemCode:it.code||"",src:it.src||"",detail:it.detail||"",actual2:it.actual2||"",note:it.note||"",handle:it.actual||"",phB:(it.photosBefore||[]).map(x=>x.url).join("\n"),phA:(it.photosAfter||[]).map(x=>x.url).join("\n"),
      closed:it.closed?"已結案":"未結案",tracking:it.closed?"":(it.track||[]).join("、"),closeNote:it.closeNote||"",closedAt:it.closedAt||"",trackDue:it.trackDue||""}));
  });
  return {status,issues};
}
/* 匯出全部活動明細：一次把所有活動、所有船舶的檢查結果與需處理明細彙整成一份 Excel，

const ST_LABEL={ok:"✅ 沒有",similar:"⚠️ 有，需處理",self:"🚩 當事船",na:"➖ 不適用",pending:"（未作答）"};

  const row=document.getElementById("detail-"+ship);

  // 編輯（代填）與專屬連結放在「查看」展開的內容裡：這頁只有海技／督導看得到，

    <div style="padding:6px 4px">

        <div class="itemline">
          <b>#${i+1}</b> ${esc(it.topic?("📌 "+it.topic):(it.code?("CODE "+it.code):""))}${it.topic?"":srcTag(it)} <span class="stbadge ${it.status||'pending'}">${ST_LABEL[it.status||"pending"]}</span>${it.status==="similar"?(it.closed?'<span class="stbadge ok">已結案</span>':'<span class="stbadge similar">未結案</span>'+((it.track||[]).length?'<span class="stbadge" style="background:#eaf1f9;color:#1d4e80">已在追蹤：'+esc(it.track.join("、"))+'</span>':'')):""}
          <div class="hint">${esc(it.detail||"")}</div>
          ${it.actual2?`<div class="hint">實際情況：${esc(it.actual2)}</div>`:""}
          ${it.supp?`<div class="hint" style="color:#8a5a00">💬 公司補充說明：${esc(it.supp)}</div>`:""}
          ${it.note?`<div style="margin-top:2px"><b>本船實際狀況：</b>${esc(it.note)}</div>`:""}
          ${it.naNote?`<div style="margin-top:2px"><b>不適用原因：</b>${esc(it.naNote)}</div>`:""}
          ${it.actual?`<div><b>打算怎麼處理：</b>${esc(it.actual)}</div>`:""}
          ${it.closeNote?`<div style="margin-top:2px"><b>改善情形說明：</b>${esc(it.closeNote)}</div>`:""}
          ${["photosBefore","photosAfter"].map(k=>(it[k]||[]).length?`<div style="margin-top:4px"><b>${k==="photosBefore"?"📷 現況照片／PDF":"📷 改善後照片／PDF"}：</b><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:3px">${it[k].map(ph=>`<a href="${esc(ph.url)}" target="_blank" rel="noopener" title="${esc(ph.name||"")}">${/pdf/i.test(ph.type||"")||/\.pdf$/i.test(ph.name||ph.path||"")?`<span style="display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:64px;height:64px;border-radius:6px;border:1px solid var(--line);background:#fdecea;color:#b3261e;font-size:18px;line-height:1.2">📄<b style="font-size:11px">PDF</b></span>`:`<img src="${esc(ph.url)}" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)">`}</a>`).join("")}</div></div>`:"").join("")}

/* 追蹤期限：督導／海技在這裡直接設定或修改，寫回這艘船的填答（items 是整包 jsonb，改單一題就整包存回）。
   船上那邊看得到但不能改，只是提醒用，真正的期限由這裡掌握。 */
async function setTrackDue(ship,i,val){
  const resp=responses.find(r=>r.ship===ship);if(!resp)return;
  const items=resp.items||[];if(!items[i])return;
  items[i].trackDue=val;
  try{
    await api(`${RESPONSE_TABLE}?id=eq.${resp.id}`,{method:"PATCH",headers:authHeaders({"Prefer":"return=minimal"}),body:JSON.stringify({items,updated_at:Date.now()})});
    SLog.log("修改","追蹤期限",`${shipLabel(ship)}／「${(curCampaign&&curCampaign.title)||""}」第 ${i+1} 項：${val||"清除"}`);
    notify(val?"✓ 已設定追蹤期限":"✓ 已清除追蹤期限","ok2");
    const ar=allResponses.find(r=>r.id===resp.id);if(ar)ar.items=items;
  }catch(e){notify("⚠ 更新失敗："+e.message,"err");}
}
/* 提醒追蹤：把這艘船目前「有，需處理」且未結案的項目整理成一段訊息（含填答連結），
   內容可在跳出的視窗裡自行編輯，編輯後按「複製內容」貼到 Email／通訊軟體發給船上。 */
function buildReminderText(ship){
  const resp=responses.find(r=>r.ship===ship);
  const open=((resp&&resp.items)||[]).map((it,i)=>({it,i})).filter(x=>x.it.status==="similar"&&!x.it.closed);
  const url=`${SHIP_SITE}submit-selfcheck-share.html?cid=${curCampaign.id}&ship=${encodeURIComponent(ship)}`;
  const lines=open.map(({it,i})=>`#${i+1}　${it.code?"CODE "+it.code+"　":""}${it.detail||""}${it.trackDue?`（追蹤期限：${it.trackDue}）`:""}`);
  return `【自查案件追蹤】${curCampaign.title||""}\n\n${shipLabel(ship)} 您好，請查此自查項目類似情形是否已改善：\n\n${lines.join("\n\n")}\n\n若已改善，請點選下方連結進入，勾選「已完成改善（結案）」並說明改善情形、填上結案日期後送出；尚未改善的也請先填寫目前處理進度。\n\n連結：${url}`;
}
function openTrackReminder(ship){
  document.getElementById("trackModalShip").textContent=shipLabel(ship);
  document.getElementById("trackModalText").value=buildReminderText(ship);
  document.getElementById("trackModal").classList.add("show");
}
function closeTrackReminder(){document.getElementById("trackModal").classList.remove("show");}
function copyTrackReminder(){
  safeCopyText(document.getElementById("trackModalText").value,"✓ 已複製，請貼到 Email／通訊軟體發送");
}

const SC={
  DRAFT_PREFIX:"sharecase_draft_",BYKEY:"scs_creator_name",
  _q:[],_files:[],_uploading:0,_draftId:null,_savedAt:0,_fleet:null,_drafts:null,
  async fleet(){
    if(this._fleet)return this._fleet;
    try{const rows=await api("sync_ships?select=payload&limit=500")||[];
      this._fleet=rows.map(r=>r.payload).filter(s=>s&&s.code&&String(s.operator||"").toUpperCase()==="FPMC"&&!s.sold&&!EXCLUDED_SHIPS.includes(s.code))
        .sort((a,b)=>String(a.code).localeCompare(String(b.code),undefined,{numeric:true}));}
    catch(e){this._fleet=shipOpts.map(s=>({code:s.code,zh:s.zh,name:s.en,vtype:""}));}
    return this._fleet;
  },
  label(s){return [s.zh,s.name].filter(Boolean).join(" ")||s.code;},
  by(){try{return localStorage.getItem(this.BYKEY)||"";}catch(e){return "";}},
  /* 建立者：先選部門再選人（名單＝主系統登入名單 app_db roster，海技在主系統「資料管理」維護）；記住上次選的 */
  _roster:null,DEPTKEY:"scs_creator_dept",
  async roster(){
    if(this._roster)return this._roster;
    try{const r=(await api("app_db?select=payload&k=eq.roster")||[])[0];this._roster=(r&&Array.isArray(r.payload)?r.payload:[]).filter(x=>x&&x.name&&!["船舶","訪客"].includes(x.dept)&&x.tier!=="op2");}
    catch(e){this._roster=[];}
    return this._roster;
  },
  async byPickerHtml(){
    const R=await this.roster();
    if(!R.length)return `<input type="text" id="scBy" value="${esc(this.by())}" placeholder="例：潘獻波" style="max-width:260px">`; // 名單讀不到時退回手動輸入
    const depts=[...new Set(R.map(x=>x.dept||"其他"))];
    let d0="";try{d0=localStorage.getItem(this.DEPTKEY)||"";}catch(e){}
    const by0=this.by();
    if(by0&&!R.some(x=>(x.dept||"其他")===d0&&x.name===by0)){const hit=R.find(x=>x.name===by0);d0=hit?(hit.dept||"其他"):d0;}
    return `<div style="display:flex;gap:8px;flex-wrap:wrap;max-width:460px">
      <select id="scByDept" style="flex:1;min-width:150px" onchange="SC.fillBy()"><option value="">選擇部門…</option>${depts.map(d=>`<option ${d===d0?"selected":""}>${esc(d)}</option>`).join("")}</select>
      <select id="scBy" style="flex:1;min-width:150px" onchange="SC.rememberBy()"></select></div>`;
  },
  fillBy(keep){
    const ds=document.getElementById("scByDept"),ps=document.getElementById("scBy");if(!ds||!ps||ps.tagName!=="SELECT")return;
    const d=ds.value,names=(this._roster||[]).filter(x=>(x.dept||"其他")===d).map(x=>x.name);
    const cur=keep||this.by();
    ps.innerHTML=`<option value="">${d?"選擇人員…":"先選部門"}</option>`+names.map(n=>`<option ${n===cur?"selected":""}>${esc(n)}</option>`).join("");
    try{localStorage.setItem(this.DEPTKEY,d);}catch(e){}
  },
  rememberBy(){const v=(document.getElementById("scBy").value||"").trim();try{localStorage.setItem(this.BYKEY,v);}catch(e){}},
  async enter(){if(!document.getElementById("scTitle"))await this.mount(null);this.loadDrafts();},

      <span class="sl">案例說明（選填：這一題的來源缺失或實例；船上點開才看得到）</span><textarea id="scEx-${i}" rows="2" placeholder="可留空">${esc(q.ex||"")}</textarea>
      <span class="sl">本題附件（選填：只會顯示在這一題）</span>
      <div><label class="btn sm" style="cursor:pointer">📎 本題附件<input type="file" multiple style="display:none" onchange="SC.addFiles(this,${i})"></label>
        ${(q.files||[]).map((f,j)=>`<span class="scfile">📎 <a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a><a href="#" title="移除" onclick="event.preventDefault();SC.syncQ();SC._q[${i}].files.splice(${j},1);SC.renderQ()" style="color:var(--bad);text-decoration:none">✕</a></span>`).join("")}${q._up?`<span class="hint">上傳中…</span>`:""}</div>
    </div>`).join("");
  },
  addQ(){this.syncQ();this._q.push({topic:"",key:"",checks:"",ex:"",files:[]});this.renderQ();const t=document.getElementById(`scTopic-${this._q.length-1}`);if(t){t.scrollIntoView({behavior:"smooth",block:"center"});t.focus();}},
  delQ(i){this.syncQ();this._q.splice(i,1);this.renderQ();},
  async uploadFile(file){
    if(file.size>20*1024*1024)throw new Error(`超過 20MB（${(file.size/1024/1024).toFixed(1)}MB）`);
    const buf=await file.arrayBuffer();
    const h=[...new Uint8Array(await crypto.subtle.digest("SHA-256",buf))].map(b=>b.toString(16).padStart(2,"0")).join("");
    const ext=((String(file.name||"").match(/\.([A-Za-z0-9]{1,8})$/)||[])[1]||"bin").toLowerCase();
    const path=`f/${h.slice(0,2)}/${h}.${ext}`,type=file.type||"application/octet-stream";
    const r=await fetch(`${CLOUD.url}/storage/v1/object/defect-photos/${path}`,{method:"POST",headers:{"apikey":CLOUD.key,"Authorization":"Bearer "+CLOUD.key,"Content-Type":type,"x-upsert":"false"},body:file});
    if(!r.ok){const t=await r.text().catch(()=>"");if(!(r.status===409||/exists|duplicate/i.test(t)))throw new Error(/mime|type/i.test(t)?"雲端不接受這種檔案類型，請轉成 PDF":`HTTP ${r.status}`);}
    return {name:file.name||("附件."+ext),url:`${CLOUD.url}/storage/v1/object/public/defect-photos/${path}`,path,type,size:file.size};
  },
  /* qi＝題目序號：有給就加到那一題（本題附件），沒給就是共用附件 */
  async addFiles(inp,qi){
    const files=[...(inp.files||[])];inp.value="";
    const q=qi!=null?this._q[qi]:null;if(q){this.syncQ();q.files=q.files||[];}
    const redraw=()=>{if(q)this.renderQ();else this.renderFiles();};
    for(const f of files){
      this._uploading++;if(q)q._up=(q._up||0)+1;redraw();
      try{notify(`「${f.name}」上傳中…`);const p=await this.uploadFile(f);const arr=q?q.files:this._files;if(!arr.some(x=>x.path===p.path))arr.push(p);notify(`✓「${f.name}」已上傳`,"ok2");}
      catch(e){notify(`⚠「${f.name}」沒有上傳：${e.message||e}`,"err");}
      finally{this._uploading--;if(q)q._up--;this.syncQ();redraw();}
    }
  },
  renderFiles(){
    const el=document.getElementById("scFiles");if(!el)return;
    el.innerHTML=this._files.map((f,i)=>`<span class="scfile">📎 <a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a><a href="#" title="移除" onclick="event.preventDefault();SC._files.splice(${i},1);SC.renderFiles()" style="color:var(--bad);text-decoration:none">✕</a></span>`).join("")
      +(this._uploading?`<span class="hint">上傳中…</span>`:"")+(!this._files.length&&!this._uploading?`<span class="hint">尚未加入附件</span>`:"");
  },
  mode(){return (document.querySelector('input[name="scTo"]:checked')||{}).value||"all";},
  targets(){
    const m=this.mode(),fleet=this._fleet||[];
    if(m==="bulk"||m==="tanker")return fleet.filter(s=>s.vtype===m).map(s=>s.code);
    if(m==="pick")return [...document.querySelectorAll("#scShips input:checked")].map(x=>x.value);

  },
  targetUI(fromGrid){
    const m=this.mode(),grid=document.getElementById("scShips");if(!grid)return;

  },
  draftSt(){const el=document.getElementById("scDraftSt");if(el)el.textContent=this._draftId?`草稿已儲存 ${this._savedAt?new Date(this._savedAt).toLocaleString("zh-TW",{hour12:false}).replace(/:\d\d$/,""):""}`:"尚未儲存草稿";},
  state(){
    this.syncQ();const m=this.mode();
    return {title:(document.getElementById("scTitle").value||"").trim(),bg:document.getElementById("scBg").value||"",q:this._q.map(q=>({topic:q.topic,key:q.key,checks:q.checks,ex:q.ex,files:(q.files||[]).map(f=>({name:f.name,url:f.url,path:f.path,type:f.type,size:f.size}))})),
      files:this._files.map(f=>({name:f.name,url:f.url,path:f.path,type:f.type,size:f.size})),to:m,
      ships:m==="pick"?[...document.querySelectorAll("#scShips input:checked")].map(x=>x.value):[]};
  },
  needBy(){const v=(document.getElementById("scBy").value||"").trim();if(!v){notify("⚠ 請先選「建立者」（部門→人員）","err");document.getElementById("scBy").focus();return "";}try{localStorage.setItem(this.BYKEY,v);}catch(e){}return v;},
  async saveDraft(){
    if(this._uploading){notify("⚠ 附件還在上傳，請稍候","err");return;}
    const by=this.needBy();if(!by)return;
    const st=this.state();
    if(!st.title&&!st.bg.trim()&&!st.q.some(q=>q.topic||q.key)){notify("⚠ 還沒填任何內容","err");return;}
    // 2026-11-04 多人同時使用的保護：
    // ① 新草稿：編號＝時間＋亂數，存之前先確認雲端沒有同編號，避免兩人同一瞬間新建互相蓋掉
    // ② 編輯既有草稿：存之前看雲端版本，若別人在我打開之後存過，先提醒再決定要不要覆蓋
    let id=this._draftId;
    try{
      if(!id){
        for(let t=0;t<5;t++){const c=Date.now()*1000+Math.floor(Math.random()*1000);
          const ex=await api(`app_db?select=k&k=eq.${this.DRAFT_PREFIX}${c}`)||[];if(!ex.length){id=c;break;}}
        if(!id)throw new Error("無法產生草稿編號，請再按一次");
      }else{
        const cur=(await api(`app_db?select=payload&k=eq.${this.DRAFT_PREFIX}${id}`)||[])[0];
        const p=cur&&cur.payload;
        if(p&&p.deleted){if(!confirm("這則草稿已經被刪除或發佈了。\n要另存成一則新草稿嗎？"))return;id=null;this._draftId=null;return this.saveDraft();}
        if(p&&p.updatedAt&&this._savedAt&&p.updatedAt>this._savedAt&&!confirm(`這則草稿在你打開之後，已被「${p.by||"其他人"}」於 ${new Date(p.updatedAt).toLocaleString("zh-TW",{hour12:false})} 修改過。\n\n按「確定」用你的內容覆蓋；按「取消」不存（可先到草稿重新開啟看對方改了什麼）。`))return;
      }
    }catch(e){notify("⚠ 草稿儲存失敗："+e.message,"err");return;}
    const now=Date.now();
    try{await api("app_db?on_conflict=k",{method:"POST",headers:authHeaders({"Prefer":"resolution=merge-duplicates"}),body:JSON.stringify([{k:this.DRAFT_PREFIX+id,updated:now,payload:{id,...st,by,updatedAt:now}}])});}
    catch(e){notify("⚠ 草稿儲存失敗："+e.message,"err");return;}
    SLog.log(this._draftId?"修改":"新增","自訂自查草稿",`「${st.title||"（未命名）"}」`,by);
    this._draftId=id;this._savedAt=now;this.draftSt();document.getElementById("scFormHead").textContent="✏ 編輯草稿";
    notify("✓ 草稿已儲存","ok2");this.loadDrafts(true);
  },
  async loadDrafts(force){
    const box=document.getElementById("scDrafts");
    if(force||!this._drafts){
      try{const rows=await api(`app_db?select=k,payload,updated&k=like.${this.DRAFT_PREFIX}*&order=updated.desc&limit=200`)||[];this._drafts=rows.map(r=>r.payload).filter(p=>p&&!p.deleted);}
      catch(e){if(box)box.innerHTML=`⚠ 讀取失敗：${esc(e.message)}`;return;}
    }

      return `<div class="scrow"${cur?' style="background:#fffbea"':""}><div style="flex:1;min-width:0"><b>${esc(d.title||"（未命名）")}</b>${cur?' <span class="pill warn">編輯中</span>':""}
        <div class="hint">最後儲存 ${d.updatedAt?new Date(d.updatedAt).toLocaleString("zh-TW",{hour12:false}).replace(/:\d\d$/,""):""}${d.by?"・"+esc(d.by):""}・${nq} 題${nf?`・附件 ${nf} 個`:""}</div></div>
        <button class="btn sm" onclick="SC.editDraft(${d.id})">✏ 繼續編輯</button><button class="btn sm" style="color:var(--bad)" onclick="SC.delDraft(${d.id})">🗑</button></div>`;}).join("")
      :`<span class="hint">目前沒有草稿。</span>`;
  },
  async editDraft(id){await this.loadDrafts(true);const d=(this._drafts||[]).find(x=>String(x.id)===String(id));if(!d){notify("⚠ 找不到這則草稿（可能已發佈或刪除）","err");return;}await this.mount(d);this.ctab("new");window.scrollTo({top:0,behavior:"smooth"});},
  async delDraft(id,silent){
    if(!silent&&!confirm("刪除這則草稿？"))return;
    try{await api("app_db?on_conflict=k",{method:"POST",headers:authHeaders({"Prefer":"resolution=merge-duplicates"}),body:JSON.stringify([{k:this.DRAFT_PREFIX+id,updated:Date.now(),payload:{id,deleted:true,deletedAt:Date.now(),by:this.by()}}])});}
    catch(e){if(!silent)notify("⚠ 刪除失敗："+e.message,"err");return;}
    if(String(this._draftId)===String(id)&&!silent)await this.mount(null);
    if(!silent){notify("已刪除草稿","ok2");SLog.log("刪除","自訂自查草稿",`#${id}`);}this.loadDrafts(true);
  },
  build(){
    if(this._uploading){notify("⚠ 附件還在上傳，請稍候","err");return null;}
    const st=this.state();
    if(!st.title){notify("⚠ 請填活動名稱","err");return null;}
    const scope=this.targets();if(scope&&!scope.length){notify("⚠ 請至少選一艘船","err");return null;}
    const qs=st.q.filter(q=>q.topic.trim()||q.key.trim());
    if(!qs.length){notify("⚠ 請至少出一題","err");return null;}
    if(qs.some(q=>!q.topic.trim()||!q.key.trim())){notify("⚠ 每一題都要有「題目名稱」和「問題重點」","err");return null;}
    const bg=st.bg.trim();
    const ref=f=>({name:f.name,url:/pdf|image/i.test(f.type||"")?f.url:`${f.url}?download=${encodeURIComponent(f.name||"")}`});
    const refs=this._files.map(ref); // 共用附件（每題都附）
    const items=qs.map((q,i)=>{
      const topic=q.topic.trim(),key=q.key.trim(),ex=(q.ex||"").trim(),checks=q.checks.split(/\r?\n/).map(s=>s.replace(/^[-*•□\s]+/,"").trim()).filter(Boolean);
      const it={topic,main:"自訂案例",key,checks,examples:ex?[{label:"案例說明",detail:ex}]:[],refs:[...refs,...(q.files||[]).map(ref)],stat:"",code:"",ncMain:"",ncLeaf:topic,src:"自訂案例",
        detail:`【${topic}】${key}${checks.length?"\n請確認：\n"+checks.map(c=>"□ "+c).join("\n"):""}`,actual2:ex};
      if(i===0&&bg)it.campIntro=bg;return it;});
    return {title:st.title,bg,scope,refs,items};
  },
  preview(){
    const P=this.build();if(!P)return;
    let m=document.getElementById("scPrev");
    if(!m){m=document.createElement("div");m.className="modal-bg";m.id="scPrev";document.body.appendChild(m);}
    const nl=s=>esc(s).replace(/\n/g,"<br>");
    const card=(it,i)=>`<div style="border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;background:#fff">
      <b style="color:var(--navy);font-size:15px">${i+1}. 📌 ${esc(it.topic)}</b>

        ${it.refs.length?`<div style="margin-top:6px"><b>附件：</b>${it.refs.map(f=>`<a href="${esc(f.url)}" target="_blank" rel="noopener" style="margin-right:10px">📎 ${esc(f.name)}</a>`).join("")}</div>`:""}
        ${it.examples.length?`<details style="margin-top:6px"><summary style="cursor:pointer">案例說明（1）</summary><div style="margin-top:4px;font-size:13px">${nl(it.examples[0].detail)}</div></details>`:""}
      </div>
      <div class="hint" style="margin-top:6px">船上在這裡作答：✅ 沒有／⚠️ 有，需處理／➖ 不適用</div></div>`;
    const imgs=this._files.filter(f=>/image/i.test(f.type||"")||/\.(jpe?g|png|gif|webp)$/i.test(f.name||""));
    m.innerHTML=`<div class="modal-box" style="max-width:820px;background:#eef2f5">

      <div style="overflow:auto;flex:1">
        <div style="background:var(--navy);color:#fff;border-radius:10px;padding:12px 16px;margin-bottom:12px"><div style="font-size:12px;opacity:.8">船隊檢查缺失分享及自查</div><div style="font-size:17px;font-weight:800">${esc(P.title)}</div>
          <div style="font-size:12.5px;opacity:.9;margin-top:4px">共 ${P.items.length} 題・${P.scope?`發給 ${P.scope.length} 艘船：${esc(P.scope.join("、"))}`:`發給全船隊 ${(this._fleet||[]).length} 艘`}${P.refs.length?`・附件 ${P.refs.length} 個`:""}</div></div>
        ${P.bg?`<div style="background:#fff8e6;border:1px solid #f1d58a;border-left:5px solid #e0a020;border-radius:10px;padding:12px 14px;margin-bottom:12px"><div style="font-weight:800;color:#8a5a00;margin-bottom:4px">📢 自查說明</div><div style="line-height:1.75;font-size:13.5px">${nl(P.bg)}</div></div>`:""}
        ${P.items.map(card).join("")}
        ${imgs.length?`<div class="hint">附件圖片：</div><div style="display:flex;gap:8px;flex-wrap:wrap">${imgs.map(f=>`<a href="${esc(f.url)}" target="_blank" rel="noopener"><img src="${esc(f.url)}" alt="${esc(f.name)}" style="height:90px;border-radius:6px;border:1px solid var(--line);background:#fff"></a>`).join("")}</div>`:""}
      </div>
      <div style="display:flex;gap:8px;margin-top:10px"><button class="btn" onclick="document.getElementById('scPrev').classList.remove('show')">← 返回修改</button><span style="flex:1"></span><button class="btn primary" onclick="SC.publish(true)">📮 沒問題，發佈並複製連結</button></div></div>`;
    m.classList.add("show");
  },
  async publish(fromPreview){
    const by=this.needBy();if(!by)return;
    const P=this.build();if(!P)return;
    if(!fromPreview&&!confirm(`確定發佈「${P.title}」？\n\n共 ${P.items.length} 題，${P.scope?"發給 "+P.scope.length+" 艘船":"發給全船隊"}${P.refs.length?"，附件 "+P.refs.length+" 個":""}。\n發佈後船上就可以開始作答（建議先按「👁 預覽」看過）。`))return;
    const pv=document.getElementById("scPrev");if(pv)pv.classList.remove("show");
    // 發佈＝新增一筆（不是覆蓋）：萬一跟別人同一毫秒發佈撞到同一個活動編號，資料庫會拒絕，這裡換個編號再試，不會蓋掉別人的活動
    let id=0,lastErr=null;
    for(let t=0;t<3;t++){
      const tryId=Date.now()+t*7;
      const campaign={id:tryId,title:P.title,items:P.items,ship_scope:P.scope,source_air_id:null,created_at:Date.now(),created_by:by,active:true};
      try{await api(CAMPAIGN_TABLE,{method:"POST",headers:authHeaders({"Prefer":"return=minimal"}),body:JSON.stringify([campaign])});id=tryId;break;}
      catch(e){lastErr=e;if(!/409|23505|duplicate/i.test(e.message))break;await new Promise(r=>setTimeout(r,30));}
    }
    if(!id){notify("⚠ 發佈失敗："+(lastErr?lastErr.message:""),"err");return;}
    SLog.log("發佈","自訂自查",`「${P.title}」${P.items.length} 題，${P.scope?"發給 "+P.scope.length+" 艘船":"全船隊"}（活動 #${id}）`,by);
    const link=`${SHIP_SITE}submit-selfcheck-share.html?cid=${id}`;
    const text=`${P.title}\n填答連結：${link}\n\n各輪也可從「船舶檢查填報平台」→ 上方選單「🔍 分享缺失自查」，查看本船各項自查的填單情形（是否已送出、需追蹤未結案項目）：\n${SHIP_SITE}`;
    safeCopyText(text,"✓ 已複製活動名稱＋填答連結");
    if(this._draftId)await this.delDraft(this._draftId,true);
    await this.mount(null);
    alert(`✓ 已發佈分享自查（${P.items.length} 題）。\n\n活動名稱＋填答連結已複製，請貼給船隊：\n${text}`);
    await loadCampaignList();setSubTab("list");
  }
};
/* ══ 📜 操作紀錄（2026-11-04）：寫進主系統同一張 audit_log（對象以「分享自查」開頭，主系統「資料管理 → 操作紀錄查詢」也看得到）。
   查看只限 Owner：本頁沒有登入，用主系統／內部檢查缺失登錄的登入身份（vsm_identity_v1，8 小時）判斷。 ══ */
const SLog={
  rows:[],TIER:{owner:"Owner",admin:"管理員",op1:"督導",op2:"船舶",op3:"其他部門"},
  ident(){try{const s=JSON.parse(localStorage.getItem("vsm_identity_v1"));return s&&s.name&&s.exp>Date.now()?s:null;}catch(e){return null;}},
  isOwner(){const s=this.ident();return !!(s&&s.tier==="owner");},
  user(fallback){const s=this.ident();return s?`${s.name}（${this.TIER[s.tier]||s.tier}）`:(fallback||((typeof SC!=="undefined"&&SC.by())||"未具名"))+"（未登入）";},
  log(action,target,summary,by){
    const e={ts:Date.now(),usr:this.user(by),action,target:"分享自查－"+target,summary:String(summary||"").slice(0,180)};
    api("audit_log",{method:"POST",headers:authHeaders({"Prefer":"return=minimal"}),body:JSON.stringify([e])}).catch(err=>console.warn("audit log",err));
  },
  initBtn(){const b=document.getElementById("slogBtn");if(b)b.style.display=this.isOwner()?"":"none";},
  close(){const m=document.getElementById("slogModal");if(m)m.classList.remove("show");},
  async open(){
    if(!this.isOwner()){notify("⚠ 操作紀錄只限 Owner 查看（請先在主系統以 Owner 身份登入）","err");return;}
    let m=document.getElementById("slogModal");
    if(!m){m=document.createElement("div");m.className="modal-bg";m.id="slogModal";m.innerHTML=`<div class="modal-box" style="max-width:980px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap"><b style="font-size:15px;color:var(--navy)">📜 分享自查　操作紀錄</b>
        <input type="text" id="slogQ" placeholder="搜尋人員／動作／內容" oninput="SLog.render()" style="flex:1;min-width:180px;padding:6px 10px;font-size:13px">
        <span class="hint" id="slogStat"></span><button class="btn sm" onclick="SLog.open()">🔄 重新載入</button><button class="btn sm" onclick="SLog.close()">關閉</button></div>
      <div style="overflow:auto;flex:1"><table><thead><tr><th>時間</th><th>人員</th><th>動作</th><th>對象</th><th>內容</th></tr></thead><tbody id="slogBody"></tbody></table></div></div>`;document.body.appendChild(m);}
    m.classList.add("show");document.getElementById("slogBody").innerHTML=`<tr><td colspan="5" class="hint">載入中…</td></tr>`;
    try{this.rows=await api("audit_log?select=ts,usr,action,target,summary&target=like."+encodeURIComponent("分享自查*")+"&order=ts.desc&limit=1000")||[];}
    catch(e){this.rows=[];notify("⚠ 載入失敗："+e.message,"err");}
    this.render();
  },
  render(){
    const q=(document.getElementById("slogQ").value||"").trim().toLowerCase();
    const list=this.rows.filter(e=>!q||[e.usr,e.action,e.target,e.summary].join(" ").toLowerCase().includes(q));
    document.getElementById("slogStat").textContent=`共 ${list.length} 筆（最近 1000 筆內）`;
    document.getElementById("slogBody").innerHTML=list.map(e=>`<tr><td style="white-space:nowrap;font-size:12px">${esc(new Date(+e.ts).toLocaleString("zh-TW",{hour12:false}))}</td><td style="white-space:nowrap"><b>${esc(e.usr)}</b></td><td style="white-space:nowrap;${e.action==="刪除"?"color:var(--bad);font-weight:700":""}">${esc(e.action)}</td><td style="white-space:nowrap">${esc(String(e.target||"").replace(/^分享自查－?/,"")||"分享自查")}</td><td>${esc(e.summary)}</td></tr>`).join("")||`<tr><td colspan="5" class="hint">尚無紀錄</td></tr>`;
  }
};
SLog.initBtn();
if(/^#new$/.test(location.hash||"")){setHash("");setTimeout(()=>{setSubTab("case");SC.ctab("new");},0);}
loadCampaignList();
/* 打開頁面時已自動整理一次；之後只在「離開又回到這個分頁」且距上次整理超過 60 秒時才自動再整理，
   停在原頁面沒動作的情況才需要自己按「🔄 重新整理」。整理時停留在原本畫面，不會被跳回活動列表。 */
let lastAutoAt=Date.now();
document.addEventListener("visibilitychange",async()=>{
  if(document.hidden||Date.now()-lastAutoAt<60000)return;
  lastAutoAt=Date.now();
  try{
    campaigns=await api(`${CAMPAIGN_TABLE}?order=created_at.desc&limit=200`);
    allResponses=await api(`${RESPONSE_TABLE}?select=id,campaign_id,ship,items,submitted_at&limit=5000`);
    if(document.getElementById("detailView").style.display!=="none"&&curCampaign)await loadCampaign(curCampaign.id);
    else renderListView();
  }catch(e){}
});
</script>
</body>
