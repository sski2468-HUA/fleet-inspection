<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>內部檢查改善回報 — FPMC</title>
<style>
:root{--navy:#1c3a5e;--paper:#f5f7f8;--card:#fff;--line:#dde4e8;--line-2:#c3ced5;--ink:#15262f;--ink-2:#52656f;--ink-3:#8195a0;--signal:#e8842c;--teal:#1e7f8c;--teal-l:#e4f1f2;--ok:#2e8b57;--bad:#c0392b;
--sans:"Segoe UI","Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);font-family:var(--sans);color:var(--ink);font-size:15px}
.wrap{max-width:860px;margin:0 auto;padding:0 0 80px}
header{background:var(--navy);color:#fff;padding:18px 18px}
header h1{margin:0;font-size:19px}
header p{margin:6px 0 0;font-size:13px;color:#b9c8d6;line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:14px;padding:16px}
.hint{color:var(--ink-3);font-size:12.5px;line-height:1.7}
.banner{margin:14px;background:var(--teal-l);border:1px solid #bfdde0;border-radius:8px;padding:10px 14px;font-size:13px;line-height:1.8;color:#22505a}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:#fff;color:var(--ink);padding:10px 16px;border-radius:8px;font-size:14px;cursor:pointer;font-family:var(--sans);font-weight:600}
.btn.primary{background:var(--signal);border-color:var(--signal);color:#fff;width:100%;font-size:16px;padding:13px}
.btn.sm{padding:5px 11px;font-size:12.5px}
input[type=text],input[type=date],select,textarea{padding:10px 11px;border:1px solid var(--line-2);border-radius:8px;font-size:15px;font-family:var(--sans);width:100%;background:#fff}
textarea{min-height:84px;resize:vertical;line-height:1.5}
label,.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2);font-weight:600;margin-bottom:12px}
.req{color:var(--bad)}
.item{border-left:4px solid var(--signal)}
.item.done{border-left-color:var(--ok);background:#f6fbf8}
.item.wait{border-left-color:var(--teal)}
.ih{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-weight:700;color:var(--navy)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:10px;padding:1px 9px}
.pill.ic{background:#fdeedf;color:#b5610f}.pill.sys{background:var(--teal-l);color:var(--teal)}
.pill.ok{background:#e2f3e8;color:var(--ok)}.pill.rep{background:#e3ecf1;color:var(--navy)}.pill.ret{background:#fde8e6;color:var(--bad)}
.risk{display:inline-block;font-size:11.5px;font-weight:700;border-radius:3px;padding:1px 8px}
.risk.h{background:#fde8e6;color:#c0392b}.risk.m{background:#fff3cd;color:#7a5a10}.risk.l{background:#e2f3e8;color:#2e8b57}
.finding{white-space:pre-line;border-left:3px solid var(--line-2);padding:4px 0 4px 10px;margin:8px 0;line-height:1.6}
.phs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ph{position:relative;width:88px;height:88px}
.ph img{width:88px;height:88px;object-fit:cover;border-radius:6px;border:1px solid var(--line-2);cursor:pointer}
.ph button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:none;background:var(--bad);color:#fff;font-size:14px;line-height:22px;cursor:pointer;padding:0}
.phadd{display:flex!important;flex-direction:row!important;align-items:center;justify-content:center;width:88px;height:88px;border:2px dashed var(--line-2);border-radius:6px;color:var(--ink-3);font-size:12px;cursor:pointer;background:#fafbfb;text-align:center;margin:0}
.errors{background:#fdf0ee;border:1px solid #efc3bb;border-left:4px solid var(--bad);border-radius:6px;padding:12px 16px;margin:14px;font-size:13px;color:#8a2c1f;line-height:1.8}
.bad{outline:2px solid var(--bad);outline-offset:1px;border-radius:6px}
.sub{background:#f7f9fb;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px;line-height:1.7;white-space:pre-line}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;z-index:99;max-width:90vw;text-align:center}
#toast.err{background:var(--bad)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:120;cursor:zoom-out}
.lightbox img{max-width:94vw;max-height:94vh;border-radius:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🛠 內部檢查改善單（船上回報）</h1>
    <p id="hdrSub">讀取中…</p>
  </header>
  <div id="msgBox"></div>
  <div id="main" style="display:none">
    <div class="banner">請針對下列每一項待改善缺失，填寫<b>改善措施簡述</b>、<b>改善完成日期</b>，並<b>上傳改善後照片（1～3 張）</b>後送出回報。可以一次回報幾項、其餘之後再補；已送出的項目在海技審核前都能修改。</div>
    <div class="card">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <label>填寫人姓名 <span class="req">*</span><input type="text" id="fName" autocomplete="off"></label>
        <label>填寫人職稱 <span class="req">*</span><select id="fTitle"></select></label>
      </div>
      <div class="hint">姓名、職稱送出時會一併記錄；這台裝置下次會記得您填過的內容。</div>
    </div>
    <div id="errBox" class="errors" style="display:none"></div>
    <div id="defList"></div>
    <div id="flowNote"></div>
    <div style="margin:14px"><button class="btn primary" onclick="submitAll()">✓ 送出改善回報</button></div>
  </div>
</div>
<div class="lightbox" id="lightbox" onclick="this.style.display='none'"><img id="lightboxImg" alt=""></div>
<div id="toast"></div>
<script>
const CLOUD={url:"https://iqmbircjokdzdssouwkr.supabase.co",
  key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlxbWJpcmNqb2tkemRzc291d2tyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNDAwODIsImV4cCI6MjA5NjgxNjA4Mn0.OZ2ez6ondz49kT90gwneYUXG7CbE8iiB6PnXE5fR6iY"};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function toast(msg,err){const t=$("#toast");t.textContent=msg;t.className=err?"err":"";t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",3400);}
const H=x=>Object.assign({"apikey":CLOUD.key,"Authorization":"Bearer "+CLOUD.key,"Content-Type":"application/json"},x||{});
async function api(path,opts){const r=await fetch(`${CLOUD.url}/rest/v1/${path}`,Object.assign({headers:H()},opts||{}));if(!r.ok)throw new Error("HTTP "+r.status+" "+(await r.text()).slice(0,160));const t=await r.text();return t?JSON.parse(t):null;}
const RANK_OPTIONS=["Master船長","C/O大副","2/O二副","3/O三副","C/E輪機長","2/E大管","3/E二管","4/E三管","BSN水手長","AB幹練水手","OS普通水手","COOK廚師","FTR銅匠","OLR加油匠","PM泵匠","A.Capt.見習船長","A.C/O見習大副","A.2/O見習二副","A.3/O見習三副","A.C/E見習輪機長","A.2/E見習大管","A.3/E見習二管","A.4/E見習三管","其他(請聯繫海技新增)"];
const TYPE_LABEL={"onboard visit":"訪船","Internal audit":"內稽","ACCOMPANYING SHIP":"隨船","Cross ship visit":"交叉訪船","主題檢查":"主題檢查"};
const RID=new URLSearchParams(location.search).get("rid");
const MAX_PH=3,ID_KEY="vsm_iareply_who_v1",DRAFT_KEY="vsm_iareply_draft_"+RID;
let rec=null,replies={},drafts={};
const slash=s=>String(s||"").replace(/-/g,"/");
const dateText=r=>r.dateFrom?(slash(r.dateFrom)+(r.dateTo&&r.dateTo!==r.dateFrom?"～"+slash(r.dateTo):"")):"";
const todayIso=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
function openLightbox(u){$("#lightboxImg").src=u;$("#lightbox").style.display="flex";}
function loadDrafts(){try{drafts=JSON.parse(localStorage.getItem(DRAFT_KEY)||"{}");}catch(e){drafts={};}}
function saveDrafts(){try{localStorage.setItem(DRAFT_KEY,JSON.stringify(drafts));}catch(e){/* 照片太多存不下時只是少了離線備份，不影響送出 */}}
function who(){try{return JSON.parse(localStorage.getItem(ID_KEY)||"{}");}catch(e){return {};}}
function saveWho(){try{localStorage.setItem(ID_KEY,JSON.stringify({name:$("#fName").value.trim(),title:$("#fTitle").value}));}catch(e){}}
const pendingDefs=()=>(rec.defs||[]).map((d,i)=>({d,i})).filter(x=>x.d.closeMode!=="FLOW"&&x.d.uid);
function stateOf(d){const rp=replies[`${RID}_${d.uid}`];return rp?rp.status:"none";}
function dr(uid){return drafts[uid]||(drafts[uid]={action:"",corrected:"",evidence:"",photos:[]});}

async function init(){
  if(!RID){$("#hdrSub").textContent="連結不完整";$("#msgBox").innerHTML=`<div class="banner">找不到改善單編號，請向督導／海技索取完整連結。</div>`;return;}
  try{
    const rows=await api(`intaudit_records?id=eq.${encodeURIComponent(RID)}&select=id,payload`);
    if(!rows||!rows[0]){$("#hdrSub").textContent="找不到這張改善單";$("#msgBox").innerHTML=`<div class="banner">找不到這張改善單，可能已被刪除，請向督導／海技確認連結。</div>`;return;}
    rec=Object.assign({},rows[0].payload,{id:rows[0].id});
    const rr=await api(`intaudit_replies?record_id=eq.${encodeURIComponent(RID)}&select=id,def_uid,status,payload`);
    (rr||[]).forEach(x=>{replies[x.id]=x;});
  }catch(e){$("#hdrSub").textContent="讀取失敗";$("#msgBox").innerHTML=`<div class="banner">讀取失敗：${esc(e.message)}<br>請確認網路後重新整理，或聯絡海技。</div>`;return;}
  if(rec.draft){$("#hdrSub").textContent="這張改善單尚未發出";$("#msgBox").innerHTML=`<div class="banner">這張登錄單督導還沒有送出，請稍後再試。</div>`;return;}
  $("#hdrSub").textContent=`${rec.ship}　${dateText(rec)}　${(rec.types||[]).map(k=>TYPE_LABEL[k]||k).join("、")}　檢查人：${rec.inspector||""}　地點：${rec.psn||""}`;
  loadDrafts();
  const w=who();
  $("#fName").value=w.name||"";
  $("#fTitle").innerHTML='<option value="">— 請選擇職稱 —</option>'+RANK_OPTIONS.map(r=>`<option ${w.title===r?"selected":""}>${esc(r)}</option>`).join("");
  $("#fName").oninput=saveWho;$("#fTitle").onchange=saveWho;
  $("#main").style.display="";
  renderDefs();
}
function phHtml(uid){
  const list=dr(uid).photos,full=list.length>=MAX_PH;
  return `<div class="phs">${list.map((p,k)=>`<div class="ph"><img src="${p.dataUrl}" onclick="openLightbox(dr('${uid}').photos[${k}].dataUrl)"><button type="button" title="刪除這張照片" onclick="delPhoto('${uid}',${k})">×</button></div>`).join("")}${full?`<span class="hint">最多 ${MAX_PH} 張</span>`:`<label class="phadd">＋ 上傳<br>改善後照片<input type="file" accept="image/*" multiple style="display:none" onchange="addPhotos('${uid}',this)"></label>`}</div>`;
}
function readImg(file){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const M=1280,s=Math.min(1,M/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);res({name:file.name,dataUrl:cv.toDataURL("image/jpeg",0.8)});};img.onerror=()=>res(null);img.src=fr.result;};fr.onerror=()=>res(null);fr.readAsDataURL(file);});}
async function addPhotos(uid,input){
  const files=[...input.files];input.value="";const list=dr(uid).photos;let skip=0;
  for(const f of files){if(list.length>=MAX_PH){skip++;continue;}const p=await readImg(f);if(p)list.push(p);}
  if(skip)toast(`⚠ 每一項最多 ${MAX_PH} 張照片，已略過 ${skip} 張`,true);
  saveDrafts();renderDefs();
}
function delPhoto(uid,k){dr(uid).photos.splice(k,1);saveDrafts();renderDefs();}
function setF(uid,f,v){dr(uid)[f]=v;saveDrafts();}
function renderDefs(){
  const list=pendingDefs();
  $("#defList").innerHTML=list.length?list.map(({d,i},seq)=>{
    const st=stateOf(d),rp=replies[`${RID}_${d.uid}`],x=dr(d.uid);
    const head=`<div class="ih">待改善 No.${seq+1}　${esc(d.category||"")}
      <span class="pill ${d.closeMode==="內控"?"ic":"sys"}">${esc(d.closeMode==="內控"?"內控":"系統內結案")}</span>
      ${d.risk?`<span class="risk ${d.risk==="高"?"h":d.risk==="中"?"m":"l"}">風險 ${esc(d.risk)}</span>`:""}
      ${st==="reviewed"?`<span class="pill ok">✓ 已結案</span>`:st==="submitted"?`<span class="pill rep">已回報，待審核</span>`:st==="returned"?`<span class="pill ret">被退回，請修正後重送</span>`:""}</div>
      ${d.topic?`<div class="hint">${esc(d.topic)}</div>`:""}
      <div class="finding">${esc(d.finding||"")}</div>
      ${(d.photos||[]).length?`<div class="phs" style="margin-bottom:10px">${d.photos.map((p,k)=>`<div class="ph"><img src="${p.dataUrl}" onclick="openLightbox(rec.defs[${i}].photos[${k}].dataUrl)"></div>`).join("")}</div>`:""}`;
    if(st==="reviewed"){
      const p=rp.payload||{};
      return `<div class="card item done">${head}<div class="sub"><b>改善措施：</b>${esc(p.action||"")}\n<b>完成日期：</b>${esc(p.corrected||"")}${p.evidence?`\n<b>備註：</b>${esc(p.evidence)}`:""}</div></div>`;
    }
    // 已回報／被退回時，把已送出的內容帶回輸入框供修改（尚未開始改的草稿優先）
    if(rp&&!drafts[d.uid]){const p=rp.payload||{};drafts[d.uid]={action:p.action||"",corrected:p.corrected||"",evidence:p.evidence||"",photos:p.photos||[]};}
    const y=dr(d.uid);
    return `<div class="card item ${st==="submitted"?"wait":""}" id="def-${d.uid}">${head}
      ${st==="returned"&&rp&&rp.payload&&rp.payload.returnNote?`<div class="errors" style="margin:0 0 12px">海技退回原因：${esc(rp.payload.returnNote)}</div>`:""}
      <label>改善措施簡述 Action Brief <span class="req">*</span><textarea data-f="action" oninput="setF('${d.uid}','action',this.value)">${esc(y.action)}</textarea></label>
      <label>改善完成日期 Corrected @ <span class="req">*</span><input type="date" data-f="corrected" max="${todayIso()}" value="${esc(y.corrected)}" onchange="setF('${d.uid}','corrected',this.value)"></label>
      <label>改善完成證據／備註（選填）<textarea data-f="evidence" style="min-height:60px" oninput="setF('${d.uid}','evidence',this.value)">${esc(y.evidence)}</textarea></label>
      <div class="fld" data-f="photos">改善後照片 <span class="req">*</span>（1～${MAX_PH} 張）${phHtml(d.uid)}</div></div>`;
  }).join(""):`<div class="banner">這張改善單沒有需要船上改善的項目。</div>`;
  const flows=(rec.defs||[]).filter(d=>d.closeMode==="FLOW");
  $("#flowNote").innerHTML=flows.length?`<div class="card"><b>以下 ${flows.length} 項屬 FLOW 系統（DMP-FM01）缺失，不在這裡回報，請船上自行至 FLOW 系統填單：</b><ul style="margin:8px 0 0 18px;line-height:1.8">${flows.map(d=>`<li>${esc(d.category||"")}：${esc((d.finding||"").slice(0,80))}</li>`).join("")}</ul></div>`:"";
}
const isEmpty=x=>!x||(!x.action&&!x.corrected&&!x.evidence&&!(x.photos||[]).length);
function validate(){
  const errs=[];
  if(!$("#fName").value.trim())errs.push({msg:"填寫人姓名未填",sel:"#fName"});
  if(!$("#fTitle").value)errs.push({msg:"填寫人職稱未選",sel:"#fTitle"});
  const todo=pendingDefs().filter(({d})=>stateOf(d)!=="reviewed");
  const filled=todo.filter(({d})=>!isEmpty(drafts[d.uid]));
  if(!filled.length)errs.push({msg:"還沒有填寫任何一項改善回報",sel:"#defList"});
  todo.forEach(({d},seq)=>{
    const x=drafts[d.uid];if(isEmpty(x))return;
    const n=`待改善 No.${pendingDefs().findIndex(p=>p.d===d)+1}`,q=f=>`#def-${d.uid} [data-f="${f}"]`;
    if(!(x.action||"").trim())errs.push({msg:`${n}：「改善措施簡述」未填`,sel:q("action")});
    if(!x.corrected)errs.push({msg:`${n}：「改善完成日期」未填`,sel:q("corrected")});
    if(!(x.photos||[]).length)errs.push({msg:`${n}：請上傳至少 1 張改善後照片`,sel:q("photos")});
  });
  return errs;
}
async function submitAll(){
  document.querySelectorAll(".bad").forEach(e=>e.classList.remove("bad"));
  const errs=validate(),box=$("#errBox");
  if(errs.length){
    box.innerHTML=`<b>還有 ${errs.length} 個項目需要補齊</b><br>${errs.map(e=>"・"+esc(e.msg)).join("<br>")}`;box.style.display="";
    errs.forEach(e=>{const el=document.querySelector(e.sel);if(el)el.classList.add("bad");});
    const el=document.querySelector(errs[0].sel);(el||box).scrollIntoView({behavior:"smooth",block:"center"});
    toast(`⚠ 尚有 ${errs.length} 個項目未完成`,true);return;
  }
  box.style.display="none";
  const by=$("#fName").value.trim(),title=$("#fTitle").value,now=Date.now();
  try{
    // 送出前再讀一次最新回報狀態，避免蓋掉剛好在這段時間被海技審核結案的項目
    const rr=await api(`intaudit_replies?record_id=eq.${encodeURIComponent(RID)}&select=id,def_uid,status,payload`);
    replies={};(rr||[]).forEach(x=>{replies[x.id]=x;});
    const rows=pendingDefs().filter(({d})=>stateOf(d)!=="reviewed"&&!isEmpty(drafts[d.uid])).map(({d})=>{
      const x=drafts[d.uid];
      return {id:`${RID}_${d.uid}`,record_id:+RID,def_uid:d.uid,status:"submitted",updated_at:now,
        payload:{action:x.action.trim(),corrected:x.corrected,evidence:(x.evidence||"").trim(),photos:x.photos,by,title,at:now}};
    });
    await api("intaudit_replies?on_conflict=id",{method:"POST",headers:H({"Prefer":"resolution=merge-duplicates,return=minimal"}),body:JSON.stringify(rows)});
    rows.forEach(r=>{delete drafts[r.def_uid];});saveDrafts();
    const rr2=await api(`intaudit_replies?record_id=eq.${encodeURIComponent(RID)}&select=id,def_uid,status,payload`);
    replies={};(rr2||[]).forEach(x=>{replies[x.id]=x;});
    renderDefs();
    toast(`✓ 已送出 ${rows.length} 項改善回報，海技審核後會結案`);
    window.scrollTo({top:0,behavior:"smooth"});
  }catch(e){toast("⚠ 送出失敗："+e.message+"（請確認網路後再試，填寫內容還在）",true);}
}
init();
</script>
</body>
</html>
