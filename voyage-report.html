<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>航次報表收件 | Fleet Inspection & Deficiency Manager</title>
<style>
:root{
  --navy:#1c3a5e; --navy-2:#234a72; --navy-3:#2f6690;
  --paper:#f5f7f8; --card:#ffffff; --line:#dde4e8; --line-2:#c3ced5;
  --ink:#15262f; --ink-2:#52656f; --ink-3:#8195a0;
  --signal:#e8842c; --signal-d:#c96a14;
  --teal:#1e7f8c; --teal-l:#e3f1f3;
  --ok:#2e8b57; --warn:#d9a514; --bad:#c0392b; --bad-l:#fbeae7;
  --mono:"Consolas","Menlo","Courier New",monospace;
  --sans:"Segoe UI","Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px}
header.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
header.topbar h2{font-size:17px;font-weight:700;letter-spacing:.5px;color:var(--navy)}
header.topbar .sub{font-size:12px;color:var(--ink-3);font-family:var(--mono)}
header.topbar .spacer{flex:1}
header.topbar .role-badge{font-size:12px;color:var(--ink-2)}
header.topbar .role-badge b{color:var(--navy)}
a.back-link{font-size:12.5px;color:var(--navy-3);text-decoration:none;border:1px solid var(--line-2);border-radius:4px;padding:6px 11px;white-space:nowrap}
a.back-link:hover{background:var(--paper);border-color:var(--navy-3)}
.page{max-width:1320px;margin:0 auto;padding:18px 22px 60px}
.gate-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#1c3a5e,#2f6690);display:flex;align-items:center;justify-content:center;z-index:9999}
.gate-card{background:#fff;border-radius:12px;padding:32px 34px;width:400px;max-width:90vw;box-shadow:0 10px 40px rgba(0,0,0,.35);text-align:center}
.gate-card h2{margin:0 0 10px;font-size:18px;color:#1c3a5e}
.gate-card p{font-size:13px;color:#52656f;margin:0 0 18px;line-height:1.7}
.gate-card a.go{display:inline-block;padding:10px 22px;background:#1e7f8c;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;text-decoration:none}
.gate-card a.go:hover{background:#176470}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:#fff;color:var(--ink);padding:7px 13px;border-radius:4px;font-size:13px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.btn:hover{border-color:var(--ink-3);background:#fafbfc}
.btn.primary{background:var(--signal);border-color:var(--signal);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--signal-d)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
select,input[type=text],input[type=date],input[type=file],textarea{border:1px solid var(--line-2);border-radius:4px;padding:7px 9px;font-size:13px;font-family:var(--sans);background:#fff;color:var(--ink)}
select:focus,input:focus,textarea:focus{outline:2px solid rgba(232,132,44,.35);border-color:var(--signal)}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2);font-weight:600}
.panelbox{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px}
.mono{font-family:var(--mono);font-size:12px}
.hint{font-size:11.5px;color:var(--ink-3)}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
table.tbl th{position:sticky;top:0;z-index:5;background:var(--navy);color:#dce9f1;font-weight:600;text-align:left;padding:8px 9px;font-size:11.5px;white-space:nowrap}
table.tbl td{padding:var(--row-py,7px) var(--row-px,9px);font-size:12.5px;border-bottom:1px solid var(--line);vertical-align:top}
table.tbl tbody tr:nth-child(even)>td{background:#fbfcfd}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(12,36,51,.55);z-index:100;align-items:center;justify-content:center;padding:24px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:8px;max-width:880px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:11px 18px;border-radius:6px;font-size:13px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.3);display:none;border-left:4px solid var(--signal)}
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block !important;position:absolute;left:0;top:0;width:100%;font-family:var(--sans);color:#000}
  #printArea h1{font-size:18px;margin-bottom:4px}
  #printArea .pmeta{font-size:11px;color:#444;margin-bottom:12px;border-bottom:2px solid #000;padding-bottom:6px}
  #printArea table{width:100%;border-collapse:collapse;font-size:10.5px}
  #printArea th,#printArea td{border:1px solid #888;padding:4px 6px;vertical-align:top;text-align:left}
  #printArea th{background:#e8e8e8}
}
@media(max-width:820px){
  .page{padding:12px 12px 40px}
  header.topbar{padding:10px 12px}
  table.tbl{display:block;overflow-x:auto}
}
</style>
</head>
<body>

<div class="gate-overlay" id="gateOverlay">
  <div class="gate-card">
    <h2>📮 航次報表收件</h2>
    <p id="gateMsg">正在確認登入狀態…</p>
    <a class="go" id="gateBackLink" href="index.html">↩ 前往主系統登入</a>
  </div>
</div>

<div id="appRoot" style="display:none">
<header class="topbar">
  <h2>📮 航次報表收件</h2>
  <span class="sub">DCP-FM03 船上上傳 → 督導確認即完成</span>
  <span class="spacer"></span>
  <span class="role-badge" id="roleBadge"></span>
  <a class="back-link" href="index.html">↩ 返回主系統</a>
</header>

<div class="page">
  <div id="voy-tabs" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center"></div>
  <div id="voy-body"></div>
</div>
</div>

<div class="modal-bg" id="voyAttachModal">
  <div class="modal" style="max-width:480px">
    <div style="padding:18px 20px">
      <h3 id="voyattach-title" style="margin:0 0 4px;font-size:16px;color:var(--navy)">附件</h3>
      <div id="voyattach-info" class="hint" style="margin-bottom:12px"></div>
      <div id="voyattach-files" style="font-size:14px;line-height:2"></div>
      <div style="display:flex;justify-content:flex-end;margin-top:16px">
        <button class="btn" onclick="document.getElementById('voyAttachModal').classList.remove('show')">關閉</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-bg" id="voyCatEditModal">
  <div class="modal" style="max-width:560px">
    <div style="padding:18px 20px">
      <h3 id="voycat-title" style="margin:0 0 14px;font-size:16px;color:var(--navy)">編輯表單</h3>
      <div class="fgrid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px 14px">
        <label>表單編號<input type="text" id="voycat-code" placeholder="如 TDP-FM17"></label>
        <label>適用船型
          <select id="voycat-vtype">
            <option value="all">全部適用</option>
            <option value="tanker">僅 TANKER</option>
            <option value="bulk">僅 BULK</option>
          </select>
        </label>
        <label style="grid-column:1/-1">表單名稱<input type="text" id="voycat-name" placeholder="如 滅火演練報告"></label>
        <label>寄送週期
          <select id="voycat-freq">
            <option value="m">每月</option>
            <option value="q">每季</option>
            <option value="e2m">每二個月</option>
            <option value="h6">每六個月</option>
            <option value="y">年度</option>
            <option value="june">每年6月</option>
            <option value="event">事故時／發生時</option>
          </select>
        </label>
        <label>船上負責人<input type="text" id="voycat-pic" list="dl-roster-names" placeholder="如 船長"></label>
        <label>收件人<input type="text" id="voycat-sendto" list="dl-roster-names" placeholder="如 柯香吟"></label>
        <label>副本<input type="text" id="voycat-cc" list="dl-roster-names" placeholder="可空白"></label>
        <label style="grid-column:1/-1">備註<input type="text" id="voycat-note" placeholder="可空白"></label>
        <label style="grid-column:1/-1"><input type="checkbox" id="voycat-active" style="width:auto;margin-right:6px"> 啟用（船上「船上上傳」頁會顯示此表單）</label>
      </div>
      <div class="hint" style="margin-top:4px">收件人／副本／船上負責人可從系統人員清單選取，也可保留部門代稱（如「船東督導」）等原文字。</div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
        <button class="btn" onclick="document.getElementById('voyCatEditModal').classList.remove('show')">取消</button>
        <button class="btn primary" onclick="VoyRecv.saveCatModal()">💾 儲存</button>
      </div>
    </div>
  </div>
</div>
<datalist id="dl-roster-names"></datalist>

<div class="modal-bg" id="voyUploadModal">
  <div class="modal" style="max-width:520px">
    <div style="padding:18px 20px">
      <h3 id="voyup-title" style="margin:0 0 4px;font-size:16px;color:var(--navy)">上傳</h3>
      <div id="voyup-info" class="hint" style="margin-bottom:12px"></div>
      <label style="display:block;margin-bottom:10px;font-size:13px">文件日期（實際發生／演習日期，非上傳日）<br>
        <input type="date" id="voyup-docdate" style="margin-top:4px">
      </label>
      <div id="voyup-checklist-wrap" style="display:none;margin-bottom:10px;padding:10px;background:var(--paper);border:1px solid var(--line);border-radius:6px">
        <div style="font-size:13px;font-weight:700;margin-bottom:6px">⚠ 請一併勾選本次使用的檢查表，並把該檢查表與所有往來信件一起選入下方檔案一起上傳（可複選、可多檔）：</div>
        <div id="voyup-checklist-list" style="max-height:160px;overflow:auto;font-size:13px;line-height:1.9"></div>
      </div>
      <div style="margin-bottom:10px"><input type="file" id="voyup-file" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.zip"></div>
      <div style="margin-bottom:12px"><input type="text" id="voyup-note" placeholder="備註（選填，如航次編號 Ref. No.）" style="width:100%"></div>
      <div class="hint" style="margin-bottom:12px">單檔上限 25MB；可一次選多個檔案。上傳後由督導確認即完成。</div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn" onclick="document.getElementById('voyUploadModal').classList.remove('show')">取消</button>
        <button class="btn primary" id="voyup-go" onclick="VoyRecv.confirmUpload()">⬆ 上傳</button>
      </div>
    </div>
  </div>
</div>

<div id="printArea"></div>
<div class="toast" id="toast"></div>

/* ════════ 📮 航次報表收件（DCP-FM03 海技部分）════════
   船上上傳 → 督導確認 三階段收件管理（歸檔步驟已停用，比照主系統流程）。
   檔案儲存採 VoyFiles 轉接層，實作為 Supabase Storage。
   收件紀錄逐筆合併同步（voy_submissions 資料表，gid 唯一鍵），
   避免多艘船同時上傳時整包互相覆蓋。 */
const VoyFiles={
  BUCKET:"voyage-files",
  MAX_MB:25,
  enabled(){return true;},
  _encKey(key){return key.split("/").map(encodeURIComponent).join("/");},
  safeExt(filename){
    const dot=filename.lastIndexOf(".");
    if(dot<0)return"";
    const e=filename.slice(dot).toLowerCase().replace(/[^a-z0-9.]/g,"");
    return (e.length>1&&e.length<=10)?e:"";
  },
  async sha256hexBuf(buf){
    try{
      if(window.crypto&&crypto.subtle){
        const b=await crypto.subtle.digest("SHA-256",buf);
        return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
      }
    }catch(e){}
    return "";
  },
  async put(file,prefix){
    if(file.size>this.MAX_MB*1024*1024)throw new Error(`檔案超過 ${this.MAX_MB}MB 上限，請壓縮或分割後再上傳`);
    const buf=await file.arrayBuffer();
    const sha=await this.sha256hexBuf(buf);
    const rand=Math.random().toString(36).slice(2,8);
    const key=`${prefix}/${Date.now()}_${rand}${this.safeExt(file.name)}`;
    const r=await fetch(CLOUD_URL+"/storage/v1/object/"+this.BUCKET+"/"+this._encKey(key),{
      method:"POST",
      headers:{"apikey":CLOUD_KEY,"Authorization":"Bearer "+CLOUD_KEY,"Content-Type":file.type||"application/octet-stream","x-upsert":"false"},
      body:buf
    });
    if(!r.ok){
      const tx=(await r.text()).slice(0,150);
      if(r.status===404||tx.includes("Bucket not found"))throw new Error("找不到儲存桶 voyage-files，請維護者依「雲端設定說明」在 Supabase 建立");
      throw new Error("上傳失敗 HTTP "+r.status+"："+tx);
    }
    return {key,name:file.name,size:file.size,sha256:sha};
  },
  url(key){return CLOUD_URL+"/storage/v1/object/public/"+this.BUCKET+"/"+this._encKey(key);},
  async remove(key){
    try{await fetch(CLOUD_URL+"/storage/v1/object/"+this.BUCKET+"/"+this._encKey(key),{method:"DELETE",headers:{"apikey":CLOUD_KEY,"Authorization":"Bearer "+CLOUD_KEY}});}catch(e){console.warn("voy file remove",e);}
  }
};

  shipList(){return SHIPINFO.map(s=>({code:s.code,name:s.name}));},
  init(){
    const SEED_VER=this.CAT_SEED_VER;
    try{this.cat=JSON.parse(localStorage.getItem(this.LSK_CAT)||"[]");}catch(e){this.cat=[];}
    const curVer=localStorage.getItem(this.LSK_CAT+"_ver");

      try{this.cat=JSON.parse(document.getElementById("voycat-seed").textContent);localStorage.setItem(this.LSK_CAT+"_ver",SEED_VER);}catch(e){}
    }
    try{this.checklists=JSON.parse(document.getElementById("voycat-checklists-seed").textContent);}catch(e){this.checklists={tanker:[],bulk:[]};}
    try{const s=localStorage.getItem(this.LSK_SUB);this.subs=s?JSON.parse(s):[];}catch(e){this.subs=[];}
    let migrated=false;
    this.subs.forEach(s=>{
      if(!this.cat.some(c=>c.id===s.catId)&&s.code){
        const m=this.cat.find(c=>c.code===s.code);
        if(m){s.catId=m.id;migrated=true;}
      }
    });
    if(migrated)this.persist();
    if(this.isShip()){this.upTargetShip=this.myShipCode();this.mShip=this.myShipCode();}
    else{const ships=this.shipList();this.upTargetShip=ships.length?ships[0].code:"";this.mShip=this.upTargetShip;}
    if(this.cat.length&&!this.mForm)this.mForm=String(this.cat.find(c=>c.freq!=="event")?.id||"");
  },
  persist(){
    try{
      localStorage.setItem(this.LSK_CAT,JSON.stringify(this.cat));
      localStorage.setItem(this.LSK_SUB,JSON.stringify(this.subs));
    }catch(e){toast("⚠ 本機儲存空間不足");}
  },
  uuid(){return (crypto&&crypto.randomUUID)?crypto.randomUUID():"v"+Date.now()+"-"+Math.random().toString(36).slice(2,10);},
  pad2(n){return String(n).padStart(2,"0");},
  periodsOf(freq,year){
    const P=[];
    if(freq==="m")for(let m=1;m<=12;m++)P.push({id:`${year}-${this.pad2(m)}`,label:`${m}月`,endM:m});
    else if(freq==="q")for(let q=1;q<=4;q++)P.push({id:`${year}-Q${q}`,label:`第${q}季`,endM:q*3});
    else if(freq==="e2m")for(let b=1;b<=6;b++)P.push({id:`${year}-B${b}`,label:`${b*2-1}–${b*2}月`,endM:b*2});
    else if(freq==="h6")for(let b=1;b<=2;b++)P.push({id:`${year}-H${b}`,label:`${b*6-5}–${b*6}月`,endM:b*6});
    else if(freq==="y")P.push({id:`${year}`,label:`${year}年度`,endM:12});
    else if(freq==="june")P.push({id:`${year}-06`,label:`${year}年6月`,endM:6});
    return P;
  },
  periodEnd(freq,year,endM){return new Date(year,endM,0);},
  dueDate(freq,year,endM){const d=this.periodEnd(freq,year,endM);d.setDate(d.getDate()+this.GRACE_DAYS);return d;},
  currentPeriod(freq){
    const now=new Date(),y=now.getFullYear();
    const P=this.periodsOf(freq,y);
    for(const p of P){if(now<=this.dueDate(freq,y,p.endM))return Object.assign({year:y},p);}
    return Object.assign({year:y},P[P.length-1]);
  },
  periodYear(pid){return parseInt(String(pid).slice(0,4),10);},
  findSub(ship,catId,pid){return this.subs.find(s=>s.ship===ship&&s.catId===catId&&s.period===pid&&s.status!=="rej");},
  touch(rec){rec.updated=Date.now();this.persist();this.pushRec(rec);},
  async pushRec(rec){
    try{
      await Cloud.api(this.TABLE+"?on_conflict=gid",{method:"POST",headers:{"Prefer":"resolution=merge-duplicates"},body:JSON.stringify([{gid:rec.gid,ship:rec.ship,updated:rec.updated,payload:rec}])});
      this.cloudState("☁ 已同步 "+new Date().toLocaleTimeString());
    }catch(e){
      this.cloudState("⚠ 同步失敗，紀錄暫存本機");
      console.warn("voy push",e);
      toast("⚠ 收件紀錄同步失敗（"+e.message.slice(0,60)+"），已存本機，恢復連線後請按「同步」");
    }
  },
  async syncCloud(silent){
    this.cloudState("☁ 同步中…");
    try{
      const remote=await Cloud.api(this.TABLE+"?select=gid,updated,payload")||[];
      const local=new Map(this.subs.map(r=>[r.gid,r]));
      let pulled=0;
      remote.forEach(r=>{
        const lt=local.get(r.gid);
        if(!lt){const rec=r.payload;rec.gid=r.gid;this.subs.push(rec);pulled++;}
        else if((r.updated||0)>(lt.updated||0)){Object.assign(lt,r.payload,{gid:r.gid});pulled++;}
      });
      const rows=this.subs.map(r=>({gid:r.gid,ship:r.ship,updated:r.updated||Date.now(),payload:r}));
      if(rows.length)await Cloud.api(this.TABLE+"?on_conflict=gid",{method:"POST",headers:{"Prefer":"resolution=merge-duplicates"},body:JSON.stringify(rows)});
      this.persist();
      this.cloudState("☁ 已同步 "+new Date().toLocaleTimeString());
      if(!silent)toast(`☁ 收件同步完成：更新 ${pulled} 筆／共 ${this.subs.length} 筆`);
      this.render();
    }catch(e){
      this.cloudState("⚠ 同步失敗");
      if(!silent){
        if(e.message.includes("404")||e.message.includes("relation"))toast("⚠ 尚未建立 voy_submissions 資料表，請維護者展開「雲端設定說明」完成建置");
        else toast("⚠ 同步失敗："+e.message.slice(0,80));
      }
    }
  },
  async loadCatCloud(){

        this.cat=cloudItems;

  cloudState(s){const el=$("#voy-cloudstate");if(el)el.textContent=s;},
  openUpload(catId,pid,plabel,defaultDocDate){

  reupload(gid){

    if(r.status!=="up"){toast("⚠ 此筆已經督導確認，無法直接覆蓋，請改用「退回」後再重新上傳");return;}
    const mine=this.isShip()&&r.ship===this.myShipCode();
    if(!mine&&!this.isTech()){toast("⚠ 僅本船帳號或維護者可重新上傳此筆");return;}
    const c=this.cat.find(x=>x.id===r.catId)||{};
    $("#voyup-title").textContent=`重新上傳（將覆蓋原檔案）：${c.code||r.code?(c.code||r.code)+" ":""}${c.name||r.name}`;
    $("#voyup-info").textContent=`${this.shipName(r.ship)}（${r.ship}）｜期別：${r.periodLabel||r.period}｜原檔案：${(r.files||[]).map(f=>f.name).join("、")||"（無）"}`;

  genFileName(shipCode,docDate,code,idx,total,ext){
    const ymd=(docDate||"").replace(/-/g,"");
    const base=`${shipCode}-${ymd}-${(code||"未編號").replace(/[\\/:*?"<>|#%&{}\s]+/g,"_")}`;

  },
  async confirmUpload(){
    if(writeBlocked())return;
    const p=this._pendingUp;if(!p)return;
    const fi=$("#voyup-file");
    if(!fi.files||!fi.files.length){toast("⚠ 請選擇檔案");return;}
    const docDate=$("#voyup-docdate").value;
    if(!docDate){toast("⚠ 請填寫文件日期（實際發生／演習日期）");return;}
    const c=this.cat.find(x=>x.id===p.catId)||{};
    let checklists=null;
    if(c.needsChecklist){
      checklists=[...document.querySelectorAll("#voyup-checklist-list input:checked")].map(el=>el.value);
      if(!checklists.length&&!confirm("尚未勾選任何 SOPEP 檢查表，確定這次不需要一併上傳任何檢查表嗎？"))return;
    }
    const btn=$("#voyup-go");btn.disabled=true;btn.textContent="上傳中…";
    try{
      const fileList=[...fi.files];
      const files=[];
      for(let i=0;i<fileList.length;i++){
        const f=fileList[i];
        const meta=await VoyFiles.put(f,`${p.ship}/${p.pid}`);
        const dot=f.name.lastIndexOf(".");const ext=dot>0?f.name.slice(dot).toLowerCase():"";
        meta.name=this.genFileName(p.ship,docDate,c.code,i,fileList.length,ext);
        files.push(meta);
      }
      const who=Role.personName()||"未具名";
      if(p.replaceGid){
        const rec=this.subs.find(x=>x.gid===p.replaceGid);
        if(!rec){toast("⚠ 找不到原紀錄，可能已被異動，請重新整理後再試");return;}
        if(rec.status!=="up"){toast("⚠ 此筆狀態已變更（可能已被督導確認），無法覆蓋，請重新整理後確認");this.render();return;}
        const oldFiles=rec.files||[];
        rec.files=files;rec.note=($("#voyup-note").value||"").trim();rec.docDate=docDate;
        if(checklists)rec.checklists=checklists;
        rec.upBy=who;rec.upAt=Date.now();rec.updated=Date.now();
        this.persist();
        await this.pushRec(rec);
        for(const f of oldFiles)await VoyFiles.remove(f.key);
        Audit.log("重新上傳","航次報表收件",`${p.ship} ${c.code||rec.code||""} ${p.pid}（覆蓋原檔案，共${files.length}檔）`);
        toast("✓ 已覆蓋原上傳檔案，等待督導確認");
      }else{
        const rec={gid:this.uuid(),ship:p.ship,shipName:this.shipName(p.ship),catId:p.catId,code:c.code||"",name:c.name||"",period:p.pid,periodLabel:p.plabel||p.pid,
          files,note:($("#voyup-note").value||"").trim(),docDate,status:"up",upBy:who,upAt:Date.now(),updated:Date.now()};
        if(checklists)rec.checklists=checklists;
        this.subs.push(rec);
        this.persist();
        await this.pushRec(rec);
        Audit.log("上傳","航次報表收件",`${p.ship} ${c.code||c.name} ${p.pid}（${files.length}檔）`);
        toast("✓ 已上傳，等待督導確認");
      }
      $("#voyUploadModal").classList.remove("show");
      this.render();
    }catch(e){toast("⚠ "+e.message);}

    if(!this.canConfirm(r)){toast("⚠ 僅該船指派的甲板督導／機艙督導本人或維護者可確認此筆");return;}

  },
  async archConfirm(gid){

    const r=this.subs.find(x=>x.gid===gid);if(!r)return;

  async reject(gid){

  async delRec(gid){
    if(writeBlocked())return;
    const r=this.subs.find(x=>x.gid===gid);if(!r)return;
    const mine=this.isShip()&&r.ship===this.myShipCode()&&r.status==="up";
    if(!mine&&!this.isTech()){toast("⚠ 僅可刪除本船「尚未確認」的紀錄；其餘僅海技可刪");return;}
    if(!confirm(`刪除此筆紀錄與已上傳檔案？\n${r.ship} ${r.code||r.name} ${r.period}`))return;
    for(const f of (r.files||[]))await VoyFiles.remove(f.key);
    this.subs=this.subs.filter(x=>x.gid!==gid);
    this.persist();
    try{await Cloud.api(this.TABLE+"?gid=eq."+encodeURIComponent(gid),{method:"DELETE"});}catch(e){console.warn("voy del",e);}
    Audit.log("刪除","航次報表收件",`${r.ship} ${r.code||r.name} ${r.period}`);
    toast("已刪除");this.render();
  },
  setView(v,btn){

  },
  statusChip(st,overdue){

  },
  fileLinks(r){

  },
  showAttachments(gid){
    const r=this.subs.find(x=>x.gid===gid);if(!r)return;
    $("#voyattach-title").textContent=`${r.code?r.code+" ":""}${r.name||""}`;
    $("#voyattach-info").textContent=`${this.shipName(r.ship)}（${r.ship}）｜期別：${r.periodLabel||r.period}｜文件日期：${r.docDate||"—"}｜${this.STATUS[r.status]?this.STATUS[r.status][0]:r.status}`;

  render(){
    const host=$("#voy-body");if(!host)return;
    const tabs=[["upload","📤 船上上傳",true],["review","🔍 收件審核",this.isSup()],["matrix","📊 應繳矩陣",true],["catalog","⚙ 表單目錄",this.isTech()]];
    $("#voy-tabs").innerHTML=tabs.filter(t=>t[2]).map(t=>`<button class="btn${this.view===t[0]?" primary":""}" onclick="VoyRecv.setView('${t[0]}',this)">${t[1]}</button>`).join("")
      +`<button class="btn" style="margin-left:auto" onclick="VoyRecv.syncCloud()">☁ 同步</button><span id="voy-cloudstate" class="hint" style="align-self:center"></span>`;
    if(this.view==="review"&&!this.isSup())this.view="upload";
    if(this.view==="catalog"&&!this.isTech())this.view="upload";
    if(this.view==="upload")this.renderUpload(host);
    else if(this.view==="review")this.renderReview(host);

  },
  renderUpload(host){
    const ship=this.isShip()?this.myShipCode():this.upTargetShip;
    const shipSel=this.isShip()
      ?`<b>${esc(this.shipName(ship))}（${esc(ship)}）</b>`
      :`<select onchange="VoyRecv.upTargetShip=this.value;VoyRecv.render()">${this.shipList().map(s=>`<option value="${esc(s.code)}"${s.code===this.upTargetShip?" selected":""}>${esc(s.name)}（${esc(s.code)}）</option>`).join("")}</select>`;
    const routine=this.visibleCat(ship).filter(c=>c.active&&c.freq!=="event");
    const now=new Date();
    let items=[];
    routine.forEach(c=>{
      const cur=this.currentPeriod(c.freq);
      const allP=this.periodsOf(c.freq,cur.year).map(p=>Object.assign({year:cur.year},p));
      const backlog=allP.filter(p=>{
        if(p.id===cur.id)return false;
        const due=this.dueDate(c.freq,p.year,p.endM);
        if(now<=due)return false;
        return !this.findSub(ship,c.id,p.id);
      });
      [...backlog,cur].forEach(p=>{
        const sub=this.findSub(ship,c.id,p.id);
        const due=this.dueDate(c.freq,p.year,p.endM);
        const overdue=!sub&&now>due;
        const unsubmitted=!sub||sub.status==="rej";
        items.push({c,p,sub,due,overdue,unsubmitted,cat:this.catPrefix(c.code)});
      });
    });
    const catCounts={};
    items.forEach(it=>{if(it.unsubmitted)catCounts[it.cat]=(catCounts[it.cat]||0)+1;});
    const cats=[...new Set(items.map(it=>it.cat))].sort();
    if(this.upCatFilter&&!cats.includes(this.upCatFilter))this.upCatFilter="";
    const filtered=this.upCatFilter?items.filter(it=>it.cat===this.upCatFilter):items;
    const catChips=`<button class="btn sm${this.upCatFilter?"":" primary"}" onclick="VoyRecv.upCatFilter='';VoyRecv.render()">全部${cats.length?` (${Object.values(catCounts).reduce((a,b)=>a+b,0)})`:""}</button>`
      +cats.map(cat=>`<button class="btn sm${this.upCatFilter===cat?" primary":""}" onclick="VoyRecv.upCatFilter='${esc(cat)}';VoyRecv.render()">${esc(cat)}${catCounts[cat]?` (${catCounts[cat]})`:""}</button>`).join("");
    const rows=filtered.map(({c,p,sub,due,overdue,cat})=>{
      const lastRej=this.subs.filter(s=>s.ship===ship&&s.catId===c.id&&s.period===p.id&&s.status==="rej").sort((a,b)=>b.rejAt-a.rejAt)[0];
      return `<tr${overdue?' style="background:var(--bad-l)"':""}>
        <td class="mono">${esc(c.code)}</td>
        <td>${esc(c.name)}${c.note?`<div class="hint">${esc(c.note)}</div>`:""}${lastRej?`<div style="color:var(--bad);font-size:12px">↩ 退回：${esc(lastRej.rejReason||"（未填原因）")}（${esc(lastRej.rejBy||"")}）</div>`:""}${overdue?`<div style="color:var(--bad);font-size:11.5px">⚠ 補繳：此份已逾期，上傳後請留意督導確認時效</div>`:""}</td>
        <td>${this.FREQ_ZH[c.freq]||c.freq}</td>
        <td>${esc(p.label)}<div class="hint">截止 ${due.getMonth()+1}/${due.getDate()}</div></td>
        <td>${this.statusChip(sub?sub.status:"",overdue)}${sub&&sub.files?`<div style="font-size:11px">${this.fileLinks(sub)}</div>`:""}</td>
        <td>${!sub?`<button class="btn sm" onclick="VoyRecv.openUpload(${c.id},'${esc(p.id)}','${esc(p.label)}')">⬆ 上傳</button>`
          :sub.status==="rej"?`<button class="btn sm" onclick="VoyRecv.openUpload(${c.id},'${esc(p.id)}','${esc(p.label)}')">⬆ 上傳</button>`
          :sub.status==="up"?`<button class="btn sm" onclick="VoyRecv.reupload('${sub.gid}')">🔄 重新上傳</button>`
          :""}</td>
      </tr>`;
    }).join("");
    const hist=this.subs.filter(s=>s.ship===ship).sort((a,b)=>(b.upAt||0)-(a.upAt||0)).slice(0,60);
    host.innerHTML=`
      <div class="panelbox" style="margin-bottom:14px">
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
          <span>船舶：</span>${shipSel}
          <span class="hint">例行表單依寄送週期自動列出本期應繳項目；若有先前積欠未繳的期別也會一併列出供補繳；逾期（期末＋${this.GRACE_DAYS}日）標紅。</span>
          <button class="btn sm" style="margin-left:auto" onclick="VoyRecv.exportChecklistPrint('${esc(ship)}')">📄 匯出PDF清單</button>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${catChips}</div>
        <table class="tbl">
          <thead><tr><th style="width:110px">編號</th><th>表單</th><th style="width:90px">週期</th><th style="width:110px">期別</th><th style="width:170px">狀態</th><th style="width:90px">動作</th></tr></thead>
          <tbody>${rows||`<tr><td colspan="6" class="hint">（此分類目前沒有項目）</td></tr>`}</tbody>
        </table>
      </div>
      <div class="panelbox">
        <b>本船收件紀錄</b>（近 60 筆）
        <table class="tbl" style="margin-top:8px">
          <thead><tr><th>表單</th><th style="width:120px">期別</th><th style="width:90px">文件日期</th><th style="width:130px">狀態</th><th>檔案</th><th style="width:110px">上傳日</th><th style="width:70px"></th></tr></thead>
          <tbody>${hist.map(r=>`<tr>
            <td><span class="mono">${esc(r.code)}</span> ${esc(r.name)}${r.status==="rej"?`<div style="color:var(--bad);font-size:12px">退回原因：${esc(r.rejReason||"")}</div>`:""}</td>
            <td>${esc(r.periodLabel||r.period)}</td>
            <td class="hint">${esc(r.docDate||"—")}</td>
            <td>${this.statusChip(r.status)}</td>
            <td style="font-size:11px">${this.fileLinks(r)}</td>
            <td class="hint">${r.upAt?new Date(r.upAt).toLocaleDateString():""}<br>${esc(r.upBy||"")}</td>
            <td>${r.status==="up"?`<button class="btn sm" onclick="VoyRecv.reupload('${r.gid}')">🔄</button> `:""}${(r.status==="up"&&this.isShip())||this.isTech()?`<button class="btn sm" onclick="VoyRecv.delRec('${r.gid}')">🗑</button>`:""}</td>
          </tr>`).join("")||`<tr><td colspan="7" class="hint">（尚無紀錄）</td></tr>`}</tbody>
        </table>
      </div>`;
  },
  renderReview(host){
    const years=[...new Set(this.subs.map(s=>this.periodYear(s.period)))].sort().reverse();
    if(!years.includes(this.fYear))this.fYear=years[0]||new Date().getFullYear();
    let list=this.subs.filter(s=>this.periodYear(s.period)===this.fYear);
    if(this.fShip)list=list.filter(s=>s.ship===this.fShip);
    if(this.fStatus)list=list.filter(s=>this.fStatus==="done"?(s.status==="sup"||s.status==="arch"):s.status===this.fStatus);
    list.sort((a,b)=>(b.upAt||0)-(a.upAt||0));
    const pendSup=this.subs.filter(s=>s.status==="up");
    const done=this.subs.filter(s=>s.status==="sup"||s.status==="arch").length;
    const now=Date.now();
    const overdueWaiting=pendSup.filter(s=>{const c=this.cat.find(x=>x.id===s.catId);if(!c)return false;const y=this.periodYear(s.period);const p=this.periodsOf(c.freq,y).find(p=>p.id===s.period);if(!p)return false;return now>this.dueDate(c.freq,y,p.endM).getTime();}).length;
    host.innerHTML=`
      <div class="panelbox" style="margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <b>待督導確認 <span style="color:var(--navy-3)">${pendSup.length}</span> 筆・已完成 <span style="color:var(--ok)">${done}</span> 筆</b>
        ${overdueWaiting>0?`<span style="color:var(--bad);font-weight:700">⚠ 其中 ${overdueWaiting} 筆已逾期仍待督導確認，請提醒督導盡快處理</span>`:""}
        <span style="margin-left:auto">年度</span>
        <select onchange="VoyRecv.fYear=parseInt(this.value);VoyRecv.render()">${(years.length?years:[this.fYear]).map(y=>`<option${y===this.fYear?" selected":""}>${y}</option>`).join("")}</select>
        <span>船舶</span>
        <select onchange="VoyRecv.fShip=this.value;VoyRecv.render()"><option value="">全部</option>${this.shipList().map(s=>`<option value="${esc(s.code)}"${s.code===this.fShip?" selected":""}>${esc(s.name)}</option>`).join("")}</select>
        <span>狀態</span>
        <select onchange="VoyRecv.fStatus=this.value;VoyRecv.render()"><option value="">全部</option><option value="up"${this.fStatus==="up"?" selected":""}>船上已上傳</option><option value="done"${this.fStatus==="done"?" selected":""}>已完成</option><option value="rej"${this.fStatus==="rej"?" selected":""}>已退回</option></select>
      </div>
      <table class="tbl">
        <thead><tr><th style="width:130px">船舶</th><th>表單</th><th style="width:110px">期別</th><th style="width:95px">文件日期</th><th>檔案</th><th style="width:150px">上傳／確認</th><th style="width:130px">狀態</th><th style="width:190px">動作</th></tr></thead>
        <tbody>${list.map(r=>{
          const c=this.cat.find(x=>x.id===r.catId);
          const checklistNames=r.checklists&&c&&this.checklists[c.checklistSet]?r.checklists.map(cc=>{const f=this.checklists[c.checklistSet].find(o=>o.code===cc);return f?f.code:cc;}).join("、"):"";
          return `<tr>
          <td>${esc(r.shipName||r.ship)}<div class="hint mono">${esc(r.ship)}</div></td>
          <td><span class="mono">${esc(r.code)}</span> ${esc(r.name)}${r.note?`<div class="hint">${esc(r.note)}</div>`:""}${checklistNames?`<div class="hint">附檢查表：${esc(checklistNames)}</div>`:""}${r.rejReason?`<div style="color:var(--bad);font-size:12px">退回原因：${esc(r.rejReason)}</div>`:""}</td>
          <td>${esc(r.periodLabel||r.period)}</td>
          <td class="hint">${esc(r.docDate||"—")}</td>
          <td style="font-size:11px">${this.fileLinks(r)}</td>
          <td class="hint">⬆ ${esc(r.upBy||"")} ${r.upAt?new Date(r.upAt).toLocaleDateString():""}${r.supBy?`<br>✔ ${esc(r.supBy)} ${new Date(r.supAt).toLocaleDateString()}`:""}</td>
          <td>${this.statusChip(r.status)}</td>
          <td>
            ${r.status==="up"?(this.canConfirm(r)?`<button class="btn sm" onclick="VoyRecv.supConfirm('${r.gid}')">☑ 督導確認（即完成）</button>`:(()=>{const s=SHIPINFO.find(x=>x.code===r.ship);const names=[s&&s.deckSup,s&&s.engineSup].filter(Boolean).join("／");return `<span class="hint" title="僅該船指派的督導本人或維護者可確認">🔒 待${esc(names||"指派督導")}確認</span>`;})()):""}
            ${r.status!=="arch"&&r.status!=="rej"&&this.canReject(r)?`<button class="btn sm" style="color:var(--bad)" onclick="VoyRecv.reject('${r.gid}')">↩ 退回</button>`:""}
            ${this.isTech()?`<button class="btn sm" onclick="VoyRecv.delRec('${r.gid}')">🗑</button>`:""}
          </td>
        </tr>`;}).join("")||`<tr><td colspan="8" class="hint">（無符合條件的紀錄）</td></tr>`}</tbody>
      </table>`;
  },
  renderMatrix(host){
    const yearOpts=[];const ty=new Date().getFullYear();for(let y=ty+1;y>=ty-3;y--)yearOpts.push(y);
    const allRoutine=this.cat.filter(c=>c.active&&c.freq!=="event");
    const ships=this.isShip()?this.shipList().filter(s=>s.code===this.myShipCode()):this.shipList();
    const modeSel=this.isShip()?"":`
      <label><input type="radio" name="voy-mmode" value="ship"${this.mMode==="ship"?" checked":""} onchange="VoyRecv.mMode='ship';VoyRecv.render()"> 依船（表單×月份）</label>
      <label><input type="radio" name="voy-mmode" value="form"${this.mMode==="form"?" checked":""} onchange="VoyRecv.mMode='form';VoyRecv.render()"> 依表單（船×月份）</label>`;
    const now=new Date();
    const cell=(ship,c,p,year)=>{
      const sub=this.findSub(ship,c.id,p.id);
      const due=this.dueDate(c.freq,year,p.endM);
      const overdue=!sub&&now>due;
      const future=now<this.periodEnd(c.freq,year,p.endM)&&!sub;
      let sym="○",color="var(--ink-3)",tip="未繳";
      if(sub){
        if(sub.status==="up"){sym="⬆";color="#2f6690";tip="船上已上傳";}
        else if(sub.status==="sup"||sub.status==="arch"){sym="✔";color="var(--ok)";tip="已完成";}
      }else if(overdue){sym="✖";color="var(--bad)";tip="逾期未繳";}
      else if(future){sym="·";color="var(--line-2)";tip="未到期";}
      const clickable=sub&&sub.files&&sub.files.length;
      const symHtml=clickable
        ?`<div style="font-weight:700;font-size:14px;cursor:pointer;text-decoration:underline" onclick="VoyRecv.showAttachments('${sub.gid}')">${sym}</div>`
        :`<div style="font-weight:700;font-size:14px">${sym}</div>`;
      return `<td style="text-align:center;color:${color};padding:6px 3px;cursor:default" title="${esc(tip)} ${esc(p.label)}${clickable?"（點擊查看附件）":""}">
        ${symHtml}
        <div style="font-size:9.5px;color:var(--ink-3);white-space:nowrap">${esc(p.label)}</div>
      </td>`;
    };
    let body="";
    const year=this.mYear;
    const legend=`<div class="hint" style="margin-top:6px">· 未到期　○ 未繳　<span style="color:#2f6690">⬆ 已上傳</span>　<span style="color:var(--ok)">✔ 已完成（督導確認）</span>　<span style="color:var(--bad)">✖ 逾期</span>　（有底線的符號可點擊查看附件）</div>`;
    if(this.mMode==="form"&&!this.isShip()){
      const c=allRoutine.find(x=>String(x.id)===String(this.mForm))||allRoutine[0];
      if(c){
        const P=this.periodsOf(c.freq,year);
        const shipsForForm=c.vtype==="all"?ships:ships.filter(s=>this.shipVtype(s.code)===c.vtype);
        body=`<div style="margin:8px 0">表單：<select onchange="VoyRecv.mForm=this.value;VoyRecv.render()" style="max-width:420px">${allRoutine.map(x=>`<option value="${x.id}"${x.id===c.id?" selected":""}>${esc(x.code)} ${esc(x.name)}${x.vtype!=="all"?"（"+(x.vtype==="tanker"?"TANKER":"BULK")+"）":""}</option>`).join("")}</select> <span class="hint">${this.FREQ_ZH[c.freq]}</span></div>
        <div style="overflow:auto"><table class="tbl"><thead><tr><th style="min-width:140px">船舶</th>${P.map(p=>`<th style="text-align:center">${esc(p.label)}</th>`).join("")}</tr></thead>
        <tbody>${shipsForForm.map(s=>`<tr><td>${esc(s.name)}<span class="hint mono"> ${esc(s.code)}</span></td>${P.map(p=>cell(s.code,c,p,year)).join("")}</tr>`).join("")||`<tr><td colspan="${P.length+1}" class="hint">（此表單船型不適用於任何目前的船舶）</td></tr>`}</tbody></table></div>`+legend;
      }
    }else{
      const shipSel=this.isShip()?`<b>${esc(this.shipName(this.myShipCode()))}</b>`:`<select onchange="VoyRecv.mShip=this.value;VoyRecv.render()">${ships.map(s=>`<option value="${esc(s.code)}"${s.code===this.mShip?" selected":""}>${esc(s.name)}（${esc(s.code)}）</option>`).join("")}</select>`;
      const ship=this.isShip()?this.myShipCode():(this.mShip||ships[0]?.code);
      const routine=this.visibleCat(ship).filter(c=>c.active&&c.freq!=="event");
      body=`<div style="margin:8px 0">船舶：${shipSel}</div>
      <div style="overflow:auto"><table class="tbl"><thead><tr><th style="min-width:220px">表單</th><th style="width:80px">週期</th><th colspan="12" style="text-align:center">期別狀態</th></tr></thead>
      <tbody>${routine.map(c=>{
        const P=this.periodsOf(c.freq,year);
        return `<tr><td><span class="mono">${esc(c.code)}</span> ${esc(c.name)}</td><td>${this.FREQ_ZH[c.freq]}</td>${P.map(p=>cell(ship,c,p,year)).join("")}${"<td></td>".repeat(Math.max(0,12-P.length))}</tr>`;
      }).join("")}</tbody></table></div>`+legend;
    }
    host.innerHTML=`<div class="panelbox">
      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
        <b>應繳／實繳矩陣</b>
        <span>年度</span><select onchange="VoyRecv.mYear=parseInt(this.value);VoyRecv.render()">${yearOpts.map(y=>`<option${y===this.mYear?" selected":""}>${y}</option>`).join("")}</select>
        ${modeSel}
      </div>${body}</div>`;
  },
  renderCatalog(host){
    host.innerHTML=`
      <div class="panelbox" style="margin-bottom:12px">
        <details>
          <summary style="cursor:pointer;font-weight:700">☁ 雲端設定說明（首次啟用必讀：建立 voy_submissions 資料表與 voyage-files 儲存桶）</summary>
          <div style="font-size:12.5px;line-height:1.8;margin-top:8px">
            至 Supabase 專案 → SQL Editor 執行以下 SQL（僅需一次，與主系統共用同一個 Supabase 專案）：
            <pre style="background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px;overflow:auto;font-size:11.5px">-- 1) 收件紀錄資料表（逐筆同步）
create table if not exists public.voy_submissions (
  gid text primary key,
  ship text,
  updated bigint,
  payload jsonb
);
alter table public.voy_submissions enable row level security;
create policy "voy anon all" on public.voy_submissions
  for all to anon using (true) with check (true);

-- 2) 檔案儲存桶（公開讀取，anon 可上傳）
insert into storage.buckets (id, name, public)
  values ('voyage-files','voyage-files', true)
  on conflict (id) do nothing;
create policy "voy files insert" on storage.objects
  for insert to anon with check (bucket_id = 'voyage-files');

      <div class="panelbox">
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap">
          <b>表單目錄</b><span class="hint">共 ${this.cat.length} 項（例行 ${this.cat.filter(c=>c.freq!=="event").length}／事故時 ${this.cat.filter(c=>c.freq==="event").length}／已停用 ${this.cat.filter(c=>!c.active).length}）</span>
          <span>船型</span>
          <select onchange="VoyRecv.catVtypeFilter=this.value;VoyRecv.render()">
            <option value=""${!this.catVtypeFilter?" selected":""}>全部</option>
            <option value="all"${this.catVtypeFilter==="all"?" selected":""}>僅「全部適用」</option>
            <option value="tanker"${this.catVtypeFilter==="tanker"?" selected":""}>TANKER（含全部適用）</option>
            <option value="bulk"${this.catVtypeFilter==="bulk"?" selected":""}>BULK（含全部適用）</option>
          </select>
          <span>狀態</span>
          <select onchange="VoyRecv.catActiveFilter=this.value;VoyRecv.render()">
            <option value=""${!this.catActiveFilter?" selected":""}>全部</option>
            <option value="on"${this.catActiveFilter==="on"?" selected":""}>僅啟用</option>
            <option value="off"${this.catActiveFilter==="off"?" selected":""}>僅停用</option>
          </select>
          <button class="btn sm" style="margin-left:auto" onclick="VoyRecv.editCat(null)">＋ 新增表單</button>
          <button class="btn sm" onclick="VoyRecv.pushCatCloud()">☁ 發布目錄到雲端</button>
        </div>
        <table class="tbl">
          <thead><tr><th style="width:110px">編號</th><th>名稱</th><th style="width:80px">船型</th><th style="width:100px">週期</th><th style="width:70px">負責</th><th style="width:80px">收件</th><th style="width:50px">啟用</th><th style="width:140px">動作</th></tr></thead>
          <tbody>${this.cat.filter(c=>{
            let vtOk=true;
            if(this.catVtypeFilter==="all")vtOk=c.vtype==="all";
            else if(this.catVtypeFilter==="tanker"||this.catVtypeFilter==="bulk")vtOk=c.vtype===this.catVtypeFilter||c.vtype==="all";
            const actOk=!this.catActiveFilter||(this.catActiveFilter==="on"?c.active:!c.active);
            return vtOk&&actOk;
          }).map(c=>`<tr${c.active?"":' style="opacity:.45"'}>
            <td class="mono">${esc(c.code)}</td>
            <td>${esc(c.name)}${c.note?`<div class="hint">${esc(c.note)}</div>`:""}${c.needsChecklist?`<div class="hint">🔗 上傳時需複選 SOPEP 檢查表（${c.checklistSet==="tanker"?"TANKER":"BULK"}，共${(this.checklists[c.checklistSet]||[]).length}項）</div>`:""}</td>
            <td>${c.vtype==="all"?"全部":c.vtype==="tanker"?"TANKER":c.vtype==="bulk"?"BULK":"—"}</td>
            <td>${this.FREQ_ZH[c.freq]||c.freq}</td>
            <td>${esc(c.pic||"")}</td>
            <td>${esc(c.sendTo||"")}</td>
            <td>${c.active?"✓":"—"}</td>
            <td><button class="btn sm" onclick="VoyRecv.editCat(${c.id})">✎</button> <button class="btn sm" onclick="VoyRecv.toggleCat(${c.id})">${c.active?"停用":"啟用"}</button> <button class="btn sm" style="color:var(--bad)" onclick="VoyRecv.deleteCat(${c.id})">🗑</button></td>
          </tr>`).join("")}</tbody>
        </table>
      </div>`;
  },
  editCat(id){
    if(!this.isTech()){toast("⚠ 僅海技組可維護目錄");return;}
    const c=id?this.cat.find(x=>x.id===id):null;
    this._editCatId=id;
    this.refreshRosterNames();
    $("#voycat-title").textContent=c?`編輯表單：${c.code||""} ${c.name||""}`:"新增表單";
    $("#voycat-code").value=c?c.code:"";
    $("#voycat-name").value=c?c.name:"";
    $("#voycat-freq").value=c?c.freq:"m";
    $("#voycat-vtype").value=c?c.vtype:"all";
    $("#voycat-pic").value=c?c.pic:"船長";
    $("#voycat-sendto").value=c?c.sendTo:"柯香吟";
    $("#voycat-cc").value=c?c.cc:"船東督導";
    $("#voycat-note").value=c?c.note:"";
    $("#voycat-active").checked=c?!!c.active:true;
    $("#voyCatEditModal").classList.add("show");
  },
  refreshRosterNames(){
    const dl=$("#dl-roster-names");if(!dl)return;
    const names=loadRosterNames();
    dl.innerHTML=names.map(n=>`<option value="${esc(n)}">`).join("");
  },
  saveCatModal(){
    if(writeBlocked())return;
    if(!this.isTech()){toast("⚠ 僅海技組可維護目錄");return;}
    const code=$("#voycat-code").value.trim();
    const name=$("#voycat-name").value.trim();
    if(!name){toast("⚠ 請填寫表單名稱");return;}
    const freq=$("#voycat-freq").value;
    const vtype=$("#voycat-vtype").value;
    const pic=$("#voycat-pic").value.trim();
    const sendTo=$("#voycat-sendto").value.trim();
    const cc=$("#voycat-cc").value.trim();
    const note=$("#voycat-note").value.trim();
    const active=$("#voycat-active").checked;
    const c=this._editCatId?this.cat.find(x=>x.id===this._editCatId):null;
    if(c){Object.assign(c,{code,name,freq,vtype,pic,sendTo,cc,note,active});}
    else{const nid=this.cat.reduce((m,x)=>Math.max(m,x.id||0),0)+1;this.cat.push({id:nid,code,name,en:"",freq,freqText:this.FREQ_ZH[freq],vtype,pic,sendTo,cc,note,active});}
    this.persist();
    Audit.log(c?"編輯":"新增","航次報表目錄",`${code} ${name}（收件人：${sendTo}）`);
    $("#voyCatEditModal").classList.remove("show");
    toast("✓ 已儲存（記得按「發布目錄到雲端」讓全公司同步）");this.render();
  },
  toggleCat(id){
    if(writeBlocked())return;
    if(!this.isTech()){toast("⚠ 僅海技組可維護目錄");return;}
    const c=this.cat.find(x=>x.id===id);if(!c)return;
    c.active=!c.active;this.persist();this.render();
  },
  deleteCat(id){
    if(writeBlocked())return;
    if(!this.isTech()){toast("⚠ 僅海技組可維護目錄");return;}
    const c=this.cat.find(x=>x.id===id);if(!c)return;
    const n=this.subs.filter(s=>s.catId===id).length;
    const msg=n>0
      ?`此表單已有 ${n} 筆收件紀錄（歷史紀錄仍保留、不受影響），刪除後此表單將從應繳清單移除，之後不再產生新期別。確定刪除「${c.code?c.code+" ":""}${c.name}」？`
      :`確定刪除「${c.code?c.code+" ":""}${c.name}」？此動作無法復原。`;
    if(!confirm(msg))return;
    this.cat=this.cat.filter(x=>x.id!==id);
    this.persist();
    Audit.log("刪除","航次報表目錄",`${c.code||""} ${c.name}`);
    toast("✓ 已刪除（記得按「發布目錄到雲端」讓全公司同步）");
    this.render();
  }
};

async function boot(){
  Role.load();
  if(!siteGateOk()||!Role.cur){
    $("#gateMsg").textContent=!siteGateOk()?"請先在主系統完成進站密碼驗證。":"請先在主系統登入操作身份。";
    return;
  }
  $("#gateOverlay").style.display="none";
  $("#appRoot").style.display="block";
  const label=Role.TIER_LABEL[Role.tier()]||Role.tier();
  $("#roleBadge").innerHTML=`<b>${esc(label)}</b>　${esc(Role.name())}`;
  toast("⏳ 載入資料中…");
  await loadShips();
  await loadReadOnly();
  VoyRecv.init();
  VoyRecv.render();
  await VoyRecv.loadCatCloud();
  await VoyRecv.syncCloud(true);
  toast("✓ 資料已載入");
}
boot();
